      alignment: start
      chips:
      - type: template
        icon: mdi:cctv
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set cams = [(''Front Door'',''camera.front_door_live_view''), (''North Wall'',''camera.tapo_c425_north_wall_hd_stream_direct''), (''East Wall'',''camera.tapo_c420_east_wall_hd_stream_direct''), (''South Wall'',''camera.tapo_c420_south_wall_hd_stream_direct''), (''Stockroom'',''camera.tapo_c200_stockroom_hd_stream_direct''), (''Pet Feeder'',''camera.smart_pet_feeder'')] %}{% set ns = namespace(down=[]) %}{% for n,c in cams %}{% if states(c) in [''unavailable'',''unknown'',''none''] %}{% set ns.down = ns.down + [n] %}{% endif %}{% endfor %}{% if ns.down | count == 0 %}{{ ''6/6 在线'' if cn else ''6/6 online'' }}{% elif ns.down | count <= 2 %}{% if cn %}{{ ns.down | join(''、'') }} 离线{% else %}{{ ns.down | join('', '') }} offline{% endif %}{% else %}{% if cn %}{{ ns.down | count }}/6 离线{% else %}{{ ns.down | count }} of 6 offline{% endif %}{% endif %}'
        icon_color: '{% set cams = [(''Front Door'',''camera.front_door_live_view''), (''North Wall'',''camera.tapo_c425_north_wall_hd_stream_direct''), (''East Wall'',''camera.tapo_c420_east_wall_hd_stream_direct''), (''South Wall'',''camera.tapo_c420_south_wall_hd_stream_direct''), (''Stockroom'',''camera.tapo_c200_stockroom_hd_stream_direct''), (''Pet Feeder'',''camera.smart_pet_feeder'')] %}{% set ns = namespace(down=[]) %}{% for n,c in cams %}{% if states(c) in [''unavailable'',''unknown'',''none''] %}{% set ns.down = ns.down + [n] %}{% endif %}{% endfor %}{{ ''green'' if ns.down | count == 0 else (''amber'' if ns.down | count <= 2 else ''red'') }}'
      - type: template
        icon: mdi:door
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% if doors | reject(''in'', bad) | list | count == 0 %}{{ ''传感器离线'' if cn else ''Sensor offline'' }}{% else %}{{ doors | select(''eq'',''on'') | list | count }} {{ ''扇门开启'' if cn else ''open'' }}{% endif %}'
        icon_color: '{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% if doors | reject(''in'', bad) | list | count == 0 %}grey{% elif (doors | select(''eq'',''on'') | list | count) > 0 %}red{% else %}green{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/security
      - type: template
        icon: mdi:motion-sensor
        content: "{% set cn = is_state('input_boolean.chinese_dashboard','on') %}{%\
          \ set m = [\n  states('binary_sensor.living_room_living_hue_hue_sensor_motion'),\n\
          \  states('binary_sensor.bedroom_motion_sensor_motion'),\n  states('binary_sensor.k_motion_sensor_motion'),\n\
          \  states('binary_sensor.sensor_group_motion')\n] %}{% set bad = ['unavailable',\
          \ 'unknown', 'none'] %}{% if m | reject('in', bad) | list | count == 0\
          \ %}{{ '传感器离线' if cn else 'Sensor offline' }}{% elif (m | select('eq','on')\
          \ | list | count) > 0 %}{{ '侦测到移动' if cn else 'Motion' }}{% else %}{{\
          \ '安静' if cn else 'Quiet' }}{% endif %}"
        icon_color: "{% set m = [\n  states('binary_sensor.living_room_living_hue_hue_sensor_motion'),\n\
          \  states('binary_sensor.bedroom_motion_sensor_motion'),\n  states('binary_sensor.k_motion_sensor_motion'),\n\
          \  states('binary_sensor.sensor_group_motion')\n] %}{% set bad = ['unavailable',\
          \ 'unknown', 'none'] %}{% if m | reject('in', bad) | list | count == 0\
          \ %}grey{% elif (m | select('eq','on') | list | count) > 0 %}amber{% else\
          \ %}grey{% endif %}"
      - type: template
        icon: mdi:wan
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set v = states(''binary_sensor.eero_wan_status'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}{{ ''网络无数据'' if cn else ''WAN not reporting'' }}{% elif v == ''on'' %}{{ ''网络在线'' if cn else ''WAN Online'' }}{% else %}{{ ''网络离线'' if cn else ''WAN Offline'' }}{% endif %}'
        icon_color: '{% set v = states(''binary_sensor.eero_wan_status'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}grey{% elif v == ''on'' %}green{% else %}red{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/network
