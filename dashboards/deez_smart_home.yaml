  theme: Deez Energy
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 4px 4px 0px 4px;\n\
          \  margin-bottom: -4px;\n}\n"
      title: ⚡ Energy Now
      subtitle: Live grid import, solar production and estimated house load
    - type: custom:mushroom-template-card
      primary: Grid Import
      secondary: '{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% if g in [''unavailable'', ''unknown'', ''none''] %}Unavailable  •  meter not reporting{% else %}{{ g | float(0) | round(0) | int }} W  •  measured{% endif %}'
      icon: mdi:transmission-tower-import
      icon_color: '{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% if g in [''unavailable'', ''unknown'', ''none''] %}red{% else %}{% set w = g | float(0) %}{% if w > 4000 %}red{% elif w > 2000 %}orange{% elif w > 0 %}blue{% else %}green{% endif %}{% endif %}'
      entity: sensor.powerpal_gateway_powerpal_power
    - type: custom:mushroom-template-card
      primary: Solar Now
      secondary: '{% set s = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if s in [''unavailable'', ''unknown'', ''none''] %}Unavailable  •  inverter not reporting{% else %}{{ s | float(0) | round(0) | int }} W  •  measured{% endif %}'
      icon: mdi:solar-power
      icon_color: '{% set s = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if s in [''unavailable'', ''unknown'', ''none''] %}red{% elif s | float(0) > 0 %}amber{% else %}grey{% endif %}'
      entity: sensor.primo_5_0_1_1_ac_power
    - type: custom:mushroom-template-card
      primary: House Load (estimated)
      secondary: '{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% set s = states(''sensor.primo_5_0_1_1_ac_power'') %}{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% if g in bad %}Unavailable  •  grid meter not reporting{% elif s in bad %}{{ g | float(0) | round(0) | int }} W  •  grid only, solar data unavailable{% else %}{{ (g | float(0) + s | float(0)) | round(0) | int }} W  •  calculated{% endif %}'
      icon: mdi:home-lightning-bolt
      icon_color: '{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% set s = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if g in [''unavailable'', ''unknown'', ''none''] %}red{% else %}{% set load = g | float(0) + (s | float(0)) %}{% if load > 4000 %}red{% elif load > 2000 %}orange{% else %}green{% endif %}{% endif %}'
    - type: markdown
      content: '*Powerpal reads the meter''s optical port, so it reports **grid import
        only** — not whole-house consumption. When solar covers the house it can legitimately
        read 0 W. House Load is therefore calculated as grid import + solar production.
        **Solar export cannot be measured**: neither the Powerpal optical interface
        nor the Fronius meter (in produce-only mode) reports it.*'
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 4px 4px 0px 4px;\n\
          \  margin-bottom: -4px;\n}\n"
      title: 📊 Today
      subtitle: Grid import and solar generation since midnight
    - type: custom:mushroom-template-card
      primary: Grid Import Today
      secondary: '{% set v = states(''sensor.powerpal_gateway_powerpal_daily_energy'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}Unavailable{% else %}{{ v | float(0) | round(2) }} kWh{% endif %}'
      icon: mdi:transmission-tower-import
      icon_color: blue
      entity: sensor.powerpal_gateway_powerpal_daily_energy
    - type: custom:mushroom-template-card
      primary: Solar Today
      secondary: '{% set v = states(''sensor.primo_5_0_1_1_energy_day'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}Unavailable{% else %}{{ (v | float(0) / 1000) | round(2) }} kWh{% endif %}'
      icon: mdi:solar-panel-large
      icon_color: amber
      entity: sensor.primo_5_0_1_1_energy_day
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 4px 4px 0px 4px;\n\
          \  margin-bottom: -4px;\n}\n"
      title: 🔢 Lifetime & Diagnostics
      subtitle: Cumulative meters and inverter detail
    - type: custom:mushroom-template-card
      primary: Solar Year
      secondary: '{% set v = states(''sensor.primo_5_0_1_1_energy_year'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}Unavailable{% else %}{{ (v | float(0) / 1000) | round(1) }} kWh{% endif %}'
      icon: mdi:calendar
