      - type: template
        icon: mdi:arrow-left
        content: '{{ ''首页'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Home'' }}'
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/home
      grid_options:
        columns: 12
