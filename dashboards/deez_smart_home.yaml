kiosk_mode:
  hide_sidebar: true
  hide_header: true
  ignore_per_user: false
theme: Deez Smart Home
views:
- type: sections
  title: Deez Smart Home
  path: home
  icon: mdi:home-assistant
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:mushroom-title-card
      card_mod:
        style: |
          ha-card {
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 4px 4px 0px 4px;
            margin-bottom: -4px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
          }
      title: '{{ ''🏠 Deez 智能家居'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''🏠 Deez Smart Home'' }}'
      subtitle: '{{ ''家庭控制中心'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Home control centre'' }}'
    - type: custom:mushroom-chips-card
      card_mod:
        style: |
          ha-card {
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 0px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
          }
          ha-card .chip-container {
            gap: 8px;
          }
      alignment: start
      chips:
      - type: template
        icon: mdi:translate
        content: English
        icon_color: '{{ ''green'' if is_state(''input_boolean.chinese_dashboard'',''off'')
          else ''grey'' }}'
        tap_action:
          action: perform-action
          perform_action: input_boolean.turn_off
          target:
            entity_id: input_boolean.chinese_dashboard
      - type: template
        icon: mdi:translate
        content: 中文
        icon_color: '{{ ''green'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''grey'' }}'
        tap_action:
          action: perform-action
          perform_action: input_boolean.turn_on
          target:
            entity_id: input_boolean.chinese_dashboard
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: '{{ ''家庭状态'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''House Pulse'' }}'
      secondary: '{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% set doors_unknown = doors | select(''in'', bad) | list | count %}{% set open = doors | reject(''in'', bad) | select(''eq'',''on'') | list | count %}{% set wan = states(''binary_sensor.eero_wan_status'') %}{% set lights = states.light | selectattr(''state'',''eq'',''on'') | list | count %}{% set t = state_attr(''weather.forecast_home'',''temperature'') %}{% set temp = (t | round(0) | int ~ ''°C'') if t is number else ''—'' %}{% if is_state(''input_boolean.chinese_dashboard'',''on'') %}{{ open }} 扇门开启{{ '' • '' ~ doors_unknown ~ '' 个门传感器离线'' if doors_unknown > 0 else '''' }} • {{ lights }} 盏灯 • {{ temp }}{{ '' • 网络无数据'' if wan in bad else ('' • 网络离线'' if wan != ''on'' else '''') }}{% else %}{{ open }} open{{ '' • '' ~ doors_unknown ~ '' door sensor(s) offline'' if doors_unknown > 0 else '''' }} • {{ lights }} lights • {{ temp }}{{ '' • WAN not reporting'' if wan in bad else ('' • Offline'' if wan != ''on'' else '''') }}{% endif %}'
      icon: mdi:home-heart
      icon_color: '{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% set doors_unknown = doors | select(''in'', bad) | list | count %}{% set open = doors | reject(''in'', bad) | select(''eq'',''on'') | list | count %}{% set wan = states(''binary_sensor.eero_wan_status'') %}{{ ''red'' if (open > 0 or (wan not in bad and wan != ''on'')) else (''grey'' if (doors_unknown > 0 or wan in bad) else ''green'') }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/status
    - type: custom:mushroom-chips-card
      card_mod:
        style: |
          ha-card {
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 0px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
          }
          ha-card .chip-container {
            gap: 8px;
          }
      alignment: start
      chips:
      - type: template
        icon: mdi:solar-power
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}{{ ''离线'' if cn else ''Offline'' }}{% else %}{% set p = raw | float(0) %}{{ ((p / 1000) | round(1) ~ '' kW'') if p >= 1000 else (p | round(0) | int ~ '' W'') }}{% endif %}'
        icon_color: '{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}red{% elif raw | float(0) > 0 %}amber{% else %}grey{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
      - type: template
        icon: mdi:lightbulb-group
        content: '{{ states.light | selectattr(''state'',''eq'',''on'') | list | count
          }} on'
        icon_color: '{{ ''amber'' if (states.light | selectattr(''state'',''eq'',''on'')
          | list | count) > 0 else ''grey'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/lights
      - type: template
        icon: mdi:door
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% if doors | reject(''in'', bad) | list | count == 0 %}{{ ''传感器离线'' if cn else ''Sensor offline'' }}{% else %}{{ doors | select(''eq'',''on'') | list | count }} {{ ''扇门开启'' if cn else ''open'' }}{% endif %}'
        icon_color: '{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% set doors = [states(''binary_sensor.m_contact_sensor_door''), states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')] %}{% if doors | reject(''in'', bad) | list | count == 0 %}grey{% elif (doors | select(''eq'',''on'') | list | count) > 0 %}red{% else %}green{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/security
      - type: template
        icon: mdi:cctv
        content: Cameras
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/cameras
      - type: template
        icon: mdi:account
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set d = distance(''zone.home'',''person.raymond_du'') %}{% if d is not number %}{{ ''未知'' if cn else ''Unknown'' }}{% elif d <= 0.1 %}{{ ''在家'' if cn else ''Home'' }}{% else %}{% if cn %}距家 {{ d | round(1) }} 公里{% else %}{{ d | round(1) }} km away{% endif %}{% endif %}'
        icon_color: '{% set d = distance(''zone.home'',''person.raymond_du'') %}{% if d is not number %}grey{% elif d <= 0.1 %}green{% elif d < 50 %}orange{% else %}red{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/people-locations
      - type: template
        icon: mdi:receipt-text
        content: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}{{ ''账单 ?'' if cn else ''Bills ?'' }}{% else %}{% set n = raw | int(0) %}{{ n ~ '' due'' if n > 0 else ''Bills'' }}{% endif %}'
        icon_color: '{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}grey{% elif raw | int(0) > 0 %}orange{% else %}green{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/bills
  - type: grid
    column_span: 2
    cards:
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: 'off'
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: unavailable
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: unknown
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(90deg,
                rgba(127,212,240,0.22) 0%,
                rgba(127,212,240,0.04) 100%);
              border: 1px solid rgba(127,212,240,0.32);
              border-radius: 18px;
              box-shadow: none;
            }
        primary: '{{ states(''climate.bedroom_parents_room_ac'') | title }} • {{ state_attr(''climate.bedroom_parents_room_ac'',''temperature'')
          }}°'
        secondary: '{{ ''父母房空调运行中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Parents AC running'' }}'
        icon: mdi:air-conditioner
        icon_color: cyan
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/climate
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: state
        entity: media_player.living_room_tv_samsung_q9_series_65
        state: playing
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(90deg,
                rgba(176,120,216,0.22) 0%,
                rgba(176,120,216,0.04) 100%);
              border: 1px solid rgba(176,120,216,0.32);
              border-radius: 18px;
              box-shadow: none;
            }
        primary: '{{ state_attr(''media_player.living_room_tv_samsung_q9_series_65'',''media_title'')
          or ''Playing'' }}'
        secondary: '{{ ''客厅电视播放中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Living Room TV'' }}'
        icon: mdi:television-play
        icon_color: purple
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/media
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: state
        entity: binary_sensor.lph_se_dcd9_pump
        state: 'on'
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(90deg,
                rgba(126,214,176,0.22) 0%,
                rgba(126,214,176,0.04) 100%);
              border: 1px solid rgba(126,214,176,0.32);
              border-radius: 18px;
              box-shadow: none;
            }
        primary: '{{ ''水泵运行中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Pump cycling'' }}'
        secondary: '{{ ''LetPot 种植机'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''LetPot garden'' }}'
        icon: mdi:water-pump
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/ray-bedroom
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: numeric_state
        entity: sensor.primo_5_0_1_1_ac_power
        above: 100
      card:
        type: custom:mushroom-template-card
        primary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% set d = states(''sensor.primo_5_0_1_1_energy_day'') %}{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% if raw in bad %}{{ ''逆变器离线'' if cn else ''Inverter offline'' }}{% else %}{% set p = raw | float(0) %}{{ ((p / 1000) | round(2) ~ '' kW'') if p >= 1000 else (p | round(0) | int ~ '' W'') }} • {% if d in bad %}{{ ''今日数据不可用'' if cn else ''today unavailable'' }}{% else %}{{ d | float(0) | round(0) | int }} {{ ''Wh 今日'' if cn else ''Wh today'' }}{% endif %}{% endif %}'
        secondary: '{{ ''太阳能发电中'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Solar producing'' }}'
        icon: mdi:solar-power-variant
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: numeric_state
        entity: sensor.bills_unpaid_count
        above: 0
      card:
        type: custom:mushroom-template-card
        primary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}{{ ''账单状态不可用'' if cn else ''Bills status unavailable'' }}{% else %}{{ raw }} {{ ''笔未付 • $'' if cn else ''unpaid • $'' }}{{ states(''sensor.bills_outstanding_total'') }}{% endif %}'
        secondary: '{{ ''待付账单'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Bills outstanding'' }}'
        icon: mdi:cash-clock
        icon_color: orange
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/bills
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '{{ ''今日概览'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Today'' }}'
      icon: mdi:calendar-today
    - type: custom:mushroom-template-card
      primary: '{% set t = state_attr(''weather.forecast_home'',''temperature'') %}{{
        (t | round(0) ~ ''°C'') if t is number else ''—'' }}'
      secondary: '{% set c = states(''weather.forecast_home'') %}{{ ''—'' if c in
        [''unavailable'',''unknown'',''none''] else c | replace(''-'','' '') | replace(''partlycloudy'',''partly cloudy'')
        | title }}'
      icon: mdi:weather-partly-cloudy
      icon_color: cyan
      entity: weather.forecast_home
      tap_action:
        action: more-info
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: '{% set v = states(''sensor.powerpal_gateway_powerpal_daily_energy'')
        %}{{ ''—'' if v in [''unavailable'',''unknown'',''none''] else (v | float(0)
        | round(1) ~ '' kWh'') }}'
      secondary: '{{ ''今日用电'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Used today'' }}'
      icon: mdi:chart-line
      icon_color: green
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/energy
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: '{% set a = states(''time.lph_se_dcd9_light_on'') %}{% set b = states(''time.lph_se_dcd9_light_off'')
        %}{% set bad = [''unavailable'',''unknown'',''none''] %}{{ ''—'' if a in bad
        or b in bad else a[:5] ~ '' – '' ~ b[:5] }}'
      secondary: '{{ ''种植灯'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Grow light'' }}'
      icon: mdi:sprout
      icon_color: green
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/ray-bedroom
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: '{% set b = states(''sensor.backup_next_scheduled_automatic_backup'')
        %}{{ as_timestamp(b) | timestamp_custom(''%a %H:%M'', true) if b not in [''unknown'',''unavailable'',''none'']
        else ''—'' }}'
      secondary: '{{ ''下次备份'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Next backup'' }}'
      icon: mdi:backup-restore
      icon_color: indigo
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/status
      grid_options:
        columns: 3
  - type: grid
    cards:
    - type: heading
      heading: '{{ ''快速控制'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Quick Control'' }}'
      icon: mdi:tune-variant
    - type: tile
      entity: light.living_room
      name: Living Room
      features_position: inline
      features:
      - type: light-brightness
    - type: tile
      entity: light.dining
      name: Dining
      icon: mdi:light-recessed
      features_position: inline
      features:
      - type: light-brightness
    - type: tile
      entity: light.bedroom_bedroom
      name: Ray Bedroom
      features_position: inline
      features:
      - type: light-brightness
    - type: tile
      entity: switch.mainroomlight_switch_1
      name: Parents Main
      icon: mdi:light-switch
  - type: grid
    cards:
    - type: heading
      heading: '{{ ''房间'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Rooms'' }}'
      icon: mdi:view-grid
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''客厅'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Living Room'' }}'
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'',''unknown'',''none''] %}{% set t = states(''sensor.living_room_living_hue_hue_sensor_temperature'') %}{% set temp = ''—'' if t in bad else (t | float(0) | round(1) ~ ''°C'') %}{{ temp }}{{ (('' • 前门开启'' if cn else '' • Door open'')) if is_state(''binary_sensor.f_contact_sensor_door'',''on'') else '''' }}'
      icon: mdi:sofa
      icon_color: '{{ ''red'' if is_state(''binary_sensor.f_contact_sensor_door'',''on'') else (''amber'' if is_state(''light.living_room'',''on'') else ''grey'') }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/living-room
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''父母房'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Parents Room'' }}'
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'',''unknown'',''none''] %}{% set t = states(''sensor.bedroom_motion_sensor_temperature'') %}{% set h = states(''sensor.bedroom_motion_sensor_humidity'') %}{% set ac = states(''climate.bedroom_parents_room_ac'') %}{% set temp = ''—'' if t in bad else (t | float(0) | round(1) ~ ''°C'') %}{% if ac not in bad and ac != ''off'' %}{{ temp }} • {{ ''空调'' if cn else ''AC'' }} {{ ac | replace(''_'','' '') | title }}{% else %}{{ temp }}{{ '''' if h in bad else '' • '' ~ (h | float(0) | round(0) | int) ~ ''%'' }}{% endif %}'
      icon: mdi:bed-king
      icon_color: '{% set ac = states(''climate.bedroom_parents_room_ac'') %}{{ ''cyan'' if ac not in [''off'',''unavailable'',''unknown''] else (''amber'' if is_state(''switch.mainroomlight_switch_1'',''on'') else ''grey'') }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/parents-room
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''Ray 房间'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Ray Bedroom'' }}'
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set s = states(''cover.aqara_roller_shade_driver_e1'') %}{% if s == ''open'' %}{% set shade = ''窗帘开'' if cn else ''Shade open'' %}{% elif s == ''closed'' %}{% set shade = ''窗帘关'' if cn else ''Shade closed'' %}{% else %}{% set shade = ''—'' %}{% endif %}{{ shade }}{{ (('' • 种植机'' if cn else '' • Garden on'')) if is_state(''switch.lph_se_dcd9_power'',''on'') else '''' }}'
      icon: mdi:bed
      icon_color: '{{ ''amber'' if is_state(''light.bedroom_bedroom'',''on'') else ''grey'' }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/ray-bedroom
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''厨房'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Kitchen'' }}'
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'',''unknown'',''none''] %}{% if is_state(''binary_sensor.lg_fridge_door'',''on'') %}{{ ''冰箱门开启'' if cn else ''Fridge door open'' }}{% else %}{% set f = states(''number.lg_fridge_fridge_temperature'') %}{{ ''—'' if f in bad else ((''冰箱 '' if cn else ''Fridge '') ~ (f | float(0) | round(0) | int) ~ ''°C'') }}{% endif %}'
      icon: mdi:silverware-fork-knife
      icon_color: '{% set plugs = [states(''switch.k_top_p100''), states(''switch.k_bot_p100''), states(''switch.k_coffee_p100'')] %}{{ ''red'' if is_state(''binary_sensor.lg_fridge_door'',''on'') else (''amber'' if (plugs | select(''eq'',''on'') | list | count) > 0 else ''grey'') }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/kitchen
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''餐厅'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Dining'' }}'
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set bad = [''unavailable'',''unknown'',''none''] %}{% set lx = states(''sensor.sensor_group_illuminance'') %}{{ ''—'' if lx in bad else (lx | float(0) | round(0) | int) ~ '' lx'' }}{{ (('' • 有人'' if cn else '' • Motion'')) if is_state(''binary_sensor.sensor_group_motion'',''on'') else '''' }}'
      icon: mdi:table-chair
      icon_color: '{{ ''amber'' if is_state(''light.dining'',''on'') else ''grey'' }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/dining
    - type: custom:mushroom-template-card
      grid_options:
        columns: 6
      primary: '{{ ''车库'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Garage'' }}'
