            box-shadow: none;
            padding: 4px 4px 0px 4px;
            margin-bottom: -4px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
          }
      title: '{{ ''⚡ 能源'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''⚡ Energy'' }}'
      subtitle: '{{ ''实时功率、当日用量与累计读数'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Live power, daily totals and lifetime meters'' }}'
    - type: markdown
      content: '*Powerpal reads the meter''s optical port, so it reports **grid import
        only** — not whole-house consumption. When solar covers the house it can legitimately
        read 0 W. House Load is therefore calculated as grid import + solar production.
        **Solar export cannot be measured**: neither the Powerpal optical interface
        nor the Fronius meter (in produce-only mode) reports it.*'
  - type: grid
    cards:
    - type: heading
      heading: '{{ ''当前'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Now'' }}'
      icon: mdi:flash
    - type: custom:mushroom-template-card
      primary: Grid Import
      secondary: '{% set cn = is_state(''input_boolean.chinese_dashboard'',''on'') %}{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% if g in [''unavailable'', ''unknown'', ''none''] %}{{ ''不可用 • 电表无数据'' if cn else ''Unavailable  •  meter not reporting'' }}{% else %}{{ g | float(0) | round(0) | int }} {{ ''W • 实测'' if cn else ''W  •  measured'' }}{% endif %}'
      icon: mdi:transmission-tower-import
      icon_color: '{% set g = states(''sensor.powerpal_gateway_powerpal_power'') %}{% if g in [''unavailable'', ''unknown'', ''none''] %}red{% else %}{% set w = g | float(0) %}{% if w > 4000 %}red{% elif w > 2000 %}orange{% elif w > 0 %}blue{% else %}green{% endif %}{% endif %}'
