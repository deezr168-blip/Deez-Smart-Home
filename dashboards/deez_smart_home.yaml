        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/home
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-title-card
      card_mod:
        style: |
          ha-card {
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 4px 4px 0px 4px;
            margin-bottom: -4px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
          }
      title: '{{ ''📹 摄像头'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''📹 Cameras'' }}'
      subtitle: '{{ ''实时监控 • 点按查看全屏'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Live surveillance • tap any camera for full view'' }}'
    - type: custom:mushroom-chips-card
      card_mod:
        style: |
          ha-card {
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 0px;
            text-shadow: 0 1px 3px rgba(4, 10, 20, 0.55);
