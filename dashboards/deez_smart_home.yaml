# maintenance-framework bootstrap test marker (reverted immediately)
kiosk_mode:
  hide_sidebar: true
  hide_header: true
  ignore_per_user: false
theme: Deez Smart Home
views:
- type: sections
  title: Deez Smart Home
  path: home
  icon: mdi:home-assistant
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 4px 4px 0px 4px;\n\
          \  margin-bottom: -4px;\n}\n"
      title: '{{ ''🏠 Deez 智能家居'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''🏠 Deez Smart Home'' }}'
      subtitle: '{{ ''家庭控制中心'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Home control centre'' }}'
    - type: custom:mushroom-chips-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 0px;\n}\nha-card\
          \ .chip-container {\n  gap: 8px;\n}\n"
      alignment: start
      chips:
      - type: template
        icon: mdi:translate
        content: English
        icon_color: '{{ ''green'' if is_state(''input_boolean.chinese_dashboard'',''off'')
          else ''grey'' }}'
        tap_action:
          action: perform-action
          perform_action: input_boolean.turn_off
          target:
            entity_id: input_boolean.chinese_dashboard
      - type: template
        icon: mdi:translate
        content: 中文
        icon_color: '{{ ''green'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''grey'' }}'
        tap_action:
          action: perform-action
          perform_action: input_boolean.turn_on
          target:
            entity_id: input_boolean.chinese_dashboard
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: '{{ ''家庭状态'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''House Pulse'' }}'
      secondary: "{% set doors = [states('binary_sensor.m_contact_sensor_door'), states('binary_sensor.f_contact_sensor_door'),\
        \ states('binary_sensor.b_contact_sensor_door')] %} {% set open = doors |\
        \ select('eq','on') | list | count %} {% set wan = is_state('binary_sensor.eero_wan_status','on')\
        \ %} {% set lights = states.light | selectattr('state','eq','on') | list |\
        \ count %} {% set t = state_attr('weather.forecast_home','temperature') %}\
        \ {% if is_state('input_boolean.chinese_dashboard','on') %}\n  {{ open }}\
        \ 扇门开启 • {{ lights }} 盏灯 • {{ t }}°C{{ ' • 网络离线' if not wan else '' }}\n{%\
        \ else %}\n  {{ open }} open • {{ lights }} lights • {{ t }}°C{{ ' • Offline'\
        \ if not wan else '' }}\n{% endif %}"
      icon: mdi:home-heart
      icon_color: '{% set doors = [states(''binary_sensor.m_contact_sensor_door''),
        states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')]
        %} {% set open = doors | select(''eq'',''on'') | list | count %} {{ ''red''
        if open > 0 or not is_state(''binary_sensor.eero_wan_status'',''on'') else
        ''green'' }}'
      tap_action:
        action: navigate
        navigation_path: /deez-smart-home/status
    - type: custom:mushroom-chips-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 0px;\n}\nha-card\
          \ .chip-container {\n  gap: 8px;\n}\n"
      alignment: start
      chips:
      - type: template
        icon: mdi:solar-power
        content: '{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}Offline{% else %}{% set p = raw | float(0) %}{{ ((p / 1000) | round(1) ~ '' kW'') if p >= 1000 else (p | round(0) | int ~ '' W'') }}{% endif %}'
        icon_color: '{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}red{% elif raw | float(0) > 0 %}amber{% else %}grey{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
      - type: template
        icon: mdi:lightbulb-group
        content: '{{ states.light | selectattr(''state'',''eq'',''on'') | list | count
          }} on'
        icon_color: '{{ ''amber'' if (states.light | selectattr(''state'',''eq'',''on'')
          | list | count) > 0 else ''grey'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/lights
      - type: template
        icon: mdi:door
        content: '{% set doors = [states(''binary_sensor.m_contact_sensor_door''),
          states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')]
          %} {{ doors | select(''eq'',''on'') | list | count }} open'
        icon_color: '{% set doors = [states(''binary_sensor.m_contact_sensor_door''),
          states(''binary_sensor.f_contact_sensor_door''), states(''binary_sensor.b_contact_sensor_door'')]
          %} {{ ''red'' if (doors | select(''eq'',''on'') | list | count) > 0 else
          ''green'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/security
      - type: template
        icon: mdi:cctv
        content: Cameras
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/cameras
      - type: template
        icon: mdi:account
        content: '{{ states(''person.raymond_du'') }}'
        icon_color: '{{ ''green'' if is_state(''person.raymond_du'',''home'') else
          ''blue'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/people-locations
      - type: template
        icon: mdi:weather-partly-cloudy
        content: '{{ state_attr(''weather.forecast_home'',''temperature'') }}°'
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/status
      - type: template
        icon: mdi:receipt-text
        content: '{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}Bills ?{% else %}{% set n = raw | int(0) %}{{ n ~ '' due'' if n > 0 else ''Bills'' }}{% endif %}'
        icon_color: '{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}grey{% elif raw | int(0) > 0 %}orange{% else %}green{% endif %}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/bills
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: 'off'
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: unavailable
      - condition: state
        entity: climate.bedroom_parents_room_ac
        state_not: unknown
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: linear-gradient(90deg,\n    rgba(52,216,224,0.20)\
            \ 0%,\n    rgba(52,216,224,0.05) 100%);\n  border: 1px solid rgba(52,216,224,0.30);\n\
            \  border-radius: 18px;\n  box-shadow: none;\n}\n"
        primary: '{{ states(''climate.bedroom_parents_room_ac'') | title }} • {{ state_attr(''climate.bedroom_parents_room_ac'',''temperature'')
          }}°'
        secondary: '{{ ''父母房空调运行中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Parents AC running'' }}'
        icon: mdi:air-conditioner
        icon_color: cyan
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/climate
    - type: conditional
      conditions:
      - condition: state
        entity: media_player.living_room_tv_samsung_q9_series_65
        state: playing
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: linear-gradient(90deg,\n    rgba(192,66,255,0.20)\
            \ 0%,\n    rgba(192,66,255,0.05) 100%);\n  border: 1px solid rgba(192,66,255,0.30);\n\
            \  border-radius: 18px;\n  box-shadow: none;\n}\n"
        primary: '{{ state_attr(''media_player.living_room_tv_samsung_q9_series_65'',''media_title'')
          or ''Playing'' }}'
        secondary: '{{ ''客厅电视播放中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Living Room TV'' }}'
        icon: mdi:television-play
        icon_color: purple
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/media
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.lph_se_dcd9_pump
        state: 'on'
      card:
        type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: linear-gradient(90deg,\n    rgba(52,211,153,0.20)\
            \ 0%,\n    rgba(52,211,153,0.05) 100%);\n  border: 1px solid rgba(52,211,153,0.30);\n\
            \  border-radius: 18px;\n  box-shadow: none;\n}\n"
        primary: '{{ ''水泵运行中'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Pump cycling'' }}'
        secondary: '{{ ''LetPot 种植机'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''LetPot garden'' }}'
        icon: mdi:water-pump
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/ray-bedroom
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.primo_5_0_1_1_ac_power
        above: 100
      card:
        type: custom:mushroom-template-card
        primary: '{% set raw = states(''sensor.primo_5_0_1_1_ac_power'') %}{% set d = states(''sensor.primo_5_0_1_1_energy_day'') %}{% set bad = [''unavailable'', ''unknown'', ''none''] %}{% if raw in bad %}Inverter offline{% else %}{% set p = raw | float(0) %}{{ ((p / 1000) | round(2) ~ '' kW'') if p >= 1000 else (p | round(0) | int ~ '' W'') }} • {% if d in bad %}today unavailable{% else %}{{ d | float(0) | round(0) | int }} Wh today{% endif %}{% endif %}'
        secondary: '{{ ''太阳能发电中'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Solar producing'' }}'
        icon: mdi:solar-power-variant
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.bills_unpaid_count
        above: 0
      card:
        type: custom:mushroom-template-card
        primary: '{% set raw = states(''sensor.bills_unpaid_count'') %}{% if raw in [''unavailable'', ''unknown'', ''none''] %}Bills status unavailable{% else %}{{ raw }} unpaid • ${{ states(''sensor.bills_outstanding_total'') }}{% endif %}'
        secondary: '{{ ''待付账单'' if is_state(''input_boolean.chinese_dashboard'',''on'') else ''Bills outstanding'' }}'
        icon: mdi:cash-clock
        icon_color: orange
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/bills
  - type: grid
    cards:
    - type: custom:mushroom-chips-card
      card_mod:
        style: "ha-card {\n  background: none;\n  border: none;\n  box-shadow: none;\n\
          \  padding: 2px 2px 0px 2px;\n}\nha-card .chip-container {\n  gap: 8px;\n\
          }\n"
      alignment: justify
      chips:
      - type: template
        icon: mdi:home-flood
        content: '{{ ''家'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Casa'' }}'
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/home
      - type: template
        icon: mdi:check-circle
        content: '{{ (''已连接'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Connected'') if is_state(''binary_sensor.eero_wan_status'',''on'')
          else (''离线'' if is_state(''input_boolean.chinese_dashboard'',''on'') else
          ''Offline'') }}'
        icon_color: '{{ ''green'' if is_state(''binary_sensor.eero_wan_status'',''on'')
          else ''red'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/network
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: linear-gradient(180deg,\n    rgba(255,138,61,0.22)\
            \ 0%,\n    rgba(255,138,61,0.05) 100%);\n  border: 1px solid rgba(255,138,61,0.35);\n\
            \  border-radius: 22px;\n  box-shadow: 0 8px 22px rgba(0,0,0,0.45);\n\
            \  min-height: 168px;\n}\n"
        primary: "{% set doors = [\n  states('binary_sensor.f_contact_sensor_door'),\n\
          \  states('binary_sensor.m_contact_sensor_door'),\n  states('binary_sensor.b_contact_sensor_door')\n\
          ] %} {{ doors | select('eq','on') | list | count }} open"
        secondary: '{{ ''门禁'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Access'' }}'
        icon: "{% set doors = [\n  states('binary_sensor.f_contact_sensor_door'),\n\
          \  states('binary_sensor.m_contact_sensor_door'),\n  states('binary_sensor.b_contact_sensor_door')\n\
          ] %} {{ 'mdi:lock-open-variant' if (doors | select('eq','on') | list | count)\
          \ > 0 else 'mdi:lock' }}"
        icon_color: "{% set doors = [\n  states('binary_sensor.f_contact_sensor_door'),\n\
          \  states('binary_sensor.m_contact_sensor_door'),\n  states('binary_sensor.b_contact_sensor_door')\n\
          ] %} {{ 'orange' if (doors | select('eq','on') | list | count) > 0 else\
          \ 'green' }}"
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/security
      - type: vertical-stack
        cards:
        - type: custom:mushroom-template-card
          card_mod:
            style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
              \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
              \ none;\n  margin-bottom: 6px;\n}\n"
          primary: '{% set t = state_attr(''weather.forecast_home'',''temperature'')
            %} {{ (t | round(0) ~ ''°C'') if t is not none else states(''weather.forecast_home'')
            }}'
          secondary: '{{ states(''weather.forecast_home'') | replace(''-'','' '')
            | title }}'
          icon: mdi:weather-partly-cloudy
          icon_color: cyan
          entity: weather.forecast_home
          tap_action:
            action: more-info
        - type: custom:mushroom-template-card
          card_mod:
            style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
              \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
              \ none;\n  margin-bottom: 6px;\n}\n"
          primary: '{{ states(''time.lph_se_dcd9_light_on'')[:5] }} – {{ states(''time.lph_se_dcd9_light_off'')[:5]
            }}'
          secondary: '{{ ''种植灯'' if is_state(''input_boolean.chinese_dashboard'',''on'')
            else ''Grow light'' }}'
          icon: mdi:sprout
          icon_color: green
          tap_action:
            action: navigate
            navigation_path: /deez-smart-home/ray-bedroom
        - type: custom:mushroom-template-card
          card_mod:
            style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
              \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
              \ none;\n}\n"
          primary: '{% set b = states(''sensor.backup_next_scheduled_automatic_backup'')
            %} {{ as_timestamp(b) | timestamp_custom(''%a %H:%M'', true) if b not
            in [''unknown'',''unavailable'',''none''] else ''—'' }}'
          secondary: '{{ ''下次备份'' if is_state(''input_boolean.chinese_dashboard'',''on'')
            else ''Next backup'' }}'
          icon: mdi:backup-restore
          icon_color: indigo
          tap_action:
            action: navigate
            navigation_path: /deez-smart-home/status
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
            \ none;\n}\n"
        primary: "{% set doors = [\n  states('binary_sensor.f_contact_sensor_door'),\n\
          \  states('binary_sensor.m_contact_sensor_door'),\n  states('binary_sensor.b_contact_sensor_door')\n\
          ] %} {{ doors | select('eq','on') | list | count }} open"
        secondary: '{{ ''门禁'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Access'' }}'
        icon: mdi:lock-open-variant
        icon_color: "{% set doors = [\n  states('binary_sensor.f_contact_sensor_door'),\n\
          \  states('binary_sensor.m_contact_sensor_door'),\n  states('binary_sensor.b_contact_sensor_door')\n\
          ] %} {{ 'orange' if (doors | select('eq','on') | list | count) > 0 else\
          \ 'green' }}"
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/security
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{{ states.light | selectattr(''state'',''eq'',''on'') | list | count
          }} on'
        secondary: '{{ ''灯光'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Lights'' }}'
        icon: mdi:lightbulb
        icon_color: '{{ ''amber'' if (states.light | selectattr(''state'',''eq'',''on'')
          | list | count) > 0 else ''grey'' }}'
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/lights
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 18px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{% set v = states(''sensor.powerpal_gateway_powerpal_daily_energy'') %}{% if v in [''unavailable'', ''unknown'', ''none''] %}—{% else %}{{ v | float(0) | round(1) }} kWh{% endif %}'
        secondary: '{{ ''今日'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Today'' }}'
        icon: mdi:chart-line
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
    - type: grid
      columns: 4
      square: false
      cards:
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 22px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{{ ''房间'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Rooms'' }}'
        icon: mdi:view-grid
        icon_color: blue
        layout: vertical
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/home
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 22px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{{ ''控制'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Controls'' }}'
        icon: mdi:tune-variant
        icon_color: purple
        layout: vertical
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/ipad-command-center
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 22px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{{ ''摄像头'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Cameras'' }}'
        icon: mdi:camera
        icon_color: cyan
        layout: vertical
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/cameras
      - type: custom:mushroom-template-card
        card_mod:
          style: "ha-card {\n  background: rgba(255,255,255,0.07);\n  border: 1px\
            \ solid rgba(255,255,255,0.12);\n  border-radius: 22px;\n  box-shadow:\
            \ none;\n}\n"
        primary: '{{ ''能源'' if is_state(''input_boolean.chinese_dashboard'',''on'')
          else ''Energy'' }}'
        icon: mdi:lightning-bolt
        icon_color: amber
        layout: vertical
        tap_action:
          action: navigate
          navigation_path: /deez-smart-home/energy
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
          \ none;\n  border: none;\n  box-shadow: none;\n  padding: 4px 4px 0px 4px;\n\
          \  margin-bottom: -4px;\n}\n"
      title: '{{ ''快速控制'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Quick Control'' }}'
      subtitle: '{{ ''常用设备'' if is_state(''input_boolean.chinese_dashboard'',''on'')
        else ''Most-used devices'' }}'
    - type: custom:mushroom-light-card
      entity: light.living_room
      name: Living Room
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
    - type: custom:mushroom-light-card
      entity: light.dining
      name: Dining
      show_brightness_control: true
      collapsible_controls: true
      icon: mdi:light-recessed
    - type: custom:mushroom-light-card
      entity: light.bedroom_bedroom
      name: Ray Bedroom
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
    - type: custom:mushroom-entity-card
      entity: switch.mainroomlight_switch_1
      name: Parents Main
      icon: mdi:light-switch
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      card_mod:
        style: "ha-card {\n  background: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter:\
