        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 备份与更新
      heading_style: title
      icon: mdi:backup-restore
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.backup_last_successful_automatic_backup
      name: Last backup
    - type: tile
      entity: sensor.backup_next_scheduled_automatic_backup
      name: Next backup
    - type: tile
      entity: update.home_assistant_core_update
      name: Home Assistant Core
    - type: tile
      entity: update.home_assistant_supervisor_update
      name: Supervisor
    - type: tile
      entity: update.home_assistant_operating_system_update
      name: Operating System
    - type: tile
      entity: update.bedroom_parents_room_ac_firmware
      name: Parents Room AC firmware
    # 74 update entities exist. Listing them as tiles would bury this page,
    # and listing a hand-picked few would quietly hide the rest -- a firmware
    # update nobody can see is one nobody installs. This counts them live off
    # `states.update`, so it stays correct as devices come and go and cannot
    # go stale against a hardcoded list.
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set ups = states.update | list -%}
        {% set pending = ups | selectattr('state','eq','on') | list -%}
        {% set quiet = ups | rejectattr('state','in',['on','off']) | list -%}
        {% set np = pending | count %}{% set nq = quiet | count -%}
        {% if np %}{% if cn %}**{{ np }} 项更新待安装：**{{ pending |
        map(attribute='name') | join('、') }}。{% else %}**{{ np }} update{{ ''
        if np == 1 else 's' }} available:** {{ pending | map(attribute='name') |
        join(', ') }}.{% endif %} {% endif %}{% if nq %}{% if cn %}{{ nq }}
        个设备的更新状态无数据。{% else %}{{ nq }} device{{ '' if nq == 1 else 's' }} {{
        'is' if nq == 1 else 'are' }} not reporting an update state.{% endif %}
        {% endif %}{% if not np and not nq %}{% if cn %}{{ ups | count }}
        个更新实体全部为最新。{% else %}All {{ ups | count }} update entities are up to
        date.{% endif %}{% endif %}

# ===========================================================================
# ALERTS. The unified alert centre from briefing section 16, built from the
# conditions that real entities can actually express. Severity is by
# condition, not by a stored level: no notification entity exists, so
# "mark as read", alert history and quiet hours are not implemented rather
# than faked.
# ===========================================================================
- type: sections
  title: Alerts
  path: alerts
  icon: mdi:bell-alert
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '通知' if is_state('input_boolean.chinese_dashboard','on') else
        'ALERTS' }}

        {{ '目前需要注意的事项' if is_state('input_boolean.chinese_dashboard','on')
        else 'What needs attention right now' }}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Critical
      heading_style: title
      icon: mdi:alert-octagon
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 严重
      heading_style: title
      icon: mdi:alert-octagon
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.eero_wan_status
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.eero_wan_status
        name: Internet connection is down
        icon: mdi:wan
        color: red
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        name: Garage freezer circuit overloaded
        icon: mdi:flash-alert
        color: red
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.emergency_button_dad_cloud_connection
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.emergency_button_dad_cloud_connection
        name: Dad's emergency button is not connected
        icon: mdi:bell-off
        color: red
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.emergency_button_mum_cloud_connection
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.emergency_button_mum_cloud_connection
        name: Mum's emergency button is not connected
        icon: mdi:bell-off
        color: red

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Warnings
      heading_style: title
      icon: mdi:alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 警告
      heading_style: title
      icon: mdi:alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.f_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.f_contact_sensor_door
        name: Front door open
        color: orange
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.b_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.b_contact_sensor_door
        name: Backyard door open
        color: orange
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.lg_fridge_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.lg_fridge_door
        name: Fridge door open
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.front_door_battery
        below: 30
      card:
        type: tile
        entity: sensor.front_door_battery
        name: Front Door battery low
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.living_room_ringring_battery
        below: 30
      card:
        type: tile
        entity: sensor.living_room_ringring_battery
        name: RingRing battery low
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.tapo_c425_north_wall_battery
        below: 30
      card:
        type: tile
        entity: sensor.tapo_c425_north_wall_battery
        name: North Wall camera battery low
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.aqara_roller_shade_driver_e1_battery
        below: 30
      card:
        type: tile
        entity: sensor.aqara_roller_shade_driver_e1_battery
        name: Roller shade battery low
        color: orange

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Information
      heading_style: title
      icon: mdi:information-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 提示
      heading_style: title
      icon: mdi:information-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        name: Parents Room AC filter needs cleaning
        color: blue
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.primo_5_0_1_1_ac_power
        state: unavailable
      card:
        type: tile
        entity: sensor.primo_5_0_1_1_ac_power
        name: Solar inverter offline
        color: blue
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.lph_se_dcd9_pump
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.lph_se_dcd9_pump
        name: Grow unit pump running
        color: blue
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% if cn
        %}此处的严重程度由实时状态计算得出。已读标记、通知历史与免打扰时段**尚未实现**：本实例没有任何通知或持久化警报实体来保存这些状态，而一个每次刷新就忘记的已读标记比没有更糟。{%
        else %}Severity here is computed from live conditions. Mark-as-read, alert
        history and quiet hours are **not implemented**: no notification or
        persistent-alert entity exists in this instance to store that state, and a read
        flag that forgets itself on every refresh would be worse than none.{% endif %}
