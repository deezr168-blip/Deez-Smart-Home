        namespace(on=0, unk=0) %} {% for m in ms %}{% set s = states(m) %}{% if s
        in ['unavailable','unknown'] %}{% set ns.unk = ns.unk + 1 %}{% elif s !=
        'off' %}{% set ns.on = ns.on + 1 %}{% endif %}{% endfor %} {% if cn %}{{ ms |
        count }} 台设备中 {{ ns.on }} 台使用中{% if ns.unk %} · {{ ns.unk }} 台无数据{%
        endif %}{% else %}{{ ns.on }} of {{ ms | count }} players active{% if ns.unk %}
