  # Detection settings are shown, not operated. Every tile here opens
  # more-info rather than toggling: privacy mode blinds a camera and a
  # detection switch is what makes it watch, so switching one off from a wall
  # panel should never be one accidental tap. The value of the section is that
  # a protection gap someone left switched off becomes visible.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Detection settings
      heading_style: title
      icon: mdi:cctv
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 侦测设置
      heading_style: title
      icon: mdi:cctv
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set priv = ['switch.tapo_c425_north_wall_privacy',
        'switch.tapo_c200_stockroom_privacy',
        'switch.smart_pet_feeder_privacy_mode'] -%}
        {% set det = ['switch.front_door_motion_detection',
        'switch.tapo_c420_south_wall_motion_detection',
        'switch.tapo_c420_south_wall_person_detection',
        'switch.tapo_camera_bcca_motion_detection',
        'switch.tapo_camera_bcca_person_detection',
        'switch.smart_pet_feeder_motion_alarm'] -%}
        {% set ns = namespace(blind=0, off=0, unk=0) -%}
        {% for e in priv %}{% set v = states(e) %}{% if v == 'on' %}{% set
        ns.blind = ns.blind + 1 %}{% elif v != 'off' %}{% set ns.unk = ns.unk +
        1 %}{% endif %}{% endfor -%}
        {% for e in det %}{% set v = states(e) %}{% if v == 'off' %}{% set
        ns.off = ns.off + 1 %}{% elif v != 'on' %}{% set ns.unk = ns.unk + 1
        %}{% endif %}{% endfor -%}
        {% if ns.blind %}{% if cn %}**{{ ns.blind }} 个摄像头处于隐私模式，未在录制。**{% else
        %}**{{ ns.blind }} camera{{ '' if ns.blind == 1 else 's' }} {{ 'is' if
        ns.blind == 1 else 'are' }} in privacy mode and not recording.**{% endif
        %} {% endif %}{% if ns.off %}{% if cn %}**{{ ns.off }} 项侦测功能已关闭。**{%
        else %}**{{ ns.off }} detection setting{{ '' if ns.off == 1 else 's' }}
        {{ 'is' if ns.off == 1 else 'are' }} switched off.**{% endif %} {% endif
        %}{% if ns.unk %}{% if cn %}{{ ns.unk }} 项设置无数据。{% else %}{{ ns.unk }}
        setting{{ '' if ns.unk == 1 else 's' }} {{ 'is' if ns.unk == 1 else
        'are' }} not reporting.{% endif %} {% endif %}{% if not ns.blind and not
        ns.off and not ns.unk %}{% if cn %}所有摄像头均在监控中，隐私模式全部关闭，侦测功能全部开启。{%
        else %}Every camera is watching. Privacy mode is off everywhere and all
        detection settings are on.{% endif %}{% endif %}
    - type: tile
      entity: switch.front_door_motion_detection
      name: Front Door motion
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: more-info}
    - type: tile
      entity: switch.front_door_in_home_chime
      name: Front Door chime
