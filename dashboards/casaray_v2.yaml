      camera_view: auto
      show_state: false
      grid_options: {columns: 6, rows: 4}
      tap_action: {action: navigate, navigation_path: /casaray-v2/camera-south-wall}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Camera batteries
      heading_style: subtitle
      icon: mdi:battery
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 摄像头电池
      heading_style: subtitle
      icon: mdi:battery
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.front_door_battery
      name: Front Door
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.front_door_last_activity
      name: Front Door last seen
      icon: mdi:motion-sensor
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.tapo_c425_north_wall_battery
      name: North Wall
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.tapo_c420_south_wall_battery
