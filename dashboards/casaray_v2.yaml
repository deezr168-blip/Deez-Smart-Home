    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% if cn
        %}此处的严重程度由实时状态计算得出。已读标记、通知历史与免打扰时段**尚未实现**：本实例没有任何通知或持久化警报实体来保存这些状态，而一个每次刷新就忘记的已读标记比没有更糟。{%
        else %}Severity here is computed from live conditions. Mark-as-read, alert
        history and quiet hours are **not implemented**: no notification or
        persistent-alert entity exists in this instance to store that state, and a read
        flag that forgets itself on every refresh would be worse than none.{% endif %}
