        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set mp = [('media_player.living_room_tv_samsung_q9_series_65','Living Room TV','客厅电视'),
                      ('media_player.55_qled_4k_ai_qa55q7faawxxy','Parents Room TV','父母房电视'),
                      ('media_player.q70f8036','Ray Bedroom TV','Ray 卧室电视'),
                      ('media_player.pogo','Pogo','Pogo')] -%}
        {%- set ns = namespace(live=[], idle=0, quiet=0) -%}
        {%- for m, en, zh in mp %}{% set s = states(m) %}{% if s in ['playing','paused','on','buffering'] %}{% set ns.live = ns.live + [zh if cn else en] %}{% elif s in ['off','idle','standby'] %}{% set ns.idle = ns.idle + 1 %}{% else %}{% set ns.quiet = ns.quiet + 1 %}{% endif %}{% endfor -%}
        **{{ '正在使用' if cn else 'In use' }}**
        {% if ns.quiet == mp | count %}## —
        {{ '没有播放设备报告状态' if cn else 'No media player is reporting' }}{% else %}## {{ ns.live | count }}/{{ (ns.live | count) + ns.idle }}
        {% if ns.live %}{{ ns.live | join('、') if cn else ns.live | join(', ') }}{% else %}{{ '全部处于待机或关闭' if cn else 'Everything is idle or off' }}{% endif %}{% endif %}

        {% if ns.quiet %}{{ ('另有 %d 台设备无数据，未计入。' % ns.quiet) if cn else (('1 more is not reporting and is left out of the count.' if ns.quiet == 1 else '%d more are not reporting and are left out of the count.' % ns.quiet)) }}{% else %}{{ '四台设备全部有数据。' if cn else 'All 4 are reporting.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
