# ===========================================================================
# HOUSE HEALTH. Also absorbs Network -- an eero WAN binary sensor and a
# remote-UI sensor do not justify a page of their own, and the briefing
# forbids empty pages. Throughput, uptime and a device map have no sensors.
# ===========================================================================
- type: sections
  title: House Health
  path: house-health
  icon: mdi:heart-pulse
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '系统健康' if is_state('input_boolean.chinese_dashboard','on') else
        'HOUSE HEALTH' }}

        {{ '系统状态与维护' if is_state('input_boolean.chinese_dashboard','on')
        else 'System status and maintenance' }}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Overall
      heading_style: title
      icon: mdi:stethoscope
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 总体
      heading_style: title
      icon: mdi:stethoscope
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.house_status
      name: House status
      grid_options: {columns: 12, rows: 1}
    # NOT devices. This counts unavailable *entities*: the B1 export of the
    # same instance holds 232 unavailable entities against this sensor's live
    # 228, and the two offline Tapo cameras alone account for 48 of them --
    # one dead device drags all of its entities down with it. Labelled
    # "Offline devices" it made roughly twenty offline devices look like two
    # hundred. See CR-200.
    - type: tile
      entity: sensor.casa_offline_devices
      name: Unavailable entities
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.active_rooms_count
      name: Rooms in use
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.house_lights_on
      name: Lights on
      grid_options: {columns: 4, rows: 1}
    # Why the tile above and the paragraph below disagree, said once, so
    # nobody has to reconcile 228 against 8 by eye.
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set e = states('sensor.casa_offline_devices') | int(-1) -%}
        {% if cn %}**“不可用实体”与下方的“设备离线”统计的不是同一件事。**{% if e >= 0 %}上方的 {{ e }} 是不可用的**实体**数量，不是设备数量。{% endif %}一台设备离线，它的全部实体都会随之不可用——仅东墙与南墙两台 Tapo 摄像头就占了约 48 个实体。下方段落统计的是本仪表板明确列出的九台**设备**。电池传感器无数据、更新实体无数据，也各自计入上方的实体总数。{% else %}**"Unavailable entities" and "devices offline" below are not counting the same thing.**{% if e >= 0 %} The {{ e }} above is a count of **entities**, not devices.{% endif %} One dead device takes all of its entities with it — the East and South Wall Tapo cameras alone account for around 48 of them. The paragraph below counts the nine named **devices** this dashboard tracks. A battery sensor that stops reporting and an update entity that stops reporting each add to the entity total too, without a device being off.{% endif %}
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set bats = [('Front
        Door','前门','sensor.front_door_battery'),
        ('RingRing','门铃','sensor.living_room_ringring_battery'), ('North Wall
        camera','北墙摄像头','sensor.tapo_c425_north_wall_battery'), ('East Wall
        camera','东墙摄像头','sensor.tapo_camera_bcca_battery'), ('South Wall
        camera','南墙摄像头','sensor.tapo_c420_south_wall_battery'), ('Roller
        shade','卷帘','sensor.aqara_roller_shade_driver_e1_battery'),
        ('Powerpal','Powerpal','sensor.powerpal_gateway_powerpal_battery'), ('Gas
        meter','燃气表','sensor.gas_meter_pulse_sensor_battery'),
        ('Fridge','冰箱','sensor.kitchen_electrolux_fridge_battery'), ('Living Room
        switch','客厅开关','sensor.living_room_livingroomswitch_battery'), ('Living Room
        motion','客厅动作传感器','sensor.living_room_living_hue_hue_sensor_battery'), ('Living Hue
        sensor','客厅 Hue 传感器','sensor.master_bedroom_living_hue_hue_sensor_battery'), ('Dining
        motion','餐厅动作传感器','sensor.living_room_living_room_battery'), ('Ray Bedroom
        switch','Ray 卧室开关','sensor.bedroom_bedlightswitch_battery'), ('Bedroom Hue
        sensor','卧室 Hue 传感器','sensor.master_bedroom_bedroom_hue_sensor_battery')] -%} {% set devs =
        ['camera.tapo_c420_east_wall_hd_stream_direct',
        'camera.tapo_c420_south_wall_hd_stream_direct',
        'sensor.primo_5_0_1_1_ac_power', 'media_player.pogo', 'light.kogan_tv',
        'light.living_room_hue_ambiance_spot_1',
        'light.living_room_hue_ambiance_spot_2',
        'light.living_room_hue_ambiance_spot_3',
        'light.living_room_hue_ambiance_spot_4'] -%} {% set ns =
        namespace(low=[], unk=[], down=0) -%} {% for n, z, b in bats %}{% set s =
        states(b) %}{% if s in ['unavailable','unknown','none',''] %}{% set
        ns.unk = ns.unk + [z if cn else n] %}{% else %}{% set f = s | float(-1) %}{% if f < 0
        %}{% set ns.unk = ns.unk + [z if cn else n] %}{% elif f < 30 %}{% set ns.low = ns.low +
        [z if cn else n] %}{% endif %}{% endif %}{% endfor -%} {% for d in devs %}{% if
        states(d) in ['unavailable','unknown'] %}{% set ns.down = ns.down + 1 %}{%
        endif %}{% endfor -%} {% set wan =
        states('binary_sensor.eero_wan_status') -%} {% if wan == 'on' %}{{ '网络已连接。'
        if cn else 'Internet is up.' }}{% elif wan == 'off' %}{{ '**网络连接已断开。**' if
        cn else '**The internet connection is down.**' }}{% else %}{{
        '**WAN 传感器无数据。**' if cn else '**The WAN sensor is not reporting.**' }}{%
        endif %} {% if ns.low | count %}{% if cn %} **{{ ns.low | count }} 个电池电量低于
        30%：**{{ ns.low | join('、') }}。{% else %} **{{ ns.low | count }} batter{{
        'y is' if (ns.low | count) == 1 else 'ies are' }} under 30%:** {{ ns.low |
        join(', ') }}.{% endif %}{% endif %}{% if ns.unk | count %}{%
        if cn %} {{ ns.unk | count }} 个电池无数据：{{ ns.unk | join('、') }}。{% else %} {{
        ns.unk | count }} batter{{ 'y is' if (ns.unk | count) == 1 else 'ies are' }} not
        reporting: {{ ns.unk | join(', ') }}.{% endif %}{% endif %}{% if ns.down
        %}{% if cn %} **{{ ns.down }} 个设备离线。**{% else %} **{{ ns.down }} device{{
        '' if ns.down == 1 else 's' }} {{ 'is' if ns.down == 1 else 'are' }}
        offline.**{% endif %}{% endif %}{% if not (ns.low | count) and not (ns.unk | count) and not
        ns.down and wan == 'on' %}{{ ' 其他一切正常。' if cn else ' Nothing else needs
        attention.' }}{% endif %}

  - type: grid
    column_span: 1
    cards:
