# LIVING ROOM. Media, lighting and the front door live here.
# The four Hue ambiance spots are retained and will read unavailable while
# the bridge is down -- the cards are correct, the bridge is not answering.
# ===========================================================================
- type: sections
  title: Living Room
  path: living-room
  icon: mdi:sofa
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
