        {% if p %}{{ '已付' if cn else 'Paid' }}{% elif ts is none %}{{ '未付 · 无到期日' if cn else 'Unpaid · no due date' }}{% else %}{% set days = ((ts - as_timestamp(now())) / 86400) | round(0, 'ceil') | int %}{% if days < 0 %}{{ ('逾期 %d 天' % (0 - days)) if cn else ('%d day%s overdue' % (0 - days, '' if days == -1 else 's')) }}{% elif days == 0 %}{{ '今天到期' if cn else 'Due today' }}{% else %}{{ ('%d 天后到期' % days) if cn else ('Due in %d day%s' % (days, '' if days == 1 else 's')) }}{% endif %}{% endif %}{% if ts is not none %} · {{ as_timestamp(d) | timestamp_custom('%d/%m') }}{% endif %}{% if sv is not none and sv > 0 %} · {{ '已省' if cn else 'saved' }} ${{ '%.2f' | format(sv) }}{% endif %}{% endif %}
  # -----------------------------------------------------------------------
  # Band: what is coming, beside what to do about it. Paired rather than
  # stacked because a lone half-width section leaves the other half of its
  # row empty (DR-013), and because these two are read together -- the list
  # says which bill is next, the buttons beside it record that it was paid.
  # -----------------------------------------------------------------------
      card_mod:
        style: |
          ha-card {
            {% set a = states('input_number.rego_amount') | float(none) %}
            {% set t = as_timestamp(states('input_datetime.rego_due'), default=none) %}
            {% if a is none or a <= 0 %}
            background: var(--casaray-grey-bg);
            border-color: var(--casaray-grey-border);
            border-style: dashed;
            {% elif is_state('input_boolean.rego_paid','on') %}
            background: var(--casaray-green-bg);
            border-color: var(--casaray-green-border);
            {% elif t is not none and t < as_timestamp(now()) %}
            background: var(--casaray-red-bg);
            border-color: var(--casaray-red-border);
            {% elif t is not none and t < as_timestamp(now()) + 604800 %}
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
            {% endif %}
          }

  - type: grid
