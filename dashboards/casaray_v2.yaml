        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.kitchen_electrolux_fridge_temperature') | float(none) -%}
        {% if t is not none %}**{{ t | round(1) }} °C** · {{ '冰箱' if cn else 'fridge' }}{% else %}**—** · {{ '冰箱无数据' if cn else 'fridge not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('binary_sensor.lg_fridge_door') -%}
        {% if s == 'on' %}**{{ '冰箱门开启' if cn else 'Fridge door open' }}**{% elif s == 'off' %}**{{ '冰箱已关闭' if cn else 'Fridge closed' }}**{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '冰箱门无数据' if cn else 'fridge door not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set es = ['switch.k_coffee_p100','switch.k_top_p100','switch.k_bot_p100'] -%}
        {%- set ns = namespace(on=0, unk=0) -%}
        {%- for e in es %}{% set s = states(e) %}{% if s == 'on' %}{% set ns.on = ns.on + 1 %}{% elif s != 'off' %}{% set ns.unk = ns.unk + 1 %}{% endif %}{% endfor -%}
        **{{ ns.on }}/{{ es | count }}** · {{ '插座已开启' if cn else 'plugs on' }}{% if ns.unk %} · {{ ns.unk }} {{ '无数据' if cn else 'not reporting' }}{% endif %}

