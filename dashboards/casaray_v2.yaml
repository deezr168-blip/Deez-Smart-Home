      entities:
      - entity: sensor.g_monitor_freezer_p110m_current_consumption
        name: Freezer power

  # Level-3: the freezer socket's protection and auto-off configuration.
  # Power protection matters here -- this socket runs a freezer.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Device settings
