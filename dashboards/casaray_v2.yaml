      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '父母房' if is_state('input_boolean.chinese_dashboard','on') else
        'PARENTS ROOM' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set t = states('sensor.bedroom_motion_sensor_temperature') | float(none) -%}
        {% set o = states('binary_sensor.bedroom_parents_room_ac_room_occupied') -%}
        {% if t is not none %}{{ t | round(1) }} °C{% else %}{{ '温度无数据' if cn
        else 'Temperature not reporting' }}{% endif %}{% if o == 'on' %}{{ ' · 有人' if
        cn else ' · occupied' }}{% elif o == 'off' %}{{ ' · 无人' if cn else ' · empty'
        }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  # Status chips, per the room mockups' row under the header: a bold value and
  # a muted caption for the things you glance at on the way past. Two across
  # rather than the render's five, for the iPad reason the Home KPI strip is
  # 2x2. Every chip names its subject when the entity stops reporting.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('binary_sensor.bedroom_parents_room_ac_room_occupied') -%}
        {% if s == 'on' %}**{{ '有人' if cn else 'Occupied' }}** · {{ '父母房' if cn else 'parents room' }}{% elif s == 'off' %}**{{ '无人' if cn else 'Empty' }}** · {{ '父母房' if cn else 'parents room' }}{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '父母房无数据' if cn else 'parents room not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.bedroom_motion_sensor_temperature') | float(none) -%}
        {% if t is not none %}**{{ t | round(1) }} °C** · {% if t >= 18 and t <= 25 %}{{ '舒适' if cn else 'Comfortable' }}{% elif t < 18 %}{{ '偏冷' if cn else 'Cool' }}{% else %}{{ '偏热' if cn else 'Warm' }}{% endif %}{% else %}**—** · {{ '温度无数据' if cn else 'temperature not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.bedroom_motion_sensor_humidity') | float(none) -%}
        {% if t is not none %}**{{ t | round(0) | int }}%** · {{ '湿度' if cn else 'humidity' }}{% else %}**—** · {{ '湿度无数据' if cn else 'humidity not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set h = states('climate.bedroom_parents_room_ac') -%}
        {%- set en = {'off':'Off','cool':'Cooling','heat':'Heating','dry':'Dry','fan_only':'Fan only','auto':'Auto','heat_cool':'Auto'} -%}
        {%- set zh = {'off':'已关闭','cool':'制冷','heat':'制热','dry':'除湿','fan_only':'仅送风','auto':'自动','heat_cool':'自动'} -%}
        {% if h not in ['unavailable','unknown','none',''] %}**{{ zh.get(h, h) if cn else en.get(h, h) }}** · {{ '空调' if cn else 'air conditioner' }}{% else %}**—** · {{ '空调无数据' if cn else 'air conditioner not reporting' }}{% endif %}

