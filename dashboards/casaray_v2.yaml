      name: Expected today
      grid_options: {columns: 4, rows: 1}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Metered circuits
      heading_style: title
      icon: mdi:meter-electric
      visibility:
      - condition: state
