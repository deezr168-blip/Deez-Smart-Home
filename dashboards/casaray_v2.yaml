        {%- set ts = as_timestamp(d, default=none) -%}
        {%- set p = is_state('input_boolean.elec_bill_paid','on') -%}
        **{{ '电费' if cn else 'Electricity' }}**
        {% if a is none or a == 0 %}## —
        {{ '未设置' if cn else 'Not set up' }}{% else %}## ${{ '%.2f' | format(a) }}
        {% if p %}{{ '已付' if cn else 'Paid' }}{% elif ts is none %}{{ '未付 · 无到期日' if cn else 'Unpaid · no due date' }}{% else %}{% set days = ((ts - as_timestamp(now())) / 86400) | round(0, 'ceil') | int %}{% if days < 0 %}{{ ('逾期 %d 天' % (0 - days)) if cn else ('%d day%s overdue' % (0 - days, '' if days == -1 else 's')) }}{% elif days == 0 %}{{ '今天到期' if cn else 'Due today' }}{% else %}{{ ('%d 天后到期' % days) if cn else ('Due in %d day%s' % (days, '' if days == 1 else 's')) }}{% endif %}{% endif %}{% if ts is not none %} · {{ as_timestamp(d) | timestamp_custom('%d/%m') }}{% endif %}{% if sv is not none and sv > 0 %} · {{ '已省' if cn else 'saved' }} ${{ '%.2f' | format(sv) }}{% endif %}{% endif %}
      # Semantic colour, per the 14/09 system: red is a fault, amber is
