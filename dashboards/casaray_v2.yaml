  # -------------------------------------------------------------------------
  # The chip strip. Four tall KPI cards became one pill row, as on Home and
  # Security. Every binding is kept, including the `casa_solar_online` gate:
  # SolarNet keeps publishing 0 W while the inverter is unreachable, so the
  # solar chips read "no data" rather than a zero that looks like a real
  # measurement. The conditional note below says so in words when it happens.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {%- set p = states('sensor.powerpal_gateway_powerpal_power') | float(none) -%}
        {%- set hd = states('sensor.powerpal_gateway_powerpal_daily_energy') | float(none) -%}
        {#- Three states, not two. `on` means generating figures are real; `off`
            means the inverter is genuinely unreachable and we can say so; but
            when the gate sensor itself is unavailable we know nothing, and
            printing "Offline" would be asserting a state we cannot see. -#}
        {%- set gate = states('binary_sensor.casa_solar_online') -%}
        {%- set up = gate == 'on' -%}
        {%- set s = states('sensor.primo_5_0_1_1_ac_power') | float(none) -%}
        {#- energy_day is Wh. Convert at the binding so nothing downstream can
            mix it with the kWh figures beside it. -#}
        {%- set sdw = states('sensor.primo_5_0_1_1_energy_day') | float(none) -%}
        {%- set sd = (sdw / 1000) if sdw is not none else none -%}
        {%- set pv = ((p / 1000) | round(2) ~ ' kW') if p is not none else nd -%}
        {%- set hv = (hd | round(1) ~ ' kWh') if hd is not none else nd -%}
        {#- Offline is its own word, not `No data`: the difference between "the
            inverter is not answering" and "the reading is missing" is the whole
            point of the gate. Both solar chips say the same thing so the row
            cannot read as one working chip beside one broken one; the dashed
            note directly below spells it out in full. -#}
        {%- set off = ('离线' if cn else 'Offline') if gate == 'off' else nd -%}
        {%- set sv = (((s | round(0) | int) ~ ' W') if s is not none else nd) if up else off -%}
        {%- set dv = (((sd | round(1)) ~ ' kWh') if sd is not none else nd) if up else off -%}
        {{ '家庭用电' if cn else 'House power' }} **{{ pv }}** · {{ '今日用电' if cn else 'Today' }} **{{ hv }}** · {{ '当前发电' if cn else 'Solar now' }} **{{ sv }}** · {{ '今日发电' if cn else 'Solar today' }} **{{ dv }}**
      card_mod:
        style: |
          ha-card {
            border-radius: 999px;
            background: var(--casaray-surface-3);
            border-color: var(--casaray-border-strong);
          }
    - type: conditional
      grid_options: {columns: 12, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.casa_solar_online
        state_not: 'on'
      card:
        type: markdown
        content: |
          {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
          {#- The conditional fires on `state_not: on`, which is both "the
              inverter said no" and "the gate sensor itself is dark". Those are
              different facts and the card says which one it has. -#}
          {%- set gate = states('binary_sensor.casa_solar_online') -%}
          {%- if gate == 'off' -%}
          **{{ '太阳能逆变器离线' if cn else 'Solar inverter offline' }}**
          {{ '发电数据不可用。' if cn else 'Solar generation data unavailable.' }}
          {%- else -%}
          **{{ '太阳能状态未知' if cn else 'Solar status unknown' }}**
          {{ '逆变器监测本身无数据，发电量无法确认。' if cn else 'The inverter monitor is not reporting, so generation cannot be confirmed.' }}
          {%- endif -%}
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-grey-bg);
              border-color: var(--casaray-grey-border);
              border-style: dashed;
            }

