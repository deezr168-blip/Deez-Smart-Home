  # Floodlights are controls, not display-only like the detection switches on
  # Security: turning one on adds light and adds protection, so a tap here
  # cannot reduce it. Only the two that report are shown -- the South and East
  # Wall floodlights follow their cameras and are currently unavailable.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Floodlights
      heading_style: subtitle
      icon: mdi:track-light
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
