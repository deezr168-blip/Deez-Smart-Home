    cards:
    - type: heading
      heading: Emergency buttons
      heading_style: title
      icon: mdi:bell-alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 紧急按钮
      heading_style: title
      icon: mdi:bell-alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set d =
        states('binary_sensor.emergency_button_dad_cloud_connection') -%} {% set m =
        states('binary_sensor.emergency_button_mum_cloud_connection') -%} {% set
        ns = namespace(down=0, unk=0) -%} {% for s in [d, m] %}{% if s == 'off'
        %}{% set ns.down = ns.down + 1 %}{% elif s != 'on' %}{% set ns.unk =
        ns.unk + 1 %}{% endif %}{% endfor -%} {% if ns.unk %}{% if cn %}**2
        个紧急按钮中有 {{ ns.unk }} 个无数据。**无法确认状态。{% else %}**{{ ns.unk }} of
        2 emergency buttons are not reporting.** Their status cannot be confirmed.{%
        endif %}{% elif ns.down %}{% if cn %}**2 个紧急按钮中有 {{ ns.down }}
        个离线。**{% else %}**{{ ns.down }} of 2 emergency buttons are offline.**{%
        endif %}{% else %}{{ '两个紧急按钮均已连接。' if cn else 'Both emergency buttons
        are connected.' }}{% endif %}
    - type: tile
      entity: binary_sensor.emergency_button_dad_cloud_connection
      name: Dad's button
      icon: mdi:bell-ring
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: binary_sensor.emergency_button_mum_cloud_connection
      name: Mum's button
      icon: mdi:bell-ring
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.emergency_button_dad_signal_level
      name: Dad's signal
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.emergency_button_mum_signal_level
      name: Mum's signal
      grid_options: {columns: 6, rows: 1}
    # The two button-press events -- event.master_bedroom_emergency_button_dad_main
    # and event.master_bedroom_emergency_button_mum_main -- both read
    # `unavailable` in the B1 export. Adding them as tiles would put two
    # permanently blank cards on an elder-safety page; saying nothing would let
    # "Both emergency buttons are connected" be read as "a press will be seen".
    # Neither is acceptable, so the card states its own scope. See CR-195: the
    # owner needs to press one and confirm what actually happens.
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% if cn %}以上显示的是按钮与云端的连接状态和信号强度。两个按键事件实体目前均无数据，因此按下按钮不会在此显示。请勿仅凭此页判断紧急按钮可用。{%
        else %}What is shown above is the buttons' cloud connection and signal
        strength. Both button-press event entities are currently not reporting,
        so a press would not appear here. Do not treat this page alone as proof
        the emergency buttons work.{% endif %}

