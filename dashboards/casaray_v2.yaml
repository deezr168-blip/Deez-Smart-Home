      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {%- set v = states('sensor.bedroom_motion_sensor_temperature') | float(none) -%}
        {%- set V = ((v | round(1)) ~ '°') if v is not none else nd -%}
        {%- set v0 = V -%}
        {%- set v = states('sensor.bedroom_motion_sensor_humidity') | float(none) -%}
        {%- set V = ((v | round(0) | int) ~ '%') if v is not none else nd -%}
        {%- set v1 = V -%}
        {%- set s = states('climate.bedroom_parents_room_ac') -%}
        {%- set t = state_attr('climate.bedroom_parents_room_ac','temperature') | float(none) -%}
        {%- if s in ['unavailable','unknown','none',''] %}{% set V = nd %}
        {%- elif s == 'off' %}{% set V = '关闭' if cn else 'Off' %}
        {%- else %}{% set mode = {'cool': '制冷', 'heat': '制热', 'dry': '除湿', 'fan_only': '送风', 'auto': '自动', 'heat_cool': '自动'} %}
        {%- set label = (mode.get(s, s) if cn else (s | replace('_',' ') | capitalize)) %}
        {%- set V = (label ~ ' ' ~ (t | round(0) | int) ~ '°') if t is not none else label %}{% endif -%}
        {%- set v2 = V -%}
        {{ '室温' if cn else 'Room' }} **{{ v0 }}** · {{ '湿度' if cn else 'Humidity' }} **{{ v1 }}** · {{ '空调' if cn else 'Air conditioner' }} **{{ v2 }}**
      card_mod:
