# ===========================================================================
# RAY BEDROOM. Bed, blind, and the LetPot hydroponic grow unit, which is
# genuinely room-specific content the old dashboard under-used.
# ===========================================================================
- type: sections
  title: Ray Bedroom
  path: ray-bedroom
  icon: mdi:bed
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Back
      icon: mdi:arrow-left
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ 'Ray 房间' if is_state('input_boolean.chinese_dashboard','on') else
        'RAY BEDROOM' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set l = states('light.bedroom_bedroom') %}{% set c =
        states('cover.aqara_roller_shade_driver_e1') %}{% if l == 'on' %}{{ '灯开启' if
        cn else 'Light on' }}{% elif l == 'off' %}{{ '灯关闭' if cn else 'Light off'
        }}{% else %}{{ '灯无数据' if cn else 'Light not reporting' }}{% endif %} · {% if
        c == 'open' %}{{ '窗帘已打开' if cn else 'blind open' }}{% elif c == 'closed'
        %}{{ '窗帘已关闭' if cn else 'blind closed' }}{% else %}{{ '窗帘无数据' if cn
        else 'blind not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}


  # Status chips, per the room mockups' row under the header: a bold value and
  # a muted caption for the things you glance at on the way past. Two across
  # rather than the render's five, for the iPad reason the Home KPI strip is
  # 2x2. Every chip names its subject when the entity stops reporting.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set l = states('light.bedroom_bedroom') -%}
        {%- set b = state_attr('light.bedroom_bedroom','brightness') -%}
        {% if l == 'on' %}**{{ '灯光已开' if cn else 'Lights on' }}**{% if b is not none %} · {{ (b | float / 255 * 100) | round(0) | int }}%{% endif %}{% elif l == 'off' %}**{{ '灯光已关' if cn else 'Lights off' }}**{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '灯光无数据' if cn else 'lights not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('cover.aqara_roller_shade_driver_e1') -%}
        {% if s == 'open' %}**{{ '卷帘已开' if cn else 'Blind open' }}**{% elif s == 'closed' %}**{{ '卷帘已关' if cn else 'Blind closed' }}**{% elif s in ['opening','closing'] %}**{{ '动作中' if cn else 'Moving' }}**{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '卷帘无数据' if cn else 'blind not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.r_energy_monitor_p110m_current_consumption') | float(none) -%}
        {% if t is not none %}**{{ t | round(0) | int }} W** · {{ '当前功率' if cn else 'drawing now' }}{% else %}**—** · {{ '当前功率无数据' if cn else 'drawing now not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('switch.lph_se_dcd9_power') -%}
        {% if s == 'on' %}**{{ '种植机已开' if cn else 'Grow unit on' }}**{% elif s == 'off' %}**{{ '种植机已关' if cn else 'Grow unit off' }}**{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '种植机无数据' if cn else 'grow unit not reporting' }}{% endif %}

