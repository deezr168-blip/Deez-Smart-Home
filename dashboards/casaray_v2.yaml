# ===========================================================================
# PEOPLE. Human-readable presence only. Raw GPS coordinates stay out of the
# normal interface. B1 confirmed phone trackers and battery entities; the UI
# exposes readable presence and battery status, not tracker internals.
# ===========================================================================
- type: sections
  title: People
  path: people
  icon: mdi:account-group
  max_columns: 2
  # The chip strip, per the 14/09 mockups: a pill row under the page header,
  # dim label then bright value -- `Outside 10°`, `Room 19.7°`, `Movement
  # Quiet`. A native badge is exactly that pill, so this needs no custom card
  # and no card_mod. Page-specific, three or four at most, every one a real
  # entity: nothing here is a computed figure a badge cannot honestly show.
  # Bilingual the way headings are -- two badges with opposite `visibility`,
  # because a badge name cannot be templated either.
  badges:
  - type: entity
    entity: zone.home
    name: Home
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state_not: 'on'
  - type: entity
    entity: zone.home
    name: 在家
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state: 'on'
  - type: entity
    entity: person.raymond_du
    name: Ray
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state_not: 'on'
  - type: entity
    entity: person.raymond_du
    name: Ray
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state: 'on'
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ '家人' if is_state('input_boolean.chinese_dashboard','on') else
        'People' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}{% set ps = ['person.raymond_du', 'person.vinh_du',
        'person.ai_q_huang'] -%} {% set ns = namespace(home=0, away=0, unk=0) -%}
        {% for p in ps -%}{% set s = states(p) -%}{% if s == 'home' %}{% set
        ns.home = ns.home + 1 -%}{% elif s in ['unavailable','unknown','none','']
        %}{% set ns.unk = ns.unk + 1 -%}{% else %}{% set ns.away = ns.away + 1
        -%}{% endif %}{% endfor -%} {% if cn %}{{ ns.home }} 人在家 · {{ ns.away }} 人外出{%
        if ns.unk %} · {{ ns.unk }} 人未知{% endif %}{% else %}{{ ns.home }} home · {{
        ns.away }} out{% if ns.unk %} · {{ ns.unk }} unknown{% endif %}{% endif %}
    # Time over date, right-aligned, DD/MM/YY -- never %Y. `nowrap` is a
    # guarantee where a `columns` value is only a bet (DR-012).
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        ## {{ now().strftime('%I:%M %p').lstrip('0').lower() }}
        {{ now().strftime('%d/%m/%y') }}
      card_mod:
        style: |
          ha-card { text-align: right; white-space: nowrap; }
    # The shared nav rail. Identical on every board and room page so the
    # dashboard reads as one application; the current page's icon is tinted
    # amber, which is the render's selected state.
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}


  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set people = ['person.raymond_du','person.vinh_du','person.ai_q_huang'] -%}
        {%- set ns = namespace(home=[], away=[], unk=0) -%}
        {%- for p in people %}{% set s = states(p) %}{% set n = state_attr(p,'friendly_name') or p %}{% if s == 'home' %}{% set ns.home = ns.home + [n] %}{% elif s in ['unavailable','unknown','none'] %}{% set ns.unk = ns.unk + 1 %}{% else %}{% set ns.away = ns.away + [n] %}{% endif %}{% endfor -%}
        **{{ '在家' if cn else 'At home' }}**
        ## {{ ns.home | count }}/{{ people | count }}
        {% if ns.home %}{{ ns.home | join('、') if cn else ns.home | join(', ') }}{% elif ns.unk == people | count %}{{ '没有成员报告位置' if cn else 'Nobody is reporting a location' }}{% else %}{{ '家中无人' if cn else 'Nobody is home' }}{% endif %}

        {{ '外出' if cn else 'Away' }} **{{ ns.away | count }}**{% if ns.unk %} · {{ '位置无数据' if cn else 'Location unknown' }} **{{ ns.unk }}**{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {#- zone.home is Home Assistant's own count of everything tracked in
            the Home zone, which includes device trackers that are not tied to
            a person. It can therefore disagree with the person count above,
            and that disagreement is the point of showing both. -#}
        {%- set z = states('zone.home') | int(none) -%}
        {%- set people = ['person.raymond_du','person.vinh_du','person.ai_q_huang'] -%}
        {%- set ns = namespace(home=0) -%}
        {%- for p in people %}{% if is_state(p,'home') %}{% set ns.home = ns.home + 1 %}{% endif %}{% endfor -%}
        **{{ '住宅区域' if cn else 'Home zone' }}**
        {% if z is not none %}## {{ z }}
        {{ '个被追踪对象在住宅范围内' if cn else ('tracker in the home zone' if z == 1 else 'trackers in the home zone') }}{% else %}## —
        {{ '住宅区域没有报告数量' if cn else 'The home zone is not reporting a count' }}{% endif %}

        {% if z is not none and z != ns.home %}{{ '与上方按成员统计的 %d 不一致：住宅区域也会统计未绑定成员的设备。' % ns.home if cn else 'Differs from the %d counted by person above: the zone also counts trackers not tied to a person.' % ns.home }}{% else %}{{ '与按成员统计的结果一致。' if cn else 'Agrees with the count by person.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set devs = [('sensor.raymonds_iphone_battery_level','Ray iPhone','Ray iPhone'),
                        ('sensor.raymonds_ipad_battery_level','Ray iPad','Ray iPad'),
                        ('sensor.ais_iphone_battery_level','Ai iPhone','Ai iPhone'),
                        ('sensor.vine_s_phone_battery_level','Vinh phone','Vinh 手机')] -%}
        {%- set ns = namespace(low=none, who='', n=0, dead=0) -%}
        {%- for b, en, zh in devs %}{% set v = states(b) | float(none) %}{% if v is not none %}{% set ns.n = ns.n + 1 %}{% if ns.low is none or v < ns.low %}{% set ns.low = v %}{% set ns.who = zh if cn else en %}{% endif %}{% else %}{% set ns.dead = ns.dead + 1 %}{% endif %}{% endfor -%}
        **{{ '设备电量' if cn else 'Device battery' }}**
        {% if ns.low is not none %}## {{ ns.low | round(0) | int }}%
        {{ (ns.who ~ ' 电量最低') if cn else ('Lowest is ' ~ ns.who) }}{% else %}## —
        {{ '没有设备报告电量' if cn else 'No device is reporting a battery level' }}{% endif %}

        {{ ns.n }}{{ '/' }}{{ devs | count }} {{ '台设备有数据' if cn else 'devices reporting' }}{% if ns.dead %} · {{ ns.dead }} {{ '台无数据' if cn else 'not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {#- Only Ray's iPhone reports distance and activity; the other phones
            expose battery alone. The card says so rather than implying the
            household is one person. -#}
        {%- set d = states('sensor.raymonds_iphone_distance') | float(none) -%}
        {%- set u = state_attr('sensor.raymonds_iphone_distance','unit_of_measurement') or '' -%}
        {%- set a = states('sensor.raymonds_iphone_activity') -%}
        **{{ 'RAY 的 iPhone' if cn else 'Ray’s iPhone' }}**
        {% if d is not none %}## {{ d | round(1) }} {{ u }}
        {{ '距离住宅' if cn else 'from home' }}{% else %}## —
        {{ '距离传感器无数据' if cn else 'The distance sensor is not reporting' }}{% endif %}

        {{ '活动状态' if cn else 'Activity' }} **{{ a if a not in ['unavailable','unknown','none',''] else '—' }}** · {{ '仅此设备报告距离与活动。' if cn else 'Only this device reports distance and activity.' }}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Household
      heading_style: title
      icon: mdi:account-multiple
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 家庭
      heading_style: title
      icon: mdi:account-multiple
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: person.raymond_du
      name: Raymond
    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: person.vinh_du
      name: Vinh
    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: person.ai_q_huang
      name: Ai Q
    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: zone.home
      name: In home zone
      icon: mdi:home-account
    # more-info rather than a tap-toggle: guest mode may drive automations
