        state: 'on'
    - type: thermostat
      entity: climate.bedroom_parents_room_ac
      features:
      - type: climate-hvac-modes

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Readings
      heading_style: title
      icon: mdi:thermometer-lines
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
