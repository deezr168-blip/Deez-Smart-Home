      - type: numeric-input
        style: buttons
    - type: tile
      entity: switch.lg_fridge_express_mode
      name: Express mode
      icon: mdi:snowflake-alert

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Electrolux fridge
      heading_style: subtitle
      icon: mdi:fridge-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 伊莱克斯冰箱
      heading_style: subtitle
      icon: mdi:fridge-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.kitchen_electrolux_fridge_temperature
      name: Temperature
