- type: sections
  title: Bills
  path: bills
  icon: mdi:file-document-outline
  max_columns: 2
  # The chip strip, per the 14/09 mockups: a pill row under the page header,
  # dim label then bright value -- `Outside 10°`, `Room 19.7°`, `Movement
  # Quiet`. A native badge is exactly that pill, so this needs no custom card
  # and no card_mod. Page-specific, three or four at most, every one a real
  # entity: nothing here is a computed figure a badge cannot honestly show.
  # Bilingual the way headings are -- two badges with opposite `visibility`,
  # because a badge name cannot be templated either.
  badges:
  - type: entity
    entity: sensor.bills_outstanding_total
    name: Outstanding
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state_not: 'on'
  - type: entity
    entity: sensor.bills_outstanding_total
    name: 未付总额
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state: 'on'
  - type: entity
    entity: sensor.bills_unpaid_count
    name: Unpaid
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state_not: 'on'
  - type: entity
    entity: sensor.bills_unpaid_count
    name: 未付数量
    visibility:
    - condition: state
      entity: input_boolean.chinese_dashboard
      state: 'on'
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ '账单' if is_state('input_boolean.chinese_dashboard','on') else
        'Bills' }}

        {{ '家庭开支与到期日' if is_state('input_boolean.chinese_dashboard','on')
        else 'Household expenses and due dates' }}
    # Time over date, right-aligned, DD/MM/YY -- never %Y. `nowrap` is a
    # guarantee where a `columns` value is only a bet (DR-012).
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        ## {{ now().strftime('%I:%M %p').lstrip('0').lower() }}
        {{ now().strftime('%d/%m/%y') }}
      card_mod:
        style: |
          ha-card { text-align: right; white-space: nowrap; }
    # The shared nav rail. Identical on every board and room page so the
    # dashboard reads as one application; the current page's icon is tinted
    # amber, which is the render's selected state.
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}
  # -------------------------------------------------------------------------
  # The chip strip, as on Home, Security and Energy. Five markdown KPI cards
  # became one pill row. Each chip is derived from the SAME three helpers per
  # bill that the cards below use -- amount, due date, paid flag -- so the
  # strip and the list cannot disagree with each other.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {%- set bills = [('input_number.elec_bill_amount','input_datetime.elec_bill_due','input_boolean.elec_bill_paid','Electricity','电费'),
                         ('input_number.gas_bill_amount','input_datetime.gas_bill_due','input_boolean.gas_bill_paid','Gas','燃气费'),
                         ('input_number.water_bill_amount','input_datetime.water_bill_due','input_boolean.water_bill_paid','Water','水费'),
                         ('input_number.council_rate_amount','input_datetime.council_rate_due','input_boolean.council_rate_paid','Council rates','市政费'),
                         ('input_number.car_insurance_amount','input_datetime.car_insurance_due','input_boolean.car_insurance_paid','Car insurance','车险'),
                         ('input_number.rego_amount','input_datetime.rego_due','input_boolean.rego_paid','Registration','车辆登记')] -%}
        {%- set ns = namespace(owed=0.0, n=0, late=0, dated=0, soon=none, who='', unset=0) -%}
        {%- for amt, due, paid, en, zh in bills %}{% set a = states(amt) | float(none) %}{% if a is none or a <= 0 %}{% set ns.unset = ns.unset + 1 %}{% elif not is_state(paid,'on') %}{% set ns.owed = ns.owed + a %}{% set ns.n = ns.n + 1 %}{% set t = as_timestamp(states(due), default=none) %}{% if t is not none %}{% set ns.dated = ns.dated + 1 %}{% if t < as_timestamp(now()) %}{% set ns.late = ns.late + 1 %}{% endif %}{% if ns.soon is none or t < ns.soon %}{% set ns.soon = t %}{% set ns.who = zh if cn else en %}{% endif %}{% endif %}{% endif %}{% endfor -%}
        {#- Six helpers with nothing entered is not "$0.00 owed", it is a board
            nobody has filled in. The chips say which of the two it is. -#}
        {%- if ns.unset == 6 -%}
        {%- set ov = nd -%}{% set uv = nd %}{% set nx = nd %}{% set lv = nd %}
        {%- else -%}
        {%- set ov = '$%.2f' | format(ns.owed) -%}
        {%- set uv = ('%d 张' % ns.n) if cn else ('%d of 6' % ns.n) -%}
        {#- Three different facts, and the chip must not merge them: nothing is
            owed, something is owed but nothing carries a date, or here is the
            next one. -#}
        {%- if ns.n == 0 %}{% set nx = '无待付' if cn else 'Nothing due' %}
        {%- elif ns.soon is none %}{% set nx = '无到期日' if cn else 'None dated' %}
        {%- else %}{% set nx = ns.soon | timestamp_custom('%d/%m') ~ ' ' ~ ns.who %}{% endif -%}
        {#- `0 overdue` across six unpaid bills that all lack a due date is a
            reassurance nothing measured. Only claim a count once at least one
            unpaid bill has a date to be late against. -#}
        {%- if ns.n and not ns.dated %}{% set lv = nd %}
        {%- else %}{% set lv = ('%d 张' % ns.late) if cn else ('%d' % ns.late) %}{% endif -%}
        {%- endif -%}
        {{ '未付总额' if cn else 'Outstanding' }} **{{ ov }}** · {{ '待付' if cn else 'Unpaid' }} **{{ uv }}** · {{ '下一笔' if cn else 'Next due' }} **{{ nx }}** · {{ '逾期' if cn else 'Overdue' }} **{{ lv }}**
      card_mod:
        style: |
          ha-card {
            border-radius: 999px;
            background: var(--casaray-surface-3);
            border-color: var(--casaray-border-strong);
          }


  # One compact row per bill: what it is, what it costs, when it is due,
  # whether it is paid, and what the discount saved. Nothing else.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Bills
      heading_style: title
      icon: mdi:receipt-text-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
