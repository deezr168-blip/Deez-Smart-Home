      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '客厅' if is_state('input_boolean.chinese_dashboard','on') else
        'LIVING ROOM' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set t = states('sensor.living_room_living_hue_hue_sensor_temperature') |
        float(none) -%}
        {% set m = states('binary_sensor.living_room_living_hue_hue_sensor_motion') -%}
        {% if t is not none %}{{ t | round(1) }} °C{% else %}{{ '温度无数据' if
        cn else 'Temperature not reporting' }}{% endif %}{% if m == 'on' %}{{ ' · 有人'
        if cn else ' · occupied' }}{% elif m == 'off' %}{{ ' · 无人' if cn else ' · no
        motion' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}


  # Status chips, per the Living Room mockup's row under the header: a bold
  # value and a muted caption, one per thing you would glance at on the way
  # past. Two across rather than the render's five, for the same iPad reason
  # the Home KPI strip is 2x2. Every chip has an offline branch.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set m = states('binary_sensor.living_room_living_hue_hue_sensor_motion') -%}
        {% if m == 'on' %}**{{ '有人' if cn else 'Occupied' }}** · {{ '刚检测到动作' if cn else 'motion just now' }}{% elif m == 'off' %}**{{ '无人' if cn else 'No motion' }}** · {{ '客厅' if cn else 'Living Room' }}{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '动作传感器离线' if cn else 'motion sensor offline' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.living_room_living_hue_hue_sensor_temperature') | float(none) -%}
        {% if t is not none %}**{{ t | round(1) }} °C** · {% if t >= 18 and t <= 25 %}{{ '舒适' if cn else 'Comfortable' }}{% elif t < 18 %}{{ '偏冷' if cn else 'Cool' }}{% else %}{{ '偏热' if cn else 'Warm' }}{% endif %}{% else %}**—** · {{ '温度无数据' if cn else 'temperature not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set l = states('light.living_room') -%}
        {%- set b = state_attr('light.living_room','brightness') -%}
        {% if l == 'on' %}**{{ '灯光已开' if cn else 'Lights on' }}**{% if b is not none %} · {{ (b | float / 255 * 100) | round(0) | int }}%{% endif %}{% elif l == 'off' %}**{{ '灯光已关' if cn else 'Lights off' }}**{% else %}**—** · {{ '灯光无数据' if cn else 'lights not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set aq = states('sensor.living_room_air_purifier_air_quality') -%}
        {%- set pm = states('sensor.living_room_air_purifier_pm2_5') | float(none) -%}
        {% if aq not in ['unavailable','unknown','none',''] %}**{{ aq }}** · {{ '空气质量' if cn else 'air quality' }}{% if pm is not none %} · PM2.5 {{ pm | round(0) | int }}{% endif %}{% else %}**—** · {{ '空气质量无数据' if cn else 'air quality not reporting' }}{% endif %}

