    - type: tile
      entity: switch.g_monitor_freezer_p110m_led
      name: Socket LED
      grid_options: {columns: 6, rows: 1}

  # Footer navigation, per the room mockups' bottom bar. The header already
  # carries Back and Home; repeating the way out at the end of the page is
  # the point -- a room page is long enough that leaving it should not mean
