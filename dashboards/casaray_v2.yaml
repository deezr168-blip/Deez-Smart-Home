# ===========================================================================
# LIVING ROOM. Media, lighting and the front door live here.
# The four Hue ambiance spots are retained and will read unavailable while
# the bridge is down -- the cards are correct, the bridge is not answering.
# ===========================================================================
- type: sections
  title: Living Room
  path: living-room
  icon: mdi:sofa
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Back
      icon: mdi:arrow-left
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '客厅' if is_state('input_boolean.chinese_dashboard','on') else
        'LIVING ROOM' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set t = states('sensor.living_room_living_hue_hue_sensor_temperature') |
        float(none) -%}
        {% set m = states('binary_sensor.living_room_living_hue_hue_sensor_motion') -%}
        {% if t is not none %}{{ t | round(1) }} °C{% else %}{{ '温度无数据' if
        cn else 'Temperature not reporting' }}{% endif %}{% if m == 'on' %}{{ ' · 有人'
        if cn else ' · occupied' }}{% elif m == 'off' %}{{ ' · 无人' if cn else ' · no
        motion' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}


  # Status chips, per the Living Room mockup's row under the header: a bold
  # value and a muted caption, one per thing you would glance at on the way
  # past. Two across rather than the render's five, for the same iPad reason
  # the Home KPI strip is 2x2. Every chip has an offline branch.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set m = states('binary_sensor.living_room_living_hue_hue_sensor_motion') -%}
        {% if m == 'on' %}**{{ '有人' if cn else 'Occupied' }}** · {{ '刚检测到动作' if cn else 'motion just now' }}{% elif m == 'off' %}**{{ '无人' if cn else 'No motion' }}** · {{ '客厅' if cn else 'Living Room' }}{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '动作传感器离线' if cn else 'motion sensor offline' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.living_room_living_hue_hue_sensor_temperature') | float(none) -%}
        {% if t is not none %}**{{ t | round(1) }} °C** · {% if t >= 18 and t <= 25 %}{{ '舒适' if cn else 'Comfortable' }}{% elif t < 18 %}{{ '偏冷' if cn else 'Cool' }}{% else %}{{ '偏热' if cn else 'Warm' }}{% endif %}{% else %}**—** · {{ '温度无数据' if cn else 'temperature not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set l = states('light.living_room') -%}
        {%- set b = state_attr('light.living_room','brightness') -%}
        {% if l == 'on' %}**{{ '灯光已开' if cn else 'Lights on' }}**{% if b is not none %} · {{ (b | float / 255 * 100) | round(0) | int }}%{% endif %}{% elif l == 'off' %}**{{ '灯光已关' if cn else 'Lights off' }}**{% else %}**—** · {{ '灯光无数据' if cn else 'lights not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set aq = states('sensor.living_room_air_purifier_air_quality') -%}
        {%- set pm = states('sensor.living_room_air_purifier_pm2_5') | float(none) -%}
        {% if aq not in ['unavailable','unknown','none',''] %}**{{ aq }}** · {{ '空气质量' if cn else 'air quality' }}{% if pm is not none %} · PM2.5 {{ pm | round(0) | int }}{% endif %}{% else %}**—** · {{ '空气质量无数据' if cn else 'air quality not reporting' }}{% endif %}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Quick actions
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 快捷场景
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Relax
      icon: mdi:sofa-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_relax}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Bright
      icon: mdi:brightness-7
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_bright}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Read
      icon: mdi:book-open-page-variant
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_read}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Nightlight
      icon: mdi:weather-night
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_nightlight}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Energize
      icon: mdi:lightning-bolt
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_energize}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Concentrate
      icon: mdi:head-lightbulb-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_concentrate}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Lights
      heading_style: title
      icon: mdi:lightbulb
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 灯光
      heading_style: title
      icon: mdi:lightbulb
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: light.living_room
      name: Living Room
      features:
      - type: light-brightness
    - type: tile
      entity: light.living_room_hue_ambiance_spot_1
      name: Hue spot 1
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_2
      name: Hue spot 2
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_3
      name: Hue spot 3
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_4
      name: Hue spot 4
      grid_options: {columns: 6, rows: 1}
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set spots =
        ['light.living_room_hue_ambiance_spot_1',
        'light.living_room_hue_ambiance_spot_2',
        'light.living_room_hue_ambiance_spot_3',
        'light.living_room_hue_ambiance_spot_4'] %} {% set ns =
        namespace(down=0) %} {% for s in spots %}{% if states(s) in
        ['unavailable','unknown'] %}{% set ns.down = ns.down + 1 %}{% endif %}{%
        endfor %} {% if ns.down == 4 %}{{ '四盏 Hue 射灯全部离线。Hue
        桥接器无响应，这是桥接器故障，不是面板问题。' if cn else 'All four Hue spots are
        unavailable. The Hue bridge is not answering — this is a bridge fault, not a
        dashboard one.' }}{% elif ns.down %}{% if cn %}{{ ns.down }} 盏 Hue 射灯离线（共
