# ===========================================================================
# SECURITY. Doors, motion, camera health. There is no alarm_control_panel
# and no lock entity in this instance, so there is no arm/disarm control and
# no lock row -- the mockup's "Armed (Away)" and "Front Door unlocked" have
# no source. Their absence is the honest state, not an omission.
# ===========================================================================
- type: sections
  title: Security
  path: security
  icon: mdi:shield-home
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '安全' if is_state('input_boolean.chinese_dashboard','on') else
        'Security' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] %} {% set ns = namespace(open=0,
        unk=0) %} {% for d in doors %}{% set s = states(d) %}{% if s == 'on' %}{%
        set ns.open = ns.open + 1 %}{% elif s != 'off' %}{% set ns.unk = ns.unk +
        1 %}{% endif %}{% endfor %} {% if ns.unk %}{% if cn %}3 个门传感器中 {{ ns.unk }}
        个无数据{% else %}{{ ns.unk }} of 3 door sensors not reporting{% endif %}{% elif
        ns.open %}{% if cn %}3 扇门中 {{ ns.open }} 扇开启{% else %}{{ ns.open }} of 3
        doors open{% endif %}{% else %}{{ '所有门已关闭' if cn else 'All doors closed'
        }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Doors
      heading_style: title
      icon: mdi:door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 门
      heading_style: title
      icon: mdi:door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: binary_sensor.f_contact_sensor_door
      name: Front door
    - type: tile
      entity: binary_sensor.m_contact_sensor_door
      name: Parents Room door
    - type: tile
      entity: binary_sensor.b_contact_sensor_door
      name: Backyard door
    - type: history-graph
      hours_to_show: 24
      entities:
      - entity: binary_sensor.f_contact_sensor_door
        name: Front
      - entity: binary_sensor.m_contact_sensor_door
        name: Parents
      - entity: binary_sensor.b_contact_sensor_door
        name: Backyard

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Motion
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 动作
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: binary_sensor.living_room_living_hue_hue_sensor_motion
      name: Living Room
    - type: tile
      entity: binary_sensor.k_motion_sensor_motion
      name: Kitchen
    - type: tile
      entity: binary_sensor.sensor_group_motion
      name: Dining
    - type: tile
      entity: binary_sensor.bedroom_motion_sensor_motion
      name: Parents Room

  # Detection settings are shown, not operated. Every tile here opens
  # more-info rather than toggling: privacy mode blinds a camera and a
  # detection switch is what makes it watch, so switching one off from a wall
  # panel should never be one accidental tap. The value of the section is that
  # a protection gap someone left switched off becomes visible.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Detection settings
      heading_style: title
      icon: mdi:cctv
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 侦测设置
      heading_style: title
      icon: mdi:cctv
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set priv = ['switch.tapo_c425_north_wall_privacy',
        'switch.tapo_c200_stockroom_privacy',
        'switch.smart_pet_feeder_privacy_mode'] -%}
        {% set det = ['switch.front_door_motion_detection',
        'switch.tapo_c420_south_wall_motion_detection',
        'switch.tapo_c420_south_wall_person_detection',
        'switch.tapo_camera_bcca_motion_detection',
        'switch.tapo_camera_bcca_person_detection',
        'switch.smart_pet_feeder_motion_alarm'] -%}
        {% set ns = namespace(blind=0, off=0, unk=0) -%}
        {% for e in priv %}{% set v = states(e) %}{% if v == 'on' %}{% set
        ns.blind = ns.blind + 1 %}{% elif v != 'off' %}{% set ns.unk = ns.unk +
        1 %}{% endif %}{% endfor -%}
        {% for e in det %}{% set v = states(e) %}{% if v == 'off' %}{% set
        ns.off = ns.off + 1 %}{% elif v != 'on' %}{% set ns.unk = ns.unk + 1
        %}{% endif %}{% endfor -%}
        {% if ns.blind %}{% if cn %}**{{ ns.blind }} 个摄像头处于隐私模式，未在录制。**{% else
