    - type: tile
      entity: switch.k_top_p100
      name: Top bench
      icon: mdi:power-plug

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Fridge
      heading_style: title
      icon: mdi:fridge
      badges:
      - type: entity
        entity: binary_sensor.lg_fridge_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 冰箱
      heading_style: title
      icon: mdi:fridge
      badges:
      - type: entity
        entity: binary_sensor.lg_fridge_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: binary_sensor.lg_fridge_door
      name: Fridge door
    - type: tile
      entity: number.lg_fridge_fridge_temperature
