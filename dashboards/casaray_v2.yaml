# ===========================================================================
# LIGHTING. Whole-house light control plus the verified Hue scene catalogue.
# Scene entity IDs were confirmed by the owner-supplied B1 export on 2026-09-05.
# ===========================================================================
- type: sections
  title: Lighting
  path: lighting
  icon: mdi:lightbulb-group
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '灯光' if is_state('input_boolean.chinese_dashboard','on') else
        'LIGHTING' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set ls = ['light.living_room', 'light.dining',
        'light.bedroom_bedroom', 'light.kogan_tv',
        'light.smart_pet_feeder_indicator_light'] %} {% set ns =
        namespace(on=0, unk=0) %} {% for l in ls %}{% set s = states(l) %}{% if s
        == 'on' %}{% set ns.on = ns.on + 1 %}{% elif s != 'off' %}{% set ns.unk =
        ns.unk + 1 %}{% endif %}{% endfor %} {% if cn %}{{ ls | count }} 盏灯中 {{ ns.on
        }} 盏开启{% if ns.unk %} · {{ ns.unk }} 盏无数据{% endif %}{% else %}{{ ns.on }}
        of {{ ls | count }} lights on{% if ns.unk %} · {{ ns.unk }} not reporting{%
        endif %}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  # KPI strip, per DESIGN_REFERENCE's content-grid rule. The Lighting Studio
  # mockup opens with an at-a-glance count; this is that count, built from the
  # seven light and switch entities that actually report, with the dead Hue
  # spots carried in their own card rather than quietly dropped from the total.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set ls = [('light.living_room','Living Room','客厅'),
                      ('light.dining','Dining','餐厅'),
                      ('light.bedroom_bedroom','Ray Bedroom','Ray 卧室'),
                      ('light.bedroom_nightlight','Night light','夜灯'),
                      ('switch.mainroomlight_switch_1','Parents Room','父母房'),
                      ('switch.bedroomlight_switch_1','Ray wall switch','Ray 墙壁开关'),
                      ('switch.dinning_light_switch_1','Dining wall switch','餐厅墙壁开关')] -%}
        {%- set ns = namespace(on=[], off=0, quiet=0) -%}
        {%- for l, en, zh in ls %}{% set s = states(l) %}{% if s == 'on' %}{% set ns.on = ns.on + [zh if cn else en] %}{% elif s == 'off' %}{% set ns.off = ns.off + 1 %}{% else %}{% set ns.quiet = ns.quiet + 1 %}{% endif %}{% endfor -%}
        **{{ '开启的灯' if cn else 'LIGHTS ON' }}**
        {% if ns.quiet == ls | count %}## —
        {{ '没有灯具报告状态' if cn else 'No light is reporting a state' }}{% else %}## {{ ns.on | count }}/{{ (ns.on | count) + ns.off }}
        {% if ns.on %}{{ ns.on | join('、') if cn else ns.on | join(', ') }}{% else %}{{ '全部已关闭' if cn else 'Everything is off' }}{% endif %}{% endif %}

        {% if ns.quiet %}{{ ('另有 %d 个灯具无数据，未计入。' % ns.quiet) if cn else (('1 more is not reporting and is left out of the count.' if ns.quiet == 1 else '%d more are not reporting and are left out of the count.' % ns.quiet)) }}{% else %}{{ '七个灯具全部有数据。' if cn else 'All 7 are reporting.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {# Only the three group lights are dimmable; the wall switches report
           on/off alone and would drag an average towards nothing if counted.
           Brightness is 0-255 on the attribute and is shown as a percentage. #}
        {%- set dim = [('light.living_room','Living Room','客厅'),
                       ('light.dining','Dining','餐厅'),
                       ('light.bedroom_bedroom','Ray Bedroom','Ray 卧室')] -%}
        {%- set ns = namespace(sum=0.0, n=0) -%}
        {%- for l, en, zh in dim %}{% if is_state(l,'on') %}{% set b = state_attr(l,'brightness') | float(none) %}{% if b is not none %}{% set ns.sum = ns.sum + b %}{% set ns.n = ns.n + 1 %}{% endif %}{% endif %}{% endfor -%}
        **{{ '亮度' if cn else 'BRIGHTNESS' }}**
        {% if ns.n %}## {{ ((ns.sum / ns.n) / 255 * 100) | round(0) | int }}%
        {{ ('%d 组已开启的灯的平均亮度' % ns.n) if cn else ('averaged over %d group%s that are on' % (ns.n, '' if ns.n == 1 else 's')) }}{% else %}## —
        {{ '没有可调光的灯组处于开启状态' if cn else 'No dimmable group is on' }}{% endif %}

        {{ '墙壁开关只有开与关，不计入平均亮度。' if cn else 'The wall switches are on/off only and are not averaged in.' }}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set spots = [('light.living_room_hue_ambiance_spot_1','Inner Left','内左'),
                         ('light.living_room_hue_ambiance_spot_2','Inner Right','内右'),
                         ('light.living_room_hue_ambiance_spot_3','Outer Left','外左'),
                         ('light.living_room_hue_ambiance_spot_4','Outer Right','外右')] -%}
        {%- set ns = namespace(down=[], up=0) -%}
        {%- for s, en, zh in spots %}{% if states(s) in ['unavailable','unknown'] %}{% set ns.down = ns.down + [zh if cn else en] %}{% else %}{% set ns.up = ns.up + 1 %}{% endif %}{% endfor -%}
        **{{ '客厅射灯' if cn else 'LIVING ROOM SPOTS' }}**
        {% if ns.down %}## {{ ns.up }}/{{ spots | count }}
        {{ ('无数据：' ~ ns.down | join('、')) if cn else ('Not reporting: ' ~ ns.down | join(', ')) }}{% else %}## {{ spots | count }}/{{ spots | count }}
        {{ '四个射灯全部有数据' if cn else 'All 4 spots are reporting' }}{% endif %}

        {{ '这四个是独立的 Hue 射灯，与上方的“客厅”灯组是不同的实体；灯组开启并不代表射灯在线。' if cn else 'These are the individual Hue spots, separate entities from the Living Room group above; the group being on does not mean the spots are online.' }}
