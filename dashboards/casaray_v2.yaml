# ===========================================================================
# CLIMATE. One climate entity and four temperature/humidity readings.
# No whole-house HVAC exists, so this interprets rather than pretends.
# ===========================================================================
- type: sections
  title: Climate
  path: climate
  icon: mdi:thermometer
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '气候' if is_state('input_boolean.chinese_dashboard','on') else
        'CLIMATE' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set ts =
        ['sensor.living_room_living_hue_hue_sensor_temperature',
        'sensor.bedroom_motion_sensor_temperature',
        'sensor.living_room_living_room_temperature'] %} {% set ns =
        namespace(sum=0.0, n=0, unk=0) %} {% for t in ts %}{% set s = states(t)
        %}{% if s in ['unavailable','unknown','none',''] %}{% set ns.unk =
        ns.unk + 1 %}{% else %}{% set f = s | float(-999) %}{% if f > -900 %}{%
        set ns.sum = ns.sum + f %}{% set ns.n = ns.n + 1 %}{% else %}{% set
        ns.unk = ns.unk + 1 %}{% endif %}{% endif %}{% endfor %} {% if ns.n %}{% if cn
        %}室内平均 {{ (ns.sum / ns.n) | round(1) }} °C（{{ ns.n }} 个房间）{% if ns.unk
        %} · {{ ns.unk }} 个无数据{% endif %}{% else %}Indoor average {{ (ns.sum / ns.n)
        | round(1) }} °C across {{ ns.n }} {{ 'room' if ns.n == 1 else 'rooms' }}{% if
        ns.unk %} · {{ ns.unk }} not reporting{% endif %}{% endif %}{% else %}{{
        '没有室内温度数据。' if cn else 'No indoor temperature is reporting.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  # KPI strip, per DESIGN_REFERENCE's content-grid rule and the Home mockup's
  # INDOOR CLIMATE card. The average names the rooms it averaged: an earlier
  # version of this figure read "19.1 across 2 rooms" beside a page showing
  # three, and the only fix for that is to print the working.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set ts = [('sensor.living_room_living_hue_hue_sensor_temperature','Living Room','客厅'),
                      ('sensor.bedroom_motion_sensor_temperature','Parents Room','父母房'),
                      ('sensor.living_room_living_room_temperature','Dining','餐厅')] -%}
        {%- set ns = namespace(sum=0.0, n=0, got=[], quiet=[]) -%}
        {%- for t, en, zh in ts %}{% set f = states(t) | float(none) %}{% if f is not none %}{% set ns.sum = ns.sum + f %}{% set ns.n = ns.n + 1 %}{% set ns.got = ns.got + [zh if cn else en] %}{% else %}{% set ns.quiet = ns.quiet + [zh if cn else en] %}{% endif %}{% endfor -%}
        **{{ '室内平均温度' if cn else 'INDOOR AVERAGE' }}**
        {% if ns.n %}{% set avg = ns.sum / ns.n %}## {{ avg | round(1) }} °C
        {% if avg >= 18 and avg <= 25 %}{{ '舒适' if cn else 'Comfortable' }}{% elif avg < 18 %}{{ '偏冷' if cn else 'Cool' }}{% else %}{{ '偏热' if cn else 'Warm' }}{% endif %}{% else %}## —
        {{ '没有房间报告温度' if cn else 'No room is reporting a temperature' }}{% endif %}

        {% if ns.n %}{{ ('取自：' ~ ns.got | join('、')) if cn else ('Averaged over ' ~ ns.got | join(', ')) }}{% endif %}{% if ns.quiet %} · {{ ('无数据：' ~ ns.quiet | join('、')) if cn else ('not reporting: ' ~ ns.quiet | join(', ')) }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set h = states('sensor.bedroom_motion_sensor_humidity') | float(none) -%}
        **{{ '湿度' if cn else 'HUMIDITY' }}**
        {% if h is not none %}## {{ h | round(0) | int }}%
        {% if h >= 30 and h <= 60 %}{{ '舒适区间' if cn else 'Comfortable range' }}{% elif h < 30 %}{{ '偏干' if cn else 'Dry' }}{% else %}{{ '偏湿' if cn else 'Humid' }}{% endif %}{% else %}## —
        {{ '湿度传感器无数据' if cn else 'The humidity sensor is not reporting' }}{% endif %}

        {{ '全屋只有父母房的传感器报告湿度，因此这不是全屋平均值。' if cn else 'Only the Parents Room sensor reports humidity, so this is one room, not a house average.' }}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set hv = states('climate.bedroom_parents_room_ac') -%}
        {%- set raw = states('sensor.master_bedroom_sensibo_sky_plus_air_conditioner_mode') -%}
        {%- set en = {'cool':'Cooling','heat':'Heating','dry':'Dry','fanOnly':'Fan only','auto':'Auto'} -%}
        {%- set zh = {'cool':'制冷','heat':'制热','dry':'除湿','fanOnly':'仅送风','auto':'自动'} -%}
        {%- set sp = states('sensor.master_bedroom_sensibo_sky_plus_cooling_setpoint') | float(none) -%}
        {%- set cur = state_attr('climate.bedroom_parents_room_ac','current_temperature') | float(none) -%}
        **{{ '父母房空调' if cn else 'PARENTS ROOM AC' }}**
        {% if hv in ['unavailable','unknown','none',''] %}## —
        {{ '空调无数据' if cn else 'The air conditioner is not reporting' }}{% elif hv == 'off' %}## {{ '已关闭' if cn else 'Off' }}
        {{ '当前未运行' if cn else 'Not running' }}{% else %}## {{ zh.get(raw, raw) if cn else en.get(raw, raw) }}
        {{ '正在运行' if cn else 'Running' }}{% endif %}

        {{ '室温' if cn else 'Room' }} **{{ (cur | round(1) ~ ' °C') if cur is not none else '—' }}** · {{ '制冷设定' if cn else 'Cool setpoint' }} **{{ (sp | round(0) | int ~ ' °C') if sp is not none else '—' }}**
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set f = states('binary_sensor.bedroom_parents_room_ac_filter_clean_required') -%}
        {%- set occ = states('binary_sensor.bedroom_parents_room_ac_room_occupied') -%}
        {%- set lr = states('sensor.bedroom_parents_room_ac_filter_last_reset') -%}
        {%- set lrt = as_timestamp(lr, default=none) -%}
        **{{ '空调滤网' if cn else 'AC FILTER' }}**
        {% if f == 'on' %}## {{ '需要清洁' if cn else 'Clean it' }}
        {{ '空调报告滤网需要清洁' if cn else 'The unit is asking for a filter clean' }}{% elif f == 'off' %}## {{ '正常' if cn else 'Clean' }}
        {{ '空调没有要求清洁滤网' if cn else 'The unit is not asking for a clean' }}{% else %}## —
        {{ '滤网状态无数据' if cn else 'Filter status is not reporting' }}{% endif %}

        {% if lrt is not none %}{% set days = ((as_timestamp(now()) - lrt) / 86400) | round(0, 'floor') | int %}{{ ('上次重置：%d 天前' % days) if cn else ('Last reset %d days ago' % days) }}{% else %}{{ '尚未记录重置时间' if cn else 'No reset has been recorded' }}{% endif %} · {{ '房间' if cn else 'Room' }} **{{ ('有人' if cn else 'Occupied') if occ == 'on' else (('无人' if cn else 'Empty') if occ == 'off' else ('无数据' if cn else 'Unknown')) }}**

  - type: grid
    column_span: 1
    cards:
