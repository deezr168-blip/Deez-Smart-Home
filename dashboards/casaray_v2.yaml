      heading_style: title
      icon: mdi:cart-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 购物清单
      heading_style: title
      icon: mdi:cart-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: todo-list
      entity: todo.shopping_list

# ===========================================================================
# DINING. Dining light, the motion group, and the pet feeder.
# ===========================================================================
- type: sections
  title: Dining
  path: dining
  icon: mdi:table-chair
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Back
      icon: mdi:arrow-left
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '餐厅' if is_state('input_boolean.chinese_dashboard','on') else
        'Dining' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set m =
        states('binary_sensor.sensor_group_motion') %}{% set l =
        states('light.dining') %}{% if m == 'on' %}{{ '有人' if cn else 'Occupied' }}{%
        elif m == 'off' %}{{ '无人' if cn else 'No motion' }}{% else %}{{
        '动作传感器离线' if cn else 'Motion sensor not reporting' }}{% endif %} · {% if
        l == 'on' %}{{ '灯开启' if cn else 'light on' }}{% elif l == 'off' %}{{ '灯关闭'
        if cn else 'light off' }}{% else %}{{ '灯无数据' if cn else 'light not
        reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}


  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Quick actions
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 快捷场景
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Relax
      icon: mdi:table-chair
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.dining_dining_relax}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Read
      icon: mdi:book-open-page-variant
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.dining_dining_read}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Nightlight
      icon: mdi:weather-night
      show_state: false
      tap_action:
