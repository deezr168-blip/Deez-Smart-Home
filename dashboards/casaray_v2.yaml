      name: North Wall privacy
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: more-info}
    - type: tile
      entity: switch.tapo_c425_north_wall_notifications
      name: North Wall alerts
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: more-info}
    - type: tile
      entity: switch.tapo_camera_bcca_motion_detection
      name: East Wall motion
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: more-info}
    - type: tile
      entity: switch.tapo_camera_bcca_person_detection
      name: East Wall person
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: more-info}
    - type: tile
