    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set dues =
        [('Electricity','电费','input_datetime.elec_bill_due',
        'input_boolean.elec_bill_paid'),
        ('Gas','燃气费','input_datetime.gas_bill_due','input_boolean.gas_bill_paid'),
        ('Water','水费','input_datetime.water_bill_due','input_boolean.water_bill_paid'),
        ('Council rates','市政费','input_datetime.council_rate_due',
        'input_boolean.council_rate_paid'),
        ('Car insurance','车险','input_datetime.car_insurance_due',
        'input_boolean.car_insurance_paid'),
        ('Rego','车辆注册','input_datetime.rego_due','input_boolean.rego_paid')] -%} {%
        set ns = namespace(soonest=99999, name='', overdue=0, unk=0) -%} {% for n, z, d,
        p in dues %}{% set ds = states(d) %}{% set ps = states(p) %}{% if ds in
        ['unavailable','unknown','none',''] %}{% set ns.unk = ns.unk + 1 %}{%
        elif ps != 'on' %}{% set ts = as_timestamp(ds, 0) %}{% if ts > 0 %}{% set
        days = ((ts - as_timestamp(now())) / 86400) | round(0) | int %}{% if days
        < 0 %}{% set ns.overdue = ns.overdue + 1 %}{% endif %}{% if days <
        ns.soonest %}{% set ns.soonest = days %}{% set ns.name = z if cn else n %}{%
        endif %}{% else %}{% set ns.unk = ns.unk + 1 %}{% endif %}{% endif %}{% endfor
        -%} {% if ns.overdue %}{% if cn %}**{{ ns.overdue }} 笔账单已逾期。** {% else
        %}**{{ ns.overdue }} bill{{ 's' if ns.overdue > 1 else '' }} overdue.** {% endif
        %}{% endif %}{% if ns.name %}{% if cn %}下一笔：**{{ ns.name }}**{% if ns.soonest
        < 0 %}，已逾期 {{ ns.soonest | abs }} 天。{% elif ns.soonest == 0 %}，今天到期。{%
        else %}，{{ ns.soonest }} 天后到期。{% endif %}{% else %}Next up: **{{ ns.name
        }}**{% if ns.soonest < 0 %}, {{ ns.soonest | abs }} days overdue.{% elif
        ns.soonest == 0 %}, due today.{% else %}, due in {{ ns.soonest }} days.{%
        endif %}{% endif %}{% elif ns.unk == 0 %}{{ '全部已付。' if cn else 'Everything
        is paid.' }}{% endif %}{% if ns.unk %}{% if cn %} {{ ns.unk }}
        笔账单日期无数据。{% else %} {{ ns.unk }} bill date{{ 's' if ns.unk > 1 else ''
        }} not reporting.{% endif %}{% endif %}
