# ===========================================================================
# RAY BEDROOM. Bed, blind, and the LetPot hydroponic grow unit, which is
# genuinely room-specific content the old dashboard under-used.
# ===========================================================================
- type: sections
  title: Ray Bedroom
  path: ray-bedroom
  icon: mdi:bed
  max_columns: 2
  # No `badges:` here. Home Assistant renders badges ABOVE the sections, so a
  # badge row lands on top of the CasaRay wordmark rather than under the page
  # title where the 14/09 room render puts its pill row (DR-011). The chip
  # strip in section 2 is that pill row, and unlike a badge it can carry a
  # computed value -- the render's own "Quiet, 22 min" is elapsed time since
  # last_changed, which no badge can show.
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ 'Ray 房间' if is_state('input_boolean.chinese_dashboard','on') else
        'Ray Bedroom' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set l = states('light.bedroom_bedroom') %}{% set c =
        states('cover.aqara_roller_shade_driver_e1') %}{% if l == 'on' %}{{ '灯开启' if
        cn else 'Light on' }}{% elif l == 'off' %}{{ '灯关闭' if cn else 'Light off'
        }}{% else %}{{ '灯无数据' if cn else 'Light not reporting' }}{% endif %} · {% if
        c == 'open' %}{{ '窗帘已打开' if cn else 'blind open' }}{% elif c == 'closed'
        %}{{ '窗帘已关闭' if cn else 'blind closed' }}{% else %}{{ '窗帘无数据' if cn
        else 'blind not reporting' }}{% endif %}
    # Time over date, right-aligned, DD/MM/YY -- never %Y. `nowrap` is a
    # guarantee where a `columns` value is only a bet (DR-012).
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
