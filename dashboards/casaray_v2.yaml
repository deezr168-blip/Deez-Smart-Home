# CasaRay v2 — rebuilt from scratch on the frozen CasaRay Design v1.
#
# Architecture: native-first per Master Design Briefing v1 section 20.
#   Sections layout -> heading -> tile -> native domain cards -> markdown
#   for the interpretation layer. No card_mod: surface treatment belongs to
#   themes/deez_your_name.yaml. Only custom:webrtc-camera is depended on,
#   and only where a live low-latency stream has no native equivalent.
#
# Entity truth: docs/entity_inventory.md. Every ID below is already
# referenced by dashboards/deez_smart_home.yaml or was confirmed by the
# owner-supplied B1 Developer Tools entity export on 2026-09-05. Nothing is
# invented. Components with no data behind them are absent, not faked.
#
# Layout: max_columns 2 throughout. iPad landscape renders ~2 usable
# columns whatever the mockups show.
#
# Comments survive in this repository. If this file is ever imported into a
# storage-mode dashboard it round-trips through a YAML dumper and they are
# stripped; the rationale is duplicated in the architecture document.

kiosk_mode:
  hide_sidebar: true
  hide_header: true
  ignore_per_user: false
# The CasaRay theme adds the frozen design's card-title typography -- small,
# uppercase, letter-spaced -- on top of the shared surface treatment. It is a
# separate theme so the legacy dashboard, which shares the same base anchor,
# keeps its own look. themes/deez_your_name.yaml must be deployed to
# /config/themes/ and themes reloaded, or this falls back to the user's
# default theme and CasaRay loses its background and glass entirely.
# scripts/sync_casaray_to_config.sh syncs both.
theme: CasaRay

views:

# ===========================================================================
# HOME -- the CasaRay command centre, rebuilt 2026-09-15 against the approved
# 14/09 wall mockup (docs/mockups/2026-09-14_wall_home.png) rather than grown
# card by card. The mockup's composition, not Home Assistant's defaults, sets
# the geometry:
#
#   band 1  top bar      CasaRay wordmark | icon nav rail | clock over date
#   band 2  chip strip   native badges -- Outside, Inside, Home, Monitored
#   band 3  needs attn   full width, red/amber alert cards two across
#   band 4  two cols     Right now | Who's home
#   band 5  one tap      full width, four scene cards across
#   band 6  two cols     Rooms | Shopping list
#   band 7  security     full width, composed panel
#   band 8  two cols     Energy now | Recent activity
#   band 9  more boards  full width, named index + the language toggle
#
# The mockup has NO left sidebar: branding, navigation and clock share one top
# bar. That is also the only shape a sections view can hold -- a section cannot
# be pinned as a rail -- so design and platform agree here. See the batch note
# in DASHBOARD_ISSUES.md.
#
# max_columns is 2, and that is measured rather than chosen. The rebuild set
# it to 3 to match the mockup's three equal body columns; live, with the
# sidebar and header hidden by kiosk_mode, the wall iPad still resolved the
# view as TWO columns, so `column_span: 3` clamped to 2 and every group meant
# for a third column fell onto its own row with a hole beside it. Two is the
# official CasaRay Home baseline -- see DR-013.
# ===========================================================================
- type: sections
  title: CasaRay
  path: home
  icon: mdi:home-heart
  max_columns: 2
  sections:

  # -------------------------------------------------------------------------
  # BAND 1 -- top bar, in two rows: wordmark (6) and clock (6), then the six
  # nav icons at 2 columns each.
  #
  # It was one row -- brand(3) + six buttons(1 each) + clock(3) -- because that
  # is the render's proportion. Live on the iPad it was not survivable: a
  # 1/12 cell is narrow enough that `CasaRay` broke vertically and the rail
  # ate the row. `columns` is a fraction of whatever width the renderer
  # actually gives the section, and that turned out to be far less than the
  # grid arithmetic suggested, so every cell here is now at least double.
  # Two rows, nothing under 2/12, and `white-space: nowrap` on the two text
  # cards so neither can ever wrap again whatever the container does.
  #
  # The rail is still the ONLY navigation on this dashboard -- kiosk_mode
  # hides Home Assistant's own header and sidebar -- so every icon is
  # load-bearing.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set h = now().hour -%}
        {%- if h < 12 %}{% set g = '早安' if cn else 'Good morning' %}
        {%- elif h < 18 %}{% set g = '午安' if cn else 'Good afternoon' %}
        {%- else %}{% set g = '晚安' if cn else 'Good evening' %}{% endif -%}
        # CasaRay
        {{ g }}{{ '，Ray' if cn else ', Ray' }}
      card_mod:
        style: |
          ha-card { white-space: nowrap; }
    # Time dominant, date beneath in DD/MM/YY -- never %Y. Right-aligned to the
    # page edge the way the render places it; text-align is the one thing a
    # markdown card cannot reach natively.
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {#- Lowercase meridiem -- `8:14 pm`, as the render draws it. The other
            20 clocks on this dashboard still print `PM`; they follow when
            their own views are rebuilt. DD/MM/YY is mandatory, never %Y. -#}
        # {{ now().strftime('%I:%M %p').lstrip('0').lower() }}
        {{ now().strftime('%d/%m/%y') }}
      card_mod:
        style: |
          ha-card { text-align: right; white-space: nowrap; }
    # Icon-only, per the mockup. The named equivalents live in the More boards
    # index at the foot of the page, which is what an older reader looking for
    # a word rather than a glyph will use.
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
      # The selected state, amber, exactly as the render tints the home glyph.
      # Static rather than templated: this card only ever renders on Home.
      card_mod:
        style: |
          ha-card {
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
          }
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}

  # -------------------------------------------------------------------------
  # BAND 2 -- the chip strip: one compact line, `Outside 8° · Inside 17° ·
  # Home 2 of 3 · Monitored 0 W`.
  #
  # It was four separate markdown cards at 3 columns each. Live on the iPad
  # that produced four nearly circular cards -- a markdown card has a minimum
  # height, and a 3/12 cell turned out to be narrower than its own height, so
  # each pill came out taller than it was wide (CR-249, now resolved rather
  # than accepted). One full-width card cannot do that at any container size:
  # it is always wider than it is tall, always grouped from the left, and it
  # wraps to a second line instead of deforming if the page ever gets narrow.
  #
  # These were native `badges` before the 2026-09-15 rebuild. Home Assistant
  # renders a view's badges ABOVE its sections, which put the pill row on top
  # of the CasaRay wordmark -- the one ordering the mockup is unambiguous
  # about. A markdown card in a section can sit where the render puts it.
  # The cost is the small leading icon a badge draws for free; markdown has no
  # verified way to render one, and `<ha-icon>` on the primary page is not a
  # thing to guess at.
  #
  # Every reading is still guarded independently: a sensor that is not
  # reporting says so rather than printing a zero. `Home` in particular never
  # prints `0 of 3` while the trackers are down -- that would read as "nobody
  # is home", a reassuring claim it cannot see.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {#- Outside: the forecast entity's temperature attribute, whole degrees
            as the render shows it. -#}
        {%- set ot = state_attr('weather.forecast_home','temperature') -%}
        {%- set outside = ((ot | round(0) | int) ~ '°') if ot is not none else nd -%}
        {#- Inside: the Living Room Hue sensor. The render labels this same
            reading `Inside`; no whole-house average sensor exists. -#}
        {%- set it = states('sensor.living_room_living_hue_hue_sensor_temperature') | float(none) -%}
        {%- set inside = ((it | round(1)) ~ '°') if it is not none else nd -%}
        {%- set ppl = ['person.raymond_du','person.vinh_du','person.ai_q_huang'] -%}
        {%- set ns = namespace(h=0, u=0) -%}
        {%- for p in ppl %}{% set st = states(p) %}{% if st == 'home' %}{% set ns.h = ns.h + 1 %}{% elif st in ['unavailable','unknown','none',''] %}{% set ns.u = ns.u + 1 %}{% endif %}{% endfor -%}
        {%- set n = ppl | count -%}
        {%- if ns.u == n %}{% set home = nd %}
        {%- elif ns.u %}{% set home = ('%d 人中 %d 人、%d 人无数据' % (n, ns.h, ns.u)) if cn else ('%d of %d, %d unknown' % (ns.h, n, ns.u)) %}
        {%- else %}{% set home = ('%d 人中 %d 人' % (n, ns.h)) if cn else ('%d of %d' % (ns.h, n)) %}{% endif -%}
        {%- set w = states('sensor.casa_monitored_power') | float(none) -%}
        {%- set wr = (w | round(1)) if w is not none else none -%}
        {#- A flat zero is a real reading and should print `0 W`, not `0.0 W`;
            147.9 keeps its decimal. -#}
        {%- set mon = (((wr | int) if wr == (wr | int) else wr) ~ ' W') if wr is not none else nd -%}
        {{ '室外' if cn else 'Outside' }} **{{ outside }}** · {{ '室内' if cn else 'Inside' }} **{{ inside }}** · {{ '在家' if cn else 'Home' }} **{{ home }}** · {{ '监测用电' if cn else 'Monitored' }} **{{ mon }}**
      card_mod:
        style: |
          ha-card {
            border-radius: 999px;
            background: var(--casaray-surface-3);
            border-color: var(--casaray-border-strong);
          }

  # -------------------------------------------------------------------------
  # BAND 3 -- needs attention. Full width, cards two across, red for a fault
  # and amber for a door simply left open, per CR-232. The roll-up line no
  # longer repeats what the cards already say: it counts them, then reports
  # only the things that have no card because there is no reading to show.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Needs attention
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 需要注意
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set doors = ['binary_sensor.f_contact_sensor_door','binary_sensor.m_contact_sensor_door','binary_sensor.b_contact_sensor_door'] -%}
        {%- set bats = ['sensor.front_door_battery','sensor.living_room_ringring_battery','sensor.tapo_c425_north_wall_battery','sensor.tapo_camera_bcca_battery','sensor.tapo_c420_south_wall_battery','sensor.aqara_roller_shade_driver_e1_battery'] -%}
        {%- set cams = ['camera.front_door_live_view','camera.tapo_c425_north_wall_hd_stream_direct','camera.tapo_c420_east_wall_hd_stream_direct','camera.tapo_c420_south_wall_hd_stream_direct','camera.tapo_c200_stockroom_hd_stream_direct','camera.smart_pet_feeder'] -%}
        {%- set ns = namespace(dopen=0, dunk=0, blow=0, bunk=0, coff=0) -%}
        {%- for d in doors %}{% set s = states(d) %}{% if s == 'on' %}{% set ns.dopen = ns.dopen + 1 %}{% elif s != 'off' %}{% set ns.dunk = ns.dunk + 1 %}{% endif %}{% endfor -%}
        {%- for b in bats %}{% set s = states(b) %}{% if s in ['unavailable','unknown','none',''] %}{% set ns.bunk = ns.bunk + 1 %}{% else %}{% set f = s | float(-1) %}{% if f < 0 %}{% set ns.bunk = ns.bunk + 1 %}{% elif f < 30 %}{% set ns.blow = ns.blow + 1 %}{% endif %}{% endif %}{% endfor -%}
        {%- for c in cams %}{% if states(c) in ['unavailable','unknown'] %}{% set ns.coff = ns.coff + 1 %}{% endif %}{% endfor -%}
        {#- bills_unpaid_count is a real sensor, but an unavailable one must not
            read as zero outstanding bills, so it is guarded rather than piped
            through int(0). -#}
        {%- set bu = states('sensor.bills_unpaid_count') -%}
        {%- set bn = (bu | int(-1)) if bu not in ['unavailable','unknown','none',''] else -1 -%}
        {%- set total = ns.dopen + ns.blow + ns.coff + (bn if bn > 0 else 0) -%}
        {#- Built as a list and joined, rather than printed with separators
            between conditionals: an omitted first clause would otherwise leave
            the line starting with a space, and one to three leading spaces is
            a silent CommonMark indent. -#}
        {%- set p = namespace(txt=[]) -%}
        {%- if total %}{% set p.txt = p.txt + [('有 %d 项需要处理。' % total) if cn else (('%d thing needs attention.' % total) if total == 1 else ('%d things need attention.' % total))] %}{% endif -%}
        {%- if ns.dunk %}{% set p.txt = p.txt + [('%d 个门窗传感器无数据。' % ns.dunk) if cn else (('%d door sensor is not reporting.' % ns.dunk) if ns.dunk == 1 else ('%d door sensors are not reporting.' % ns.dunk))] %}{% endif -%}
        {%- if ns.bunk %}{% set p.txt = p.txt + [('%d 个电池无数据。' % ns.bunk) if cn else (('%d battery is not reporting.' % ns.bunk) if ns.bunk == 1 else ('%d batteries are not reporting.' % ns.bunk))] %}{% endif -%}
        {#- Chinese sentences butt against each other after the full stop;
            only the English list takes a space. -#}
        {% if p.txt %}{{ p.txt | join('' if cn else ' ') }}{% else %}{{ '一切正常，无需处理。' if cn else 'All clear. Nothing needs attention.' }}{% endif %}
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.f_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.f_contact_sensor_door
        name: Front door open
        icon: mdi:door-open
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-amber-bg);
              border-color: var(--casaray-amber-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.b_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.b_contact_sensor_door
        name: Backyard door open
        icon: mdi:door-open
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-amber-bg);
              border-color: var(--casaray-amber-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.m_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.m_contact_sensor_door
        name: Parents Room door open
        icon: mdi:door-open
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-amber-bg);
              border-color: var(--casaray-amber-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: numeric_state
        entity: sensor.front_door_battery
        below: 30
      card:
        type: tile
        entity: sensor.front_door_battery
        name: Front Door battery low
        icon: mdi:battery-alert-variant-outline
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: numeric_state
        entity: sensor.living_room_ringring_battery
        below: 30
      card:
        type: tile
        entity: sensor.living_room_ringring_battery
        name: RingRing battery low
        icon: mdi:battery-alert-variant-outline
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: numeric_state
        entity: sensor.tapo_c425_north_wall_battery
        below: 30
      card:
        type: tile
        entity: sensor.tapo_c425_north_wall_battery
        name: North Wall camera battery low
        icon: mdi:battery-alert-variant-outline
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.eero_wan_status
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.eero_wan_status
        name: Internet
        icon: mdi:wan
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/network}
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        name: Garage freezer circuit overloaded
        icon: mdi:flash-alert
        color: red
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        name: Parents Room AC filter needs cleaning
        icon: mdi:air-filter
        color: red
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-red-bg);
              border-color: var(--casaray-red-border);
            }
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: state
        entity: binary_sensor.lg_fridge_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.lg_fridge_door
        name: Fridge door open
        icon: mdi:fridge-alert-outline
        color: orange
        state_content: [state, last_changed]
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-amber-bg);
              border-color: var(--casaray-amber-border);
            }
    # An unpaid bill is an attention item, and this is where an executive
    # overview should raise it -- which is why the two bill tiles that used to
    # sit in Home's footer are no longer needed there.
    - type: conditional
      grid_options: {columns: 6, rows: auto}
      conditions:
      - condition: numeric_state
        entity: sensor.bills_unpaid_count
        above: 0
      card:
        type: tile
        entity: sensor.bills_unpaid_count
        name: Bills unpaid
        icon: mdi:file-alert-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
        state_content: state
        card_mod:
          style: |
            ha-card {
              background: var(--casaray-amber-bg);
              border-color: var(--casaray-amber-border);
            }
  # -------------------------------------------------------------------------
  # BAND 4, COLUMN 1 -- "Right now". The render's left column: one large
  # weather panel, then two composed status cards, then a grey footnote that
  # qualifies the section above it.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Right now
      heading_style: title
      icon: mdi:weather-partly-cloudy
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 此刻
      heading_style: title
      icon: mdi:weather-partly-cloudy
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    # The mockup's hero: big temperature, condition and humidity, then a row
    # of days beneath. That is precisely what the native weather card draws
    # with both flags on, so no custom card and no template is involved.
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_current: true
      show_forecast: true
      grid_options: {columns: 12, rows: auto}
    # Amber border: this is live load, and amber is CR-232's "active". The
    # figure is the metered-circuit total, which the footnote below explains.
    - type: tile
      entity: sensor.casa_monitored_power
      name: Monitored power
      icon: mdi:flash
      color: amber
      grid_options: {columns: 12, rows: auto}
      state_content: [state, last_changed]
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% else %}
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
            {% endif %}
          }
    - type: tile
      entity: sensor.casa_solar_expected_today
      name: Solar expected today
      icon: mdi:solar-power-variant
      grid_options: {columns: 12, rows: auto}
      state_content: state
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }
    # Daylight, kept from the previous Home footer. Two across, because they
    # are a pair and because the left column would otherwise sit noticeably
    # shorter than the two beside it.
    - type: tile
      entity: sensor.sun_next_rising
      name: Sunrise
      icon: mdi:weather-sunset-up
      grid_options: {columns: 6, rows: auto}
    - type: tile
      entity: sensor.sun_next_setting
      name: Sunset
      icon: mdi:weather-sunset-down
      grid_options: {columns: 6, rows: auto}
    # "Footnotes explain, in grey, below the section they qualify" -- the
    # 14/09 transcription, and this is the render's own wording.
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        *{{ '只有两个回路装了计量插座，因此这是被监测的用电量，并非全屋。' if cn else 'Two circuits are metered, so this is monitored load — not the whole house.' }}*

  # -------------------------------------------------------------------------
  # BAND 4, COLUMN 2 -- "Who's home" over "One tap". Two headings in one
  # section so the pair always stays in the same column, which separate
  # sections could not guarantee.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Who's home
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 谁在家
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    # Three across, as drawn. A person tile already renders the round avatar,
    # the name and Home/Away, so this is the mockup's card with no additions.
    - type: tile
      entity: person.raymond_du
      grid_options: {columns: 4, rows: 3}
      vertical: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/people}
    - type: tile
      entity: person.vinh_du
      grid_options: {columns: 4, rows: 3}
      vertical: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/people}
    - type: tile
      entity: person.ai_q_huang
      grid_options: {columns: 4, rows: 3}
      vertical: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/people}
    # "Parents' room — Occupied · 4 minutes ago" in the render. The AC's own
    # occupancy sensor is the reading behind it; state_content adds the age.
    - type: tile
      entity: binary_sensor.bedroom_parents_room_ac_room_occupied
      name: Parents Room
      icon: mdi:motion-sensor
      grid_options: {columns: 12, rows: 2}
      state_content: [state, last_changed]
      tap_action: {action: navigate, navigation_path: /casaray-v2/parents-room}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }

  # -------------------------------------------------------------------------
  # BAND B -- "One tap", the full width of both columns, four scene cards
  # across. Split out of the Who's home section earlier because the pair made
  # that column much taller than Right now beside it.
  #
  # At two resolved columns there is no third group to pair it with: every
  # other section on this page is already spoken for, and inventing content to
  # fill half a row would be worse than using the row. Four buttons at 3
  # columns each fill the 12-column grid exactly, so they land 4-across and the
  # renderer has nowhere else to put them. Same four presets, same services,
  # same brightness values -- only the width changed.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: One tap
      heading_style: title
      icon: mdi:flash
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 一键
      heading_style: title
      icon: mdi:flash
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    # 2x2, as drawn. The four presets are the ones the legacy dashboard has
    # run for months (deez_smart_home.yaml, Whole Home Presets) -- same
    # services, same targets, same brightness values, carried across unchanged.
    # They are brightness calls on confirmed light groups, NOT whole-home
    # scenes: CR-233 stays open, because a real Goodnight that also handles
    # TVs and the blind still needs scenes this instance does not have.
    - type: button
      grid_options: {columns: 3, rows: 3}
      name: Evening
      icon: mdi:weather-sunset
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target: {entity_id: light.living_room}
        data: {brightness_pct: 55}
    - type: button
      grid_options: {columns: 3, rows: 3}
      name: Night
      icon: mdi:weather-night
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: [light.living_room, light.bedroom_bedroom, light.dining]
        data: {brightness_pct: 10}
    - type: button
      grid_options: {columns: 3, rows: 3}
      name: Bright
      icon: mdi:white-balance-sunny
      show_state: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: [light.living_room, light.bedroom_bedroom, light.dining]
        data: {brightness_pct: 100}
    - type: button
      grid_options: {columns: 3, rows: 3}
      name: All lights off
      icon: mdi:lightbulb-group-off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: homeassistant.turn_off
        target:
          entity_id:
          - light.living_room
          - light.dining
          - light.bedroom_bedroom
          - switch.mainroomlight_switch_1

  # -------------------------------------------------------------------------
  # BAND C, LEFT -- "Rooms", one of the two columns. Rooms are full-width
  # rows of that column, never a button grid: icon, name, a live secondary
  # line, the whole row navigating. A tile bound to the room's own entity
  # turns amber by itself when that entity is on, which is the render's
  # active state.
  #
  # Half of a two-column page is close to the width the 14/09 render draws
  # these rows at. Across the whole page they would be a name and a state at
  # opposite ends of a very long, mostly empty row.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Rooms
      heading_style: title
      icon: mdi:floor-plan
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 房间
      heading_style: title
      icon: mdi:floor-plan
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: light.living_room
      name: Living Room
      icon: mdi:sofa
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/living-room}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: light.dining
      name: Dining
      icon: mdi:table-chair
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/dining}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: binary_sensor.k_motion_sensor_motion
      name: Kitchen
      icon: mdi:silverware-fork-knife
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/kitchen}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: climate.bedroom_parents_room_ac
      name: Parents Room
      icon: mdi:bed-king
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/parents-room}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: light.bedroom_bedroom
      name: Ray Bedroom
      icon: mdi:bed
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/ray-bedroom}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: switch.g_monitor_freezer_p110m
      name: Garage
      icon: mdi:garage
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/garage}
      icon_tap_action: {action: none}
    - type: tile
      grid_options: {columns: 12, rows: auto}
      entity: switch.g_printer_p100
      name: Guest Room
      icon: mdi:bed-empty
      state_content: [state, last_changed]
      vertical: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/guest-room}
      icon_tap_action: {action: none}

  # -------------------------------------------------------------------------
  # BAND C, RIGHT -- "Shopping list", the other column, so it fills the space
  # beside Rooms rather than hanging underneath it.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Shopping list
      heading_style: title
      icon: mdi:cart-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 购物清单
      heading_style: title
      icon: mdi:cart-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    # todo.shopping_list is a real list this instance already keeps; the
    # render shows it in exactly this position, beside Rooms.
    #
    # `rows: 6` rather than `auto`: at its natural height it is a short card
    # next to seven room rows, and a grid row is as tall as its tallest
    # member, so the difference showed as a hole. Six rows is close to the
    # Rooms group and gives the list room to show what is on it.
    - type: todo-list
      entity: todo.shopping_list
      grid_options: {columns: 12, rows: 6}

  # -------------------------------------------------------------------------
  # BAND 5 -- security, as one composed panel rather than scattered rows:
  # the interpreted summary and the front-door image side by side above, the
  # four things you might tap below. Quiet when everything is closed; a red
  # tile and a red alert card above the moment it is not.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Security
      heading_style: title
      icon: mdi:shield-home
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 安全
      heading_style: title
      icon: mdi:shield-home
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      grid_options: {columns: 6, rows: 4}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set doors = ['binary_sensor.f_contact_sensor_door','binary_sensor.m_contact_sensor_door','binary_sensor.b_contact_sensor_door'] -%}
        {%- set cams = ['camera.front_door_live_view','camera.tapo_c425_north_wall_hd_stream_direct','camera.tapo_c420_east_wall_hd_stream_direct','camera.tapo_c420_south_wall_hd_stream_direct','camera.tapo_c200_stockroom_hd_stream_direct','camera.smart_pet_feeder'] -%}
        {%- set ns = namespace(open=0, unk=0, con=0) -%}
        {%- for d in doors %}{% set s = states(d) %}{% if s == 'on' %}{% set ns.open = ns.open + 1 %}{% elif s != 'off' %}{% set ns.unk = ns.unk + 1 %}{% endif %}{% endfor -%}
        {%- for c in cams %}{% if states(c) not in ['unavailable','unknown'] %}{% set ns.con = ns.con + 1 %}{% endif %}{% endfor -%}
        {%- set wan = states('binary_sensor.eero_wan_status') -%}
        {%- if ns.open %}{% set head = '有门开启' if cn else 'Door open' %}{% set sub = ('%d 扇门开启' % ns.open) if cn else ('%d of 3 doors open' % ns.open) %}
        {%- elif ns.unk %}{% set head = '无法确认' if cn else 'Unconfirmed' %}{% set sub = ('%d 个门窗传感器无数据' % ns.unk) if cn else ('%d of 3 door sensors are not reporting' % ns.unk) %}
        {%- else %}{% set head = '安全' if cn else 'Secure' %}{% set sub = '三扇门全部关闭' if cn else 'All 3 doors closed' %}{% endif -%}
        ## {{ head }}
        {{ sub }}

        {{ '摄像头' if cn else 'Cameras' }} **{{ ns.con }}/{{ cams | count }}** · {{ '网络' if cn else 'Internet' }} **{{ ('在线' if cn else 'Online') if wan == 'on' else (('离线' if cn else 'Offline') if wan == 'off' else ('无数据' if cn else 'No data')) }}**
    - type: picture-entity
      grid_options: {columns: 6, rows: 4}
      entity: camera.front_door_live_view
      name: Front Door
      camera_view: auto
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/camera-front-door}
    - type: tile
      entity: binary_sensor.f_contact_sensor_door
      color: green
      name: Front door
      grid_options: {columns: 3, rows: auto}
      state_content: [state, last_changed]
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }
    - type: tile
      entity: binary_sensor.m_contact_sensor_door
      color: green
      name: Parents Room
      grid_options: {columns: 3, rows: auto}
      state_content: [state, last_changed]
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }
    - type: tile
      entity: binary_sensor.b_contact_sensor_door
      color: green
      name: Backyard
      grid_options: {columns: 3, rows: auto}
      state_content: [state, last_changed]
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }
    - type: button
      grid_options: {columns: 3, rows: auto}
      name: All cameras
      icon: mdi:cctv
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}

  # -------------------------------------------------------------------------
  # BAND E, LEFT -- energy, one column, with Recent activity in the other.
  # Four figures two across rather than four: at half the page width, four in
  # a row is about 140px each and `House power` breaks. Every read is guarded;
  # the inverter is frequently unreachable and must never show as a zero, and
  # nothing here substitutes a number for a reading that is not there.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Energy now
      heading_style: title
      icon: mdi:lightning-bolt
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 当前能耗
      heading_style: title
      icon: mdi:lightning-bolt
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set p = states('sensor.powerpal_gateway_powerpal_power') -%}
        {%- set s = states('sensor.primo_5_0_1_1_ac_power') -%}
        {%- set pk = p not in ['unavailable','unknown','none',''] and p | float(-1) >= 0 -%}
        {%- set sk = s not in ['unavailable','unknown','none',''] and s | float(-1) >= 0 -%}
        {%- set pw = p | float(-1) | round(0) | int -%}
        {%- set sw = s | float(-1) | round(0) | int -%}
        {% if pk %}{{ ('目前全屋用电 %d W。' % pw) if cn else ('The meter reads **%d W** right now.' % pw) }}{% else %}{{ '用电表无数据。' if cn else 'The house meter is not reporting.' }}{% endif %}{%- set sep = '' if cn else ' ' %}{% if sk %}{{ sep ~ (('太阳能发电 %d W。' % sw) if cn else ('Solar is generating **%d W**.' % sw)) }}{% else %}{{ sep ~ ('太阳能逆变器离线，发电量未知。' if cn else 'The solar inverter is offline, so generation is unknown.') }}{% endif %}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_power
      color: amber
      name: House power
      icon: mdi:transmission-tower
      grid_options: {columns: 6, rows: auto}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_daily_energy
      color: amber
      name: Used today
      icon: mdi:counter
      grid_options: {columns: 6, rows: auto}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.primo_5_0_1_1_ac_power
      color: green
      name: Solar now
      icon: mdi:solar-power-variant
      grid_options: {columns: 6, rows: auto}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }
    - type: tile
      entity: sensor.primo_5_0_1_1_energy_day
      color: green
      name: Solar today
      icon: mdi:weather-sunny
      grid_options: {columns: 6, rows: auto}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
      card_mod:
        style: |
          ha-card {
            {% if states(config.entity) in ['unavailable','unknown','none'] %}
            border-style: dashed;
            border-color: var(--casaray-grey-border);
            background: var(--casaray-grey-bg);
            {% endif %}
          }

  # -------------------------------------------------------------------------
  # BAND E, RIGHT -- recent activity. Not in the wall render, kept because a
  # wall panel's "what just happened" has no other home on this dashboard.
  # Four rows deep, which lands it level with the Energy group beside it now
  # that Energy carries two rows of tiles.
  #
  # The three door contacts stay in the target list even while unavailable, so
  # a door that starts reporting again appears here without an edit.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Recent activity
      heading_style: subtitle
      icon: mdi:history
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 近期活动
      heading_style: subtitle
      icon: mdi:history
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: logbook
      hours_to_show: 24
      grid_options: {columns: 12, rows: 4}
      target:
        entity_id:
        - person.raymond_du
        - person.vinh_du
        - person.ai_q_huang
        - binary_sensor.f_contact_sensor_door
        - binary_sensor.m_contact_sensor_door
        - binary_sensor.b_contact_sensor_door
        - climate.bedroom_parents_room_ac
        - light.living_room
        - light.dining

  # -------------------------------------------------------------------------
  # BAND F -- the named index. The top rail is six glyphs; this is every board
  # spelled out, for anyone who would rather read a word than decode an icon.
  #
  # Twelve at TWO columns -- six across -- is what shipped, and live on the
  # iPad the labels ran into each other: `Entertainment` and `Automations` do
  # not fit a 2/12 cell at any sane font size. Four across at three columns
  # each is 50% more width per label, and because 4 x 3 fills the 12-column
  # grid exactly the renderer cannot pack them any other way -- eight across
  # would need 24 columns of 12. Three clean rows:
  #
  #   Rooms | Lighting | Climate | Energy
  #   Bills | Entertainment | Security | Cameras
  #   Network | People | Automations | Alerts
  #
  # then House health and the language toggle at six columns each. `rows: 2`
  # throughout, because these are the controls an older reader reaches for and
  # a one-row button is a thin strip to hit.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: More boards
      heading_style: subtitle
      icon: mdi:view-grid-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 更多面板
      heading_style: subtitle
      icon: mdi:view-grid-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Rooms
      icon: mdi:floor-plan
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Lighting
      icon: mdi:lightbulb-group
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/lighting}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Climate
      icon: mdi:thermometer
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Energy
      icon: mdi:lightning-bolt
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Bills
      icon: mdi:file-document-outline
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Entertainment
      icon: mdi:television-play
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/entertainment}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Security
      icon: mdi:shield-home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Cameras
      icon: mdi:cctv
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: Network
      icon: mdi:wifi
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/network}
    - type: button
      grid_options: {columns: 3, rows: 2}
      name: People
      icon: mdi:account-group
      show_state: false
