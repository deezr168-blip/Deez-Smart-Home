# ===========================================================================
# PARENTS ROOM. The only climate entity in the house, so the native
# thermostat card lives here. Emergency buttons are surfaced as connection
# health -- they are the most safety-relevant devices on the dashboard.
#
# Name drift, deliberate: every bedroom_motion_sensor_* ID below is a
# PARENTS ROOM reading. The device was renamed; the entity IDs kept the old
# slug. Do not repoint these at Ray Bedroom. See docs/entity_inventory.md.
# ===========================================================================
- type: sections
  title: Parents Room
  path: parents-room
  icon: mdi:bed-king
  max_columns: 2
  # No `badges:` here. Home Assistant renders badges ABOVE the sections, so a
  # badge row lands on top of the CasaRay wordmark rather than under the page
  # title where the 14/09 room render puts its pill row (DR-011). The chip
  # strip in section 2 is that pill row, and unlike a badge it can carry a
  # computed value -- the render's own "Quiet, 22 min" is elapsed time since
  # last_changed, which no badge can show.
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ '父母房' if is_state('input_boolean.chinese_dashboard','on') else
        'Parents Room' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set t = states('sensor.bedroom_motion_sensor_temperature') | float(none) -%}
        {% set o = states('binary_sensor.bedroom_parents_room_ac_room_occupied') -%}
        {% if t is not none %}{{ t | round(1) }} °C{% else %}{{ '温度无数据' if cn
        else 'Temperature not reporting' }}{% endif %}{% if o == 'on' %}{{ ' · 有人' if
        cn else ' · occupied' }}{% elif o == 'off' %}{{ ' · 无人' if cn else ' · empty'
        }}{% endif %}
