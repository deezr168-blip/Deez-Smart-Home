        {% if hv == 'off' %}{{ ('空调已关闭。上方的“' ~ nice ~ '”是下次开启时使用的模式。') if cn else ('The air conditioner is off. "' ~ nice ~ '" is the mode it will use when next turned on.') }}{% else %}{{ ('空调正在以 ' ~ nice ~ ' 模式运行。') if cn else ('Running in ' ~ nice ~ '.') }}{% endif %}{% endif %}

