# ===========================================================================
# CLIMATE. One climate entity and four temperature/humidity readings.
# No whole-house HVAC exists, so this interprets rather than pretends.
# ===========================================================================
- type: sections
  title: Climate
  path: climate
  icon: mdi:thermometer
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '气候' if is_state('input_boolean.chinese_dashboard','on') else
        'CLIMATE' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set ts =
        ['sensor.living_room_living_hue_hue_sensor_temperature',
        'sensor.bedroom_motion_sensor_temperature',
        'sensor.living_room_living_room_temperature'] %} {% set ns =
        namespace(sum=0.0, n=0, unk=0) %} {% for t in ts %}{% set s = states(t)
        %}{% if s in ['unavailable','unknown','none',''] %}{% set ns.unk =
        ns.unk + 1 %}{% else %}{% set f = s | float(-999) %}{% if f > -900 %}{%
        set ns.sum = ns.sum + f %}{% set ns.n = ns.n + 1 %}{% else %}{% set
        ns.unk = ns.unk + 1 %}{% endif %}{% endif %}{% endfor %} {% if ns.n %}{% if cn
        %}室内平均 {{ (ns.sum / ns.n) | round(1) }} °C（{{ ns.n }} 个房间）{% if ns.unk
        %} · {{ ns.unk }} 个无数据{% endif %}{% else %}Indoor average {{ (ns.sum / ns.n)
        | round(1) }} °C across {{ ns.n }} {{ 'room' if ns.n == 1 else 'rooms' }}{% if
        ns.unk %} · {{ ns.unk }} not reporting{% endif %}{% endif %}{% else %}{{
        '没有室内温度数据。' if cn else 'No indoor temperature is reporting.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Parents Room AC
      heading_style: title
      icon: mdi:air-conditioner
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 父母房空调
      heading_style: title
      icon: mdi:air-conditioner
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: thermostat
      entity: climate.bedroom_parents_room_ac
      features:
      - type: climate-hvac-modes

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Readings
      heading_style: title
      icon: mdi:thermometer-lines
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 读数
      heading_style: title
      icon: mdi:thermometer-lines
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.living_room_living_hue_hue_sensor_temperature
      name: Living Room
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.bedroom_motion_sensor_temperature
      name: Parents Room
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.bedroom_motion_sensor_humidity
      name: Parents Room humidity
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_living_room_temperature
      name: Dining
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: weather.forecast_home
      name: Outside
      grid_options: {columns: 6, rows: 1}
    # Sensibo reports the unit's configured mode, which persists while the
    # climate entity is off -- so this reads `fanOnly` beside a thermostat card
    # showing Off, and both are correct. The label says which one it is, and
    # the raw camelCase is humanised below. Unknown values are printed as-is
    # rather than guessed at.
    - type: tile
      entity: sensor.master_bedroom_sensibo_sky_plus_air_conditioner_mode
      name: AC mode when on
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.master_bedroom_sensibo_sky_plus_cooling_setpoint
      name: AC setpoint
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set raw = states('sensor.master_bedroom_sensibo_sky_plus_air_conditioner_mode') -%}
        {% set en = {'cool':'Cooling','heat':'Heating','dry':'Dry','fanOnly':'Fan only','auto':'Auto'} -%}
        {% set zh = {'cool':'制冷','heat':'制热','dry':'除湿','fanOnly':'仅送风','auto':'自动'} -%}
        {% set hv = states('climate.bedroom_parents_room_ac') -%}
        {% if raw in ['unavailable','unknown','none',''] %}{{ '空调模式无数据。' if cn else 'The air conditioner mode is not reporting.' }}{% else %}{% set nice = (zh.get(raw, raw) if cn else en.get(raw, raw)) -%}
        {% if hv == 'off' %}{% if cn %}空调当前**已关闭**。上方的“{{ nice }}”是它下次开启时将使用的模式，不是当前正在运行的模式。{% else %}The air conditioner is **off**. "{{ nice }}" above is the mode it will use when it is next turned on, not what it is doing now.{% endif %}{% else %}{% if cn %}空调正在运行，模式为 **{{ nice }}**。{% else %}The air conditioner is running in **{{ nice }}**.{% endif %}{% endif %}{% endif %}
      grid_options: {columns: 6, rows: 1}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Last 24 hours
      heading_style: subtitle
      icon: mdi:chart-line
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 最近 24 小时
      heading_style: subtitle
      icon: mdi:chart-line
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: history-graph
      hours_to_show: 24
      grid_options: {columns: 12, rows: 4}
      entities:
      - entity: sensor.living_room_living_hue_hue_sensor_temperature
        name: Living Room
      - entity: sensor.bedroom_motion_sensor_temperature
        name: Parents Room
      - entity: sensor.bedroom_motion_sensor_humidity
        name: Parents humidity
      - entity: sensor.living_room_living_room_temperature
        name: Dining

# ===========================================================================
# ENERGY. Powerpal is whole-house; the Fronius Primo inverter is currently
# offline and every read of it is guarded. No grid import/export sensor and
# no battery entity exists, so those mockup panels are absent.
# ===========================================================================
- type: sections
  title: Energy
  path: energy
  icon: mdi:lightning-bolt
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '能源' if is_state('input_boolean.chinese_dashboard','on') else
        'ENERGY' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set p = states('sensor.powerpal_gateway_powerpal_power') | float(none) -%}
        {% if p is not none %}{% if cn %}当前 {{ p | round(0) | int }} W{% else %}{{ p |
        round(0) | int }} W now{% endif %}{% else %}{{ '用电量无数据' if cn else 'House
        power not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Right now
      heading_style: title
      icon: mdi:flash
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 此刻
      heading_style: title
      icon: mdi:flash
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set p = states('sensor.powerpal_gateway_powerpal_power') -%}
        {% set s = states('sensor.primo_5_0_1_1_ac_power') -%}
        {% set pk = p not in ['unavailable','unknown','none',''] and p | float(-1) >= 0 -%}
        {% set sk = s not in ['unavailable','unknown','none',''] and s | float(-1) >= 0 -%}
        {% set pw = p | float(-1) | round(0) | int -%}
        {% set sw = s | float(-1) | round(0) | int -%}
        {% if pk and sk %}{% set pf = p | float(-1) %}{% set sf = s | float(-1) -%}
        {% if pf > 0 %}{% set share = ((sf / pf) * 100) | round(0) | int -%}
        {% if share >= 100 %}{% if cn %}太阳能已覆盖全部家庭用电并有盈余：发电 **{{ sw }}
        W**，家庭用电 **{{ pw }} W**。{% else %}Solar is covering all household demand and
        producing surplus: **{{ sw }} W** generated against **{{ pw }} W** drawn.{% endif
        %}{% else %}{% if cn %}太阳能供应了家庭用电的 **{{ share }}%**。{% else %}Solar is
        supplying **{{ share }}%** of household demand.{% endif %}{% endif %}{% else %}{%
        if cn %}家庭用电 {{ pw }} W。{% else %}House draw is {{ pw }} W.{% endif %}{% endif
        %}{% elif pk %}{% if cn %}当前用电 **{{ pw }} W**。太阳能逆变器离线，无法计算太阳能占比。{%
        else %}Drawing **{{ pw }} W**. The solar inverter is offline, so solar
        contribution cannot be calculated.{% endif %}{% elif sk %}{% if cn %}太阳能发电 **{{
        sw }} W**。家庭用电量无数据。{% else %}Solar generating **{{ sw }} W**. House
        consumption is not reporting.{% endif %}{% else %}{{ '用电表与太阳能逆变器目前均无数据。'
        if cn else 'Neither the house power meter nor the solar inverter is reporting
        right now.' }}{% endif %}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_power
      color: amber
      name: House power
      icon: mdi:transmission-tower
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.primo_5_0_1_1_ac_power
      color: green
      name: Solar power
      icon: mdi:solar-power-variant
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_daily_energy
      color: amber
      name: House today
      icon: mdi:counter
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.primo_5_0_1_1_energy_day
      color: green
      name: Solar today
      icon: mdi:weather-sunny
      grid_options: {columns: 6, rows: 1}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Solar system
      heading_style: title
      icon: mdi:solar-panel
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 太阳能系统
      heading_style: title
      icon: mdi:solar-panel
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set s =
        states('sensor.primo_5_0_1_1_ac_power') %} {% if s in
        ['unavailable','unknown'] %}{{ '**Fronius Primo
        逆变器离线。**在重新连接之前，下方所有太阳能数据均为过期或缺失。这是硬件或网络故障，不是面板问题。'
        if cn else '**The Fronius Primo inverter is offline.** Every solar reading
        below is stale or absent until it reconnects. This is a hardware or network
        fault, not a dashboard one.' }}{% else %}{{ '逆变器运行正常。' if cn else
        'Inverter reporting normally.' }}{% endif %}
    - type: tile
      entity: sensor.primo_5_0_1_1_energy_year
      name: Solar this year
    - type: tile
      entity: sensor.primo_5_0_1_1_total_energy
      color: green
      name: Solar lifetime
    - type: tile
      entity: binary_sensor.casa_solar_online
      color: green
      name: Inverter online
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.primo_5_0_1_1_status_message
      name: Inverter status
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.primo_5_0_1_1_error_message
      name: Inverter errors
      grid_options: {columns: 6, rows: 1}


  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Solar forecast
      heading_style: title
      icon: mdi:weather-sunny-alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 太阳能预测
      heading_style: title
      icon: mdi:weather-sunny-alert
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {% set t = states('sensor.energy_production_today') | float(none) -%}
        {% set r = states('sensor.energy_production_today_remaining') | float(none) -%}
        {% set n = states('sensor.power_production_now') | float(none) -%}
        {% if t is not none %}{{ ('今日预计太阳能 **%.1f kWh**' % t) if cn else ('Forecast
        **%.1f kWh** solar today.' % t) }}{% if r is not none %}{{ ('，其中剩余 **%.1f
        kWh**。' % r) if cn else (' **%.1f kWh** of that is still to come.' % r) }}{%
        endif %}{% else %}{{ '太阳能预测目前无数据。' if cn else 'Solar forecast is not
        reporting.' }}{% endif %}{% if n is not none %}{{ ('当前预测功率 **%d W**。' % n)
        if cn else (' Forecast production now: **%d W**.' % n) }}{% endif %}
        {%- if cn %} 以上均为预测值，来自太阳能预测集成，不是逆变器实测值；“剩余”是该集成对今日余下时段的预测，并非“今日预测减去已发电量”。实测发电量见上方的“今日太阳能”。{% else %} These are forecast
        figures from the solar-forecast integration, not inverter readings, and
        "still to come" is that integration's own forecast for the rest of the day —
        not today's forecast minus what has already been generated. Actual generation
        is the "Solar today" tile above.{% endif %}
    - type: tile
      entity: sensor.energy_production_today
      name: Forecast today
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.energy_production_today_remaining
      name: Remaining today
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.energy_production_tomorrow
      name: Forecast tomorrow
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.power_production_now
      name: Forecast power now
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.energy_current_hour
      name: This hour
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.energy_next_hour
      name: Next hour
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.power_highest_peak_time_today
      name: Best sun today
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.power_highest_peak_time_tomorrow
      name: Best sun tomorrow
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.casa_solar_expected_today
      name: Expected today
      grid_options: {columns: 4, rows: 1}

