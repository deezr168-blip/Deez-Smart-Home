# CasaRay v2 — rebuilt from scratch on the frozen CasaRay Design v1.
#
# Architecture: native-first per Master Design Briefing v1 section 20.
#   Sections layout -> heading -> tile -> native domain cards -> markdown
#   for the interpretation layer. No card_mod: surface treatment belongs to
#   themes/deez_your_name.yaml. Only custom:webrtc-camera is depended on,
#   and only where a live low-latency stream has no native equivalent.
#
# Entity truth: docs/entity_inventory.md. Every ID below is already
# referenced by dashboards/deez_smart_home.yaml or was confirmed by the
# owner-supplied B1 Developer Tools entity export on 2026-09-05. Nothing is
# invented. Components with no data behind them are absent, not faked.
#
# Layout: max_columns 2 throughout. iPad landscape renders ~2 usable
# columns whatever the mockups show.
#
# Comments survive in this repository. If this file is ever imported into a
# storage-mode dashboard it round-trips through a YAML dumper and they are
# stripped; the rationale is duplicated in the architecture document.

kiosk_mode:
  hide_sidebar: true
  hide_header: true
  ignore_per_user: false
# The CasaRay theme adds the frozen design's card-title typography -- small,
# uppercase, letter-spaced -- on top of the shared surface treatment. It is a
# separate theme so the legacy dashboard, which shares the same base anchor,
# keeps its own look. themes/deez_your_name.yaml must be deployed to
# /config/themes/ and themes reloaded, or this falls back to the user's
# default theme and CasaRay loses its background and glass entirely.
# scripts/sync_casaray_to_config.sh syncs both.
theme: CasaRay

views:

# ===========================================================================
# HOME -- executive overview. Status before controls, exceptions before
# status. Briefing section 4: answer "is the house okay" in seconds.
# ===========================================================================
- type: sections
  title: CasaRay
  path: home
  icon: mdi:home-heart
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 8, rows: 2}
      content: >-
        {% set h = now().hour %} {% set cn =
        is_state('input_boolean.chinese_dashboard','on') %} {% if h < 12 %}{%
        set g = '早安' if cn else 'Good morning' %}{% elif h < 18 %}{% set g =
        '午安' if cn else 'Good afternoon' %}{% else %}{% set g = '晚安' if cn
        else 'Good evening' %}{% endif %}

        # {{ g }}{{ '，Ray' if cn else ', Ray' }}

        {{ 'CasaRay 家庭控制中心' if cn else 'CasaRay household control centre' }}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Bills
      icon: mdi:file-document-outline
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Entertainment
      icon: mdi:television-play
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/entertainment}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Automations
      icon: mdi:robot
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/automations}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Alerts
      icon: mdi:bell-alert
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/alerts}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Health
      icon: mdi:heart-pulse
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}

  # --- Attention. Conditional throughout: a healthy house shows nothing. ---
  # KPI strip -- the frozen design's "status strip directly under the header":
  # a small uppercase label, a large value and a caption, per Master Home.
  # Four rather than the render's five, and 2x2 rather than 1x5, because iPad
  # landscape gives two usable columns whatever the mockup shows. Every figure
  # comes from an entity this dashboard already reads; nothing is invented,
  # and each card keeps its own "not reporting" branch.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set p = states('sensor.powerpal_gateway_powerpal_power') | float(none) -%}
        {%- set s = states('sensor.primo_5_0_1_1_ac_power') | float(none) -%}
        {%- set hd = states('sensor.powerpal_gateway_powerpal_daily_energy') | float(none) -%}
        {%- set sd = states('sensor.primo_5_0_1_1_energy_day') | float(none) -%}
        **{{ '家庭用电' if cn else 'HOUSE POWER' }}**
        {% if p is not none %}## {{ (p / 1000) | round(2) }} kW
        {{ '当前总用电' if cn else 'Total usage' }}{% else %}## —
        {{ '用电表无数据' if cn else 'Meter not reporting' }}{% endif %}

        {{ '太阳能' if cn else 'Solar' }} **{{ (s | round(0) | int ~ ' W') if s is not none else '—' }}** · {{ '今日用电' if cn else 'Today' }} **{{ (hd | round(1) ~ ' kWh') if hd is not none else '—' }}** · {{ '今日发电' if cn else 'Solar today' }} **{{ (sd | round(1) ~ ' kWh') if sd is not none else '—' }}**
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set ts = ['sensor.living_room_living_hue_hue_sensor_temperature','sensor.bedroom_motion_sensor_temperature','sensor.living_room_living_room_temperature'] -%}
        {%- set ns = namespace(sum=0.0, n=0) -%}
        {%- for t in ts %}{% set f = states(t) | float(none) %}{% if f is not none %}{% set ns.sum = ns.sum + f %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor -%}
        {%- set h = states('sensor.bedroom_motion_sensor_humidity') | float(none) -%}
        {%- set aq = states('sensor.living_room_air_purifier_air_quality') -%}
        **{{ '室内气候' if cn else 'INDOOR CLIMATE' }}**
        {% if ns.n %}{% set avg = (ns.sum / ns.n) %}## {{ avg | round(1) }} °C
        {% if avg >= 18 and avg <= 25 %}{{ '舒适' if cn else 'Comfortable' }}{% elif avg < 18 %}{{ '偏冷' if cn else 'Cool' }}{% else %}{{ '偏热' if cn else 'Warm' }}{% endif %} · {{ ns.n }} {{ '个房间' if cn else ('room' if ns.n == 1 else 'rooms') }}{% else %}## —
        {{ '没有室内温度数据' if cn else 'No indoor temperature reporting' }}{% endif %}

        {{ '湿度' if cn else 'Humidity' }} **{{ (h | round(0) | int ~ '%') if h is not none else '—' }}** · {{ '空气质量' if cn else 'Air quality' }} **{{ aq if aq not in ['unavailable','unknown','none',''] else '—' }}**
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set doors = ['binary_sensor.f_contact_sensor_door','binary_sensor.m_contact_sensor_door','binary_sensor.b_contact_sensor_door'] -%}
        {%- set cams = ['camera.front_door_live_view','camera.tapo_c425_north_wall_hd_stream_direct','camera.tapo_c420_east_wall_hd_stream_direct','camera.tapo_c420_south_wall_hd_stream_direct','camera.tapo_c200_stockroom_hd_stream_direct','camera.smart_pet_feeder'] -%}
        {%- set ns = namespace(dopen=0, dunk=0, con=0) -%}
        {%- for d in doors %}{% set s = states(d) %}{% if s == 'on' %}{% set ns.dopen = ns.dopen + 1 %}{% elif s != 'off' %}{% set ns.dunk = ns.dunk + 1 %}{% endif %}{% endfor -%}
        {%- for c in cams %}{% if states(c) not in ['unavailable','unknown'] %}{% set ns.con = ns.con + 1 %}{% endif %}{% endfor -%}
        {%- set wan = states('binary_sensor.eero_wan_status') -%}
        **{{ '安全' if cn else 'SECURITY' }}**
        {% if ns.dopen %}## {{ '有门开启' if cn else 'Door open' }}
        {{ '%d 扇门开启' % ns.dopen if cn else '%d of 3 doors open' % ns.dopen }}{% elif ns.dunk %}## {{ '无法确认' if cn else 'Unconfirmed' }}
        {{ '%d 个门窗传感器无数据' % ns.dunk if cn else '%d of 3 door sensors not reporting' % ns.dunk }}{% else %}## {{ '安全' if cn else 'Secure' }}
        {{ '三扇门全部关闭' if cn else 'All 3 doors closed' }}{% endif %}

        {{ '摄像头' if cn else 'Cameras' }} **{{ ns.con }}/{{ cams | count }}** · {{ '网络' if cn else 'Internet' }} **{{ ('在线' if cn else 'Online') if wan == 'on' else (('离线' if cn else 'Offline') if wan == 'off' else ('无数据' if cn else 'Unknown')) }}**
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set sd = states('sensor.primo_5_0_1_1_energy_day') | float(none) -%}
        {%- set hd = states('sensor.powerpal_gateway_powerpal_daily_energy') | float(none) -%}
        **{{ '今日太阳能' if cn else 'SOLAR TODAY' }}**
        {% if sd is not none and hd is not none and hd > 0 %}{% set share = ((sd / hd) * 100) | round(0) | int %}## {{ share }}%
        {% if share >= 100 %}{{ '已覆盖今日全部用电并有盈余' if cn else 'Covered all of today’s use, with surplus' }}{% else %}{{ '的今日用电来自太阳能' if cn else 'of today’s use came from solar' }}{% endif %}{% elif sd is not none %}## {{ sd | round(1) }} kWh
        {{ '今日发电量。家庭用电量无数据，无法计算占比。' if cn else 'generated today. House use is not reporting, so the share cannot be worked out.' }}{% else %}## —
        {{ '太阳能今日发电量无数据' if cn else 'Solar generation today is not reporting' }}{% endif %}

        {{ '发电' if cn else 'Generated' }} **{{ (sd | round(1) ~ ' kWh') if sd is not none else '—' }}** · {{ '用电' if cn else 'Used' }} **{{ (hd | round(1) ~ ' kWh') if hd is not none else '—' }}**

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Needs attention
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 需要注意
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set
        doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] -%} {% set bats =
        ['sensor.front_door_battery', 'sensor.living_room_ringring_battery',
        'sensor.tapo_c425_north_wall_battery',
        'sensor.tapo_camera_bcca_battery',
        'sensor.tapo_c420_south_wall_battery',
        'sensor.aqara_roller_shade_driver_e1_battery'] -%} {% set cams =
        ['camera.front_door_live_view',
        'camera.tapo_c425_north_wall_hd_stream_direct',
        'camera.tapo_c420_east_wall_hd_stream_direct',
        'camera.tapo_c420_south_wall_hd_stream_direct',
        'camera.tapo_c200_stockroom_hd_stream_direct',
        'camera.smart_pet_feeder'] -%} {% set ns = namespace(dopen=0, dunk=0,
        blow=0, bunk=0, coff=0) -%} {% for d in doors %}{% set s = states(d) %}{%
        if s == 'on' %}{% set ns.dopen = ns.dopen + 1 %}{% elif s != 'off' %}{%
        set ns.dunk = ns.dunk + 1 %}{% endif %}{% endfor -%} {% for b in bats %}{%
        set s = states(b) %}{% if s in ['unavailable','unknown','none',''] %}{%
        set ns.bunk = ns.bunk + 1 %}{% else %}{% set f = s | float(-1) %}{% if f
        < 0 %}{% set ns.bunk = ns.bunk + 1 %}{% elif f < 30 %}{% set ns.blow =
        ns.blow + 1 %}{% endif %}{% endif %}{% endfor -%} {% for c in cams %}{% if
        states(c) in ['unavailable','unknown'] %}{% set ns.coff = ns.coff + 1
        %}{% endif %}{% endfor -%} {% set total = ns.dopen + ns.blow + ns.coff -%}
        {% if total == 0 and ns.dunk == 0 and ns.bunk == 0 %}{{ '一切正常。' if
        cn else 'All clear. Nothing needs attention.' }}{% else %}{% if ns.dopen
        %}- **{{ ns.dopen }}** {{ '扇门开启' if cn else ('door open' if ns.dopen
        == 1 else 'doors open') }}

        {% endif %}{% if ns.blow %}- **{{ ns.blow }}** {{ '个电池低于 30%' if cn
        else 'batteries under 30%' }}

        {% endif %}{% if ns.coff %}- **{{ ns.coff }}** {{ '个摄像头离线' if cn
        else ('camera offline' if ns.coff == 1 else 'cameras offline') }}

        {% endif %}{% if ns.dunk %}- {{ ns.dunk }} {{ '扇门传感器离线' if cn else
        'door sensors not reporting' }}

        {% endif %}{% if ns.bunk %}- {{ ns.bunk }} {{ '个电池无数据' if cn else
        'batteries not reporting' }}

        {% endif %}{% endif %}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.f_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.f_contact_sensor_door
        name: Front door open
        icon: mdi:door-open
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.b_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.b_contact_sensor_door
        name: Backyard door open
        icon: mdi:door-open
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.m_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.m_contact_sensor_door
        name: Parents Room door open
        icon: mdi:door-open
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.front_door_battery
        below: 30
      card:
        type: tile
        entity: sensor.front_door_battery
        name: Front Door battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.living_room_ringring_battery
        below: 30
      card:
        type: tile
        entity: sensor.living_room_ringring_battery
        name: RingRing battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.tapo_c425_north_wall_battery
        below: 30
      card:
        type: tile
        entity: sensor.tapo_c425_north_wall_battery
        name: North Wall camera battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.eero_wan_status
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.eero_wan_status
        name: Internet
        icon: mdi:wan
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        name: Garage freezer circuit overloaded
        icon: mdi:flash-alert
        color: red
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        name: Parents Room AC filter needs cleaning
        icon: mdi:air-filter
        color: orange
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.lg_fridge_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.lg_fridge_door
        name: Fridge door open
        icon: mdi:fridge-alert-outline
        color: orange

  # --- Household: who is in, and is the house secure. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Household
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 家庭
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: zone.home
      name: People home
      icon: mdi:home-account
      tap_action: {action: navigate, navigation_path: /casaray-v2/people}
    - type: tile
      entity: person.raymond_du
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: person.vinh_du
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: person.ai_q_huang
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.eero_wan_status
      color: green
      name: Internet
      icon: mdi:wan

  # --- Security roll-up. No alarm row: no alarm_control_panel exists. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Security
      heading_style: title
      icon: mdi:shield-home
      badges:
      - type: entity
        entity: binary_sensor.f_contact_sensor_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 安全
      heading_style: title
      icon: mdi:shield-home
      badges:
      - type: entity
        entity: binary_sensor.f_contact_sensor_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set
        doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] -%} {% set ns =
        namespace(open=0, unk=0) -%} {% for d in doors %}{% set s = states(d) %}{%
        if s == 'on' %}{% set ns.open = ns.open + 1 %}{% elif s != 'off' %}{% set
        ns.unk = ns.unk + 1 %}{% endif %}{% endfor -%} {% if ns.unk %}{{
        '门窗传感器有 %d 个无数据。' % ns.unk if cn else '%d of 3 door sensors
        are not reporting. Security state cannot be confirmed.' % ns.unk }}{%
        elif ns.open %}{{ '%d 扇门开启。' % ns.open if cn else '%d of 3 doors
        open.' % ns.open }}{% else %}{{ '三扇门全部关闭。' if cn else 'All 3
        doors closed.' }}{% endif %}
    - type: tile
      entity: binary_sensor.f_contact_sensor_door
      color: red
      name: Front door
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.m_contact_sensor_door
      color: red
      name: Parents Room
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.b_contact_sensor_door
      color: red
      name: Backyard
      grid_options: {columns: 4, rows: 1}

  # --- Energy now. The inverter is offline right now; guard every read. ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Energy now
      heading_style: title
      icon: mdi:lightning-bolt
      badges:
      - type: entity
        entity: sensor.powerpal_gateway_powerpal_power
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 当前能耗
      heading_style: title
      icon: mdi:lightning-bolt
      badges:
      - type: entity
        entity: sensor.powerpal_gateway_powerpal_power
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set p
        = states('sensor.powerpal_gateway_powerpal_power') -%} {% set s =
        states('sensor.primo_5_0_1_1_ac_power') -%} {% set pk = p not in
        ['unavailable','unknown','none',''] and p | float(-1) >= 0 -%} {% set sk =
        s not in ['unavailable','unknown','none',''] and s | float(-1) >= 0 -%}
        {% set pw = p | float(-1) | round(0) | int -%}
        {% set sw = s | float(-1) | round(0) | int -%}
        {% if pk %}{{ '目前用电 %d W。' % pw if cn else 'Drawing **%d W** right
        now.' % pw }}{% else %}{{ '用电量无数据。' if cn else 'House power is not
        reporting.' }}{% endif %} {% if sk %}{{ ' 太阳能发电 %d W。' % sw if cn
        else ' Solar generating **%d W**.' % sw }}{% else %}{{ '
        太阳能逆变器离线。' if cn else ' The solar inverter is offline, so
        generation is unknown.' }}{% endif %}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_power
      color: amber
      name: House power
      icon: mdi:transmission-tower
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_daily_energy
      color: amber
      name: Used today
      icon: mdi:counter
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.primo_5_0_1_1_ac_power
      color: green
      name: Solar now
      icon: mdi:solar-power-variant
