    - type: tile
      entity: sensor.kitchen_electrolux_fridge_battery
      name: Sensor battery
      grid_options: {columns: 6, rows: 1}

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Sensors
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 传感器
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: binary_sensor.k_motion_sensor_motion
      name: Motion
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: binary_sensor.k_motion_sensor_occupancy
      name: Occupancy
      grid_options: {columns: 6, rows: 1}
    - type: history-graph
      hours_to_show: 24
      grid_options: {columns: 12, rows: 3}
      entities:
      - entity: binary_sensor.k_motion_sensor_motion
        name: Kitchen motion
      - entity: binary_sensor.lg_fridge_door
        name: Fridge door

  - type: grid
    column_span: 2
    cards:
