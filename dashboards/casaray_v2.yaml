# ===========================================================================
# SECURITY. Doors, motion, camera health. There is no alarm_control_panel
# and no lock entity in this instance, so there is no arm/disarm control and
# no lock row -- the mockup's "Armed (Away)" and "Front Door unlocked" have
# no source. Their absence is the honest state, not an omission.
# ===========================================================================
- type: sections
  title: Security
  path: security
  icon: mdi:shield-home
  max_columns: 2
  # Status pills under the page header, per DESIGN_REFERENCE section 2:
  # "Right: status pills where relevant (People Home, Internet Online)".
  # Native `badges` on a sections view render exactly that strip, so this
  # needs no custom card and no card_mod. No `name` is set deliberately --
  # a badge with only an icon and a value is language-neutral, which keeps
  # the bilingual toggle out of a place where two heading cards cannot go.
  # No `color` either: CR-232 has not settled blue against amber, so the
  # badges take the theme's own colour rather than pre-empting that answer.
  badges:
  - type: entity
    entity: zone.home
  - type: entity
    entity: binary_sensor.eero_wan_status
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '安全' if is_state('input_boolean.chinese_dashboard','on') else
        'SECURITY' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] %} {% set ns = namespace(open=0,
        unk=0) %} {% for d in doors %}{% set s = states(d) %}{% if s == 'on' %}{%
        set ns.open = ns.open + 1 %}{% elif s != 'off' %}{% set ns.unk = ns.unk +
        1 %}{% endif %}{% endfor %} {% if ns.unk %}{% if cn %}3 个门传感器中 {{ ns.unk }}
        个无数据{% else %}{{ ns.unk }} of 3 door sensors not reporting{% endif %}{% elif
        ns.open %}{% if cn %}3 扇门中 {{ ns.open }} 扇开启{% else %}{{ ns.open }} of 3
        doors open{% endif %}{% else %}{{ '所有门已关闭' if cn else 'All doors closed'
        }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  # KPI strip, per DESIGN_REFERENCE's content-grid rule and the Home mockup's
  # SECURITY card. Same shape as the Home and Cameras strips. Every count is
  # taken from entities already on this page, and the doors card leads with
  # "Unconfirmed" rather than "Secure" because all three contact sensors are
  # down -- CLAUDE.md forbids a card asserting a reassuring state it cannot
  # see, and this is the page where that matters most.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set doors = [('binary_sensor.f_contact_sensor_door','Front','前门'),
                         ('binary_sensor.m_contact_sensor_door','Parents Room','父母房'),
                         ('binary_sensor.b_contact_sensor_door','Backyard','后院')] -%}
        {%- set ns = namespace(open=[], shut=0, quiet=[]) -%}
        {%- for d, en, zh in doors %}{% set s = states(d) %}{% if s == 'on' %}{% set ns.open = ns.open + [zh if cn else en] %}{% elif s == 'off' %}{% set ns.shut = ns.shut + 1 %}{% else %}{% set ns.quiet = ns.quiet + [zh if cn else en] %}{% endif %}{% endfor -%}
        **{{ '外门' if cn else 'EXTERNAL DOORS' }}**
        {% if ns.open %}## {{ '有门开启' if cn else 'Open' }}
        {{ (ns.open | join('、') ~ '开启') if cn else (ns.open | join(', ') ~ ' open') }}{% elif ns.quiet %}## {{ '无法确认' if cn else 'Unconfirmed' }}
        {{ ('%d/%d 个门磁没有数据' % (ns.quiet | count, doors | count)) if cn else ('%d of %d door sensors are not reporting' % (ns.quiet | count, doors | count)) }}{% else %}## {{ '已关闭' if cn else 'Closed' }}
        {{ '三扇外门全部关闭' if cn else 'All 3 external doors are closed' }}{% endif %}

        {% if ns.quiet %}{{ ('无数据：' ~ ns.quiet | join('、') ~ '。门磁离线时，此处不会显示“已关闭”。') if cn else ('Silent: ' ~ ns.quiet | join(', ') ~ '. A door with no sensor is never reported as closed.') }}{% else %}{{ '三个门磁都有数据。' if cn else 'All 3 door sensors are reporting.' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set mot = [('binary_sensor.living_room_living_hue_hue_sensor_motion','Living Room','客厅'),
                       ('binary_sensor.k_motion_sensor_motion','Kitchen','厨房'),
                       ('binary_sensor.bedroom_motion_sensor_motion','Parents Room','父母房'),
                       ('binary_sensor.sensor_group_motion','Dining','餐厅')] -%}
        {%- set ns = namespace(active=[], still=0, quiet=0) -%}
        {%- for m, en, zh in mot %}{% set s = states(m) %}{% if s == 'on' %}{% set ns.active = ns.active + [zh if cn else en] %}{% elif s == 'off' %}{% set ns.still = ns.still + 1 %}{% else %}{% set ns.quiet = ns.quiet + 1 %}{% endif %}{% endfor -%}
        **{{ '动作' if cn else 'MOTION' }}**
        {% if ns.active %}## {{ ns.active | count }} {{ '个房间' if cn else ('room' if ns.active | count == 1 else 'rooms') }}
        {{ (ns.active | join('、') ~ '检测到动作') if cn else ('Movement in ' ~ ns.active | join(', ')) }}{% elif ns.quiet == mot | count %}## —
        {{ '没有动作传感器有数据' if cn else 'No motion sensor is reporting' }}{% else %}## {{ '安静' if cn else 'Still' }}
        {{ ('%d 个传感器都没有检测到动作' % ns.still) if cn else ('%d sensors report no movement' % ns.still) }}{% endif %}

        {{ ns.still + (ns.active | count) }}{{ '/' }}{{ mot | count }} {{ '个传感器有数据' if cn else 'sensors reporting' }}{% if ns.quiet %} · {{ ns.quiet }} {{ '个无数据' if cn else 'silent' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set cams = [('camera.front_door_live_view','Front Door','前门'),
                        ('camera.tapo_c425_north_wall_hd_stream_direct','North Wall','北墙'),
                        ('camera.tapo_c420_east_wall_hd_stream_direct','East Wall','东墙'),
                        ('camera.tapo_c420_south_wall_hd_stream_direct','South Wall','南墙'),
                        ('camera.tapo_c200_stockroom_hd_stream_direct','Stockroom','储藏室'),
                        ('camera.smart_pet_feeder','Pet Feeder','宠物喂食器')] -%}
        {%- set ns = namespace(up=0, down=[]) -%}
        {%- for c, en, zh in cams %}{% if states(c) not in ['unavailable','unknown'] %}{% set ns.up = ns.up + 1 %}{% else %}{% set ns.down = ns.down + [zh if cn else en] %}{% endif %}{% endfor -%}
        **{{ '摄像头' if cn else 'CAMERAS' }}**
        ## {{ ns.up }}/{{ cams | count }}
        {% if ns.down %}{{ ('离线：' ~ ns.down | join('、')) if cn else ('Offline: ' ~ ns.down | join(', ')) }}{% else %}{{ '全部摄像头正在推流' if cn else 'Every camera is streaming' }}{% endif %}

        {{ '网络' if cn else 'Internet' }} **{{ ('在线' if cn else 'Online') if is_state('binary_sensor.eero_wan_status','on') else (('离线' if cn else 'Offline') if is_state('binary_sensor.eero_wan_status','off') else ('无数据' if cn else 'Unknown')) }}**
    - type: markdown
      grid_options: {columns: 6, rows: 3}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {# Six switches, one question: will this camera tell anyone? They are
           not all named the same thing by their integrations -- motion
           detection, person detection, notifications, motion alarm -- so the
           card counts cameras that have their alerting switch on rather than
           claiming they are one setting. #}
        {%- set al = [('switch.front_door_motion_detection','Front Door','前门'),
                      ('switch.tapo_c425_north_wall_notifications','North Wall','北墙'),
                      ('switch.tapo_camera_bcca_motion_detection','East Wall','东墙'),
                      ('switch.tapo_c420_south_wall_motion_detection','South Wall','南墙'),
                      ('switch.tapo_c200_stockroom_notifications','Stockroom','储藏室'),
                      ('switch.smart_pet_feeder_motion_alarm','Pet Feeder','宠物喂食器')] -%}
        {%- set ns = namespace(on=0, off=[], quiet=0) -%}
        {%- for a, en, zh in al %}{% set s = states(a) %}{% if s == 'on' %}{% set ns.on = ns.on + 1 %}{% elif s == 'off' %}{% set ns.off = ns.off + [zh if cn else en] %}{% else %}{% set ns.quiet = ns.quiet + 1 %}{% endif %}{% endfor -%}
        **{{ '警报设置' if cn else 'ALERTING' }}**
        {% if ns.on + (ns.off | count) %}## {{ ns.on }}/{{ ns.on + (ns.off | count) }}
        {% if ns.off %}{{ ('未开启：' ~ ns.off | join('、')) if cn else ('Not alerting: ' ~ ns.off | join(', ')) }}{% else %}{{ '所有报告中的摄像头都会发出提醒' if cn else 'Every reporting camera will raise an alert' }}{% endif %}{% else %}## —
        {{ '没有摄像头报告警报设置' if cn else 'No camera is reporting an alerting setting' }}{% endif %}

        {{ '各集成对这项设置的命名不同（动作侦测、人形侦测、通知、动作警报），此处统计的是“会不会通知你”。' if cn else 'The integrations name this differently — motion detection, person detection, notifications, motion alarm — so this counts cameras that will tell you, not one shared setting.' }}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Doors
      heading_style: title
      icon: mdi:door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
