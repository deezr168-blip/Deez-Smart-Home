  # Upcoming bills timeline -- Master Design Briefing v1 section 6 asks the
  # billing board for one, alongside the all-bills table it already has.
  # Sorted by due date, each row carrying the amount, the date and how long
  # away it is, so "what is next and how bad is it" is one glance.
  #
  # Same three helpers per bill as the cards and the overview, so all three
  # agree by construction. Bills with no amount entered are counted, not
  # listed: an unconfigured helper is not an upcoming bill.
- type: sections
  title: Security
  path: security
  icon: mdi:shield-home
  max_columns: 2
  # No `badges:` here. Home Assistant renders badges ABOVE the sections, so a
  # badge row lands on top of the CasaRay wordmark rather than under the page
  # header where the 14/09 render puts its pill row (DR-011). This page's pill
  # row is the full-width markdown chip strip in section 2 instead, which also
  # lets a chip carry a computed figure -- "3 of 6 unpaid", "2/4 alerting" --
  # that no badge could honestly show.
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ '安全' if is_state('input_boolean.chinese_dashboard','on') else
        'Security' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%}{% set doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] -%} {% set ns = namespace(open=0,
        unk=0) -%} {% for d in doors -%}{% set s = states(d) -%}{% if s == 'on' %}{%
        set ns.open = ns.open + 1 -%}{% elif s != 'off' %}{% set ns.unk = ns.unk +
        1 -%}{% endif %}{% endfor -%} {% if ns.unk %}{% if cn %}3 个门传感器中 {{ ns.unk }}
        个无数据{% else %}{{ ns.unk }} of 3 door sensors not reporting{% endif %}{% elif
        ns.open %}{% if cn %}3 扇门中 {{ ns.open }} 扇开启{% else %}{{ ns.open }} of 3
        doors open{% endif %}{% else %}{{ '所有门已关闭' if cn else 'All doors closed'
        }}{% endif %}
    # Time over date, right-aligned, DD/MM/YY -- never %Y. `nowrap` is a
    # guarantee where a `columns` value is only a bet (DR-012).
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        ## {{ now().strftime('%I:%M %p').lstrip('0').lower() }}
        {{ now().strftime('%d/%m/%y') }}
      card_mod:
        style: |
          ha-card { text-align: right; white-space: nowrap; }
    # The shared nav rail. Identical on every board and room page so the
    # dashboard reads as one application; the current page's icon is tinted
    # amber, which is the render's selected state.
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
      card_mod:
        style: |
          ha-card {
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
          }
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}


  # -------------------------------------------------------------------------
  # The chip strip, the same single full-width card Home uses.
  #
  # This replaced FOUR tall KPI cards. Their logic is kept in full -- the same
  # three doors, four motion sensors, six cameras and six alerting switches,
  # with the same three-way branching -- but a 2x2 block of tall cards is not
  # what the 14/09 Security render shows above the fold. It shows a thin pill
  # row: `Doors All closed`, `Cameras 4 of 6 online`. The detail those cards
  # carried (which door is silent, which camera is offline) is on the Doors and
  # Camera health cards below, where the render puts it, and the footnote
  # appears only when something is actually silent.
  # -------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {#- Doors: open wins over unconfirmed wins over closed. A door whose
            sensor is silent is never reported as closed. -#}
        {%- set doors = ['binary_sensor.f_contact_sensor_door',
                         'binary_sensor.m_contact_sensor_door',
                         'binary_sensor.b_contact_sensor_door'] -%}
        {%- set ns = namespace(dopen=0, dquiet=0, mact=0, mquiet=0, cup=0, aon=0, aknown=0) -%}
        {%- for e in doors %}{% set s = states(e) %}{% if s == 'on' %}{% set ns.dopen = ns.dopen + 1 %}{% elif s != 'off' %}{% set ns.dquiet = ns.dquiet + 1 %}{% endif %}{% endfor -%}
        {%- if ns.dopen %}{% set dv = ('%d 扇开启' % ns.dopen) if cn else ('%d open' % ns.dopen) %}
        {%- elif ns.dquiet == doors | count %}{% set dv = nd %}
        {%- elif ns.dquiet %}{% set dv = ('%d 个无数据' % ns.dquiet) if cn else ('%d not reporting' % ns.dquiet) %}
        {%- else %}{% set dv = '全部关闭' if cn else 'All closed' %}{% endif -%}
        {%- set mot = ['binary_sensor.living_room_living_hue_hue_sensor_motion',
                       'binary_sensor.k_motion_sensor_motion',
                       'binary_sensor.bedroom_motion_sensor_motion',
                       'binary_sensor.sensor_group_motion'] -%}
        {%- for e in mot %}{% set s = states(e) %}{% if s == 'on' %}{% set ns.mact = ns.mact + 1 %}{% elif s != 'off' %}{% set ns.mquiet = ns.mquiet + 1 %}{% endif %}{% endfor -%}
        {%- if ns.mact %}{% set mv = ('%d 处有动作' % ns.mact) if cn else ('%d room active' % ns.mact if ns.mact == 1 else '%d rooms active' % ns.mact) %}
        {%- elif ns.mquiet == mot | count %}{% set mv = nd %}
        {%- else %}{% set mv = '安静' if cn else 'Quiet' %}{% endif -%}
        {%- set cams = ['camera.front_door_live_view',
                        'camera.tapo_c425_north_wall_hd_stream_direct',
                        'camera.tapo_c420_east_wall_hd_stream_direct',
                        'camera.tapo_c420_south_wall_hd_stream_direct',
                        'camera.tapo_c200_stockroom_hd_stream_direct',
                        'camera.smart_pet_feeder'] -%}
        {%- for e in cams %}{% if states(e) not in ['unavailable','unknown'] %}{% set ns.cup = ns.cup + 1 %}{% endif %}{% endfor -%}
