# CasaRay v2 — rebuilt from scratch on the frozen CasaRay Design v1.
#
# Architecture: native-first per Master Design Briefing v1 section 20.
#   Sections layout -> heading -> tile -> native domain cards -> markdown
#   for the interpretation layer. No card_mod: surface treatment belongs to
#   themes/deez_your_name.yaml. Only custom:webrtc-camera is depended on,
#   and only where a live low-latency stream has no native equivalent.
#
# Entity truth: docs/entity_inventory.md. Every ID below is already
# referenced by dashboards/deez_smart_home.yaml or was confirmed by the
# owner-supplied B1 Developer Tools entity export on 2026-09-05. Nothing is
# invented. Components with no data behind them are absent, not faked.
#
# Layout: max_columns 2 throughout. iPad landscape renders ~2 usable
# columns whatever the mockups show.
#
# Comments survive in this repository. If this file is ever imported into a
# storage-mode dashboard it round-trips through a YAML dumper and they are
# stripped; the rationale is duplicated in the architecture document.

kiosk_mode:
  hide_sidebar: true
  hide_header: true
  ignore_per_user: false
theme: Deez Smart Home

views:

# ===========================================================================
# HOME -- executive overview. Status before controls, exceptions before
# status. Briefing section 4: answer "is the house okay" in seconds.
# ===========================================================================
- type: sections
  title: CasaRay
  path: home
  icon: mdi:home-heart
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 8, rows: 2}
      content: >-
        {% set h = now().hour %} {% set cn =
        is_state('input_boolean.chinese_dashboard','on') %} {% if h < 12 %}{%
        set g = '早安' if cn else 'Good morning' %}{% elif h < 18 %}{% set g =
        '午安' if cn else 'Good afternoon' %}{% else %}{% set g = '晚安' if cn
        else 'Good evening' %}{% endif %}

        # {{ g }}

        {{ 'CasaRay 家庭控制中心' if cn else 'CasaRay household control centre' }}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Bills
      icon: mdi:file-document-outline
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Entertainment
      icon: mdi:television-play
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/entertainment}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Automations
      icon: mdi:robot
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/automations}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Alerts
      icon: mdi:bell-alert
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/alerts}
    - type: button
      grid_options: {columns: 3, rows: 1}
      name: Health
      icon: mdi:heart-pulse
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}

  # --- Attention. Conditional throughout: a healthy house shows nothing. ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Needs attention
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 需要注意
      heading_style: title
      icon: mdi:alert-circle-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set
        doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] -%} {% set bats =
        ['sensor.front_door_battery', 'sensor.living_room_ringring_battery',
        'sensor.tapo_c425_north_wall_battery',
        'sensor.tapo_camera_bcca_battery',
        'sensor.tapo_c420_south_wall_battery',
        'sensor.aqara_roller_shade_driver_e1_battery'] -%} {% set cams =
        ['camera.front_door_live_view',
        'camera.tapo_c425_north_wall_hd_stream_direct',
        'camera.tapo_c420_east_wall_hd_stream_direct',
        'camera.tapo_c420_south_wall_hd_stream_direct',
        'camera.tapo_c200_stockroom_hd_stream_direct',
        'camera.smart_pet_feeder'] -%} {% set ns = namespace(dopen=0, dunk=0,
        blow=0, bunk=0, coff=0) -%} {% for d in doors %}{% set s = states(d) %}{%
        if s == 'on' %}{% set ns.dopen = ns.dopen + 1 %}{% elif s != 'off' %}{%
        set ns.dunk = ns.dunk + 1 %}{% endif %}{% endfor -%} {% for b in bats %}{%
        set s = states(b) %}{% if s in ['unavailable','unknown','none',''] %}{%
        set ns.bunk = ns.bunk + 1 %}{% else %}{% set f = s | float(-1) %}{% if f
        < 0 %}{% set ns.bunk = ns.bunk + 1 %}{% elif f < 30 %}{% set ns.blow =
        ns.blow + 1 %}{% endif %}{% endif %}{% endfor -%} {% for c in cams %}{% if
        states(c) in ['unavailable','unknown'] %}{% set ns.coff = ns.coff + 1
        %}{% endif %}{% endfor -%} {% set total = ns.dopen + ns.blow + ns.coff -%}
        {% if total == 0 and ns.dunk == 0 and ns.bunk == 0 %}{{ '一切正常。' if
        cn else 'All clear. Nothing needs attention.' }}{% else %}{% if ns.dopen
        %}- **{{ ns.dopen }}** {{ '扇门开启' if cn else ('door open' if ns.dopen
        == 1 else 'doors open') }}

        {% endif %}{% if ns.blow %}- **{{ ns.blow }}** {{ '个电池低于 30%' if cn
        else 'batteries under 30%' }}

        {% endif %}{% if ns.coff %}- **{{ ns.coff }}** {{ '个摄像头离线' if cn
        else ('camera offline' if ns.coff == 1 else 'cameras offline') }}

        {% endif %}{% if ns.dunk %}- {{ ns.dunk }} {{ '扇门传感器离线' if cn else
        'door sensors not reporting' }}

        {% endif %}{% if ns.bunk %}- {{ ns.bunk }} {{ '个电池无数据' if cn else
        'batteries not reporting' }}

        {% endif %}{% endif %}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.f_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.f_contact_sensor_door
        name: Front door open
        icon: mdi:door-open
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.b_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.b_contact_sensor_door
        name: Backyard door open
        icon: mdi:door-open
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.m_contact_sensor_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.m_contact_sensor_door
        name: Parents Room door open
        icon: mdi:door-open
        color: orange
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.front_door_battery
        below: 30
      card:
        type: tile
        entity: sensor.front_door_battery
        name: Front Door battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.living_room_ringring_battery
        below: 30
      card:
        type: tile
        entity: sensor.living_room_ringring_battery
        name: RingRing battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.tapo_c425_north_wall_battery
        below: 30
      card:
        type: tile
        entity: sensor.tapo_c425_north_wall_battery
        name: North Wall camera battery low
        icon: mdi:battery-alert-variant-outline
        color: orange
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.eero_wan_status
        state_not: 'on'
      card:
        type: tile
        entity: binary_sensor.eero_wan_status
        name: Internet
        icon: mdi:wan
        color: red
        tap_action: {action: navigate, navigation_path: /casaray-v2/house-health}
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.g_monitor_freezer_p110m_overloaded
        name: Garage freezer circuit overloaded
        icon: mdi:flash-alert
        color: red
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required
        name: Parents Room AC filter needs cleaning
        icon: mdi:air-filter
        color: orange
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.lg_fridge_door
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.lg_fridge_door
        name: Fridge door open
        icon: mdi:fridge-alert-outline
        color: orange

  # --- Household: who is in, and is the house secure. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Household
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 家庭
      heading_style: title
      icon: mdi:account-group
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: zone.home
      name: People home
      icon: mdi:home-account
      tap_action: {action: navigate, navigation_path: /casaray-v2/people}
    - type: tile
      entity: person.raymond_du
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: person.vinh_du
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: person.ai_q_huang
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.eero_wan_status
      name: Internet
      icon: mdi:wan

  # --- Security roll-up. No alarm row: no alarm_control_panel exists. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Security
      heading_style: title
      icon: mdi:shield-home
      badges:
      - type: entity
        entity: binary_sensor.f_contact_sensor_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 安全
      heading_style: title
      icon: mdi:shield-home
      badges:
      - type: entity
        entity: binary_sensor.f_contact_sensor_door
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set
        doors = ['binary_sensor.f_contact_sensor_door',
        'binary_sensor.m_contact_sensor_door',
        'binary_sensor.b_contact_sensor_door'] -%} {% set ns =
        namespace(open=0, unk=0) -%} {% for d in doors %}{% set s = states(d) %}{%
        if s == 'on' %}{% set ns.open = ns.open + 1 %}{% elif s != 'off' %}{% set
        ns.unk = ns.unk + 1 %}{% endif %}{% endfor -%} {% if ns.unk %}{{
        '门窗传感器有 %d 个无数据。' % ns.unk if cn else '%d of 3 door sensors
        are not reporting. Security state cannot be confirmed.' % ns.unk }}{%
        elif ns.open %}{{ '%d 扇门开启。' % ns.open if cn else '%d of 3 doors
        open.' % ns.open }}{% else %}{{ '三扇门全部关闭。' if cn else 'All 3
        doors closed.' }}{% endif %}
    - type: tile
      entity: binary_sensor.f_contact_sensor_door
      name: Front door
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.m_contact_sensor_door
      name: Parents Room
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: binary_sensor.b_contact_sensor_door
      name: Backyard
      grid_options: {columns: 4, rows: 1}

  # --- Energy now. The inverter is offline right now; guard every read. ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Energy now
      heading_style: title
      icon: mdi:lightning-bolt
      badges:
      - type: entity
        entity: sensor.powerpal_gateway_powerpal_power
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 当前能耗
      heading_style: title
      icon: mdi:lightning-bolt
      badges:
      - type: entity
        entity: sensor.powerpal_gateway_powerpal_power
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') -%} {% set p
        = states('sensor.powerpal_gateway_powerpal_power') -%} {% set s =
        states('sensor.primo_5_0_1_1_ac_power') -%} {% set pk = p not in
        ['unavailable','unknown','none',''] and p | float(-1) >= 0 -%} {% set sk =
        s not in ['unavailable','unknown','none',''] and s | float(-1) >= 0 -%} {%
        if pk %}{{ '目前用电 %s W。' % p if cn else 'Drawing **%s W** right
        now.' % p }}{% else %}{{ '用电量无数据。' if cn else 'House power is not
        reporting.' }}{% endif %} {% if sk %}{{ ' 太阳能发电 %s W。' % s if cn
        else ' Solar generating **%s W**.' % s }}{% else %}{{ '
        太阳能逆变器离线。' if cn else ' The solar inverter is offline, so
        generation is unknown.' }}{% endif %}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_power
      name: House power
      icon: mdi:transmission-tower
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.powerpal_gateway_powerpal_daily_energy
      name: Used today
      icon: mdi:counter
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.primo_5_0_1_1_ac_power
      name: Solar now
      icon: mdi:solar-power-variant
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: tile
      entity: sensor.primo_5_0_1_1_energy_day
      name: Solar today
      icon: mdi:weather-sunny
      grid_options: {columns: 6, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}

  # --- Rooms. P5: one line of state per room, tap to open. ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Rooms
      heading_style: title
      icon: mdi:floor-plan
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 房间
      heading_style: title
      icon: mdi:floor-plan
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Living Room
      icon: mdi:sofa
      entity: light.living_room
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/living-room}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Kitchen
      icon: mdi:silverware-fork-knife
      entity: binary_sensor.k_motion_sensor_motion
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/kitchen}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Dining
      icon: mdi:table-chair
      entity: light.dining
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/dining}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Parents Room
      icon: mdi:bed-king
      entity: climate.bedroom_parents_room_ac
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/parents-room}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Ray Bedroom
      icon: mdi:bed
      entity: light.bedroom_bedroom
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/ray-bedroom}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Garage
      icon: mdi:garage
      entity: switch.g_monitor_freezer_p110m
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/garage}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Guest Room
      icon: mdi:bed-empty
      entity: switch.g_printer_p100
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/guest-room}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Lighting
      icon: mdi:lightbulb-group
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/lighting}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Climate
      icon: mdi:thermometer
      entity: sensor.bedroom_motion_sensor_temperature
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}

  # --- Indoor climate at a glance. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Indoor climate
      heading_style: title
      icon: mdi:home-thermometer
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 室内气候
      heading_style: title
      icon: mdi:home-thermometer
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: sensor.living_room_living_hue_hue_sensor_temperature
      name: Living Room
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.bedroom_motion_sensor_temperature
      name: Parents Room
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.bedroom_motion_sensor_humidity
      name: Humidity
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_living_hue_hue_sensor_illuminance
      name: Light level
      grid_options: {columns: 6, rows: 1}

  # --- Cameras preview. ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Cameras
      heading_style: title
      icon: mdi:cctv
      badges:
      - type: entity
        entity: camera.front_door_live_view
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 摄像头
      heading_style: title
      icon: mdi:cctv
      badges:
      - type: entity
        entity: camera.front_door_live_view
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: picture-entity
      entity: camera.front_door_live_view
      name: Front Door
      camera_view: auto
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/camera-front-door}
    - type: button
      name: All cameras
      icon: mdi:cctv
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}

  # --- Footer: weather and the next bill. ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Outside
      heading_style: subtitle
      icon: mdi:weather-partly-cloudy
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 室外
      heading_style: subtitle
      icon: mdi:weather-partly-cloudy
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_current: true
      show_forecast: true
      grid_options: {columns: 8, rows: 3}
    # Daylight, beside the forecast it belongs with. Dedicated sensors rather
    # than sun.sun attributes, so each is a plain tile with no templating.
    - type: tile
      entity: sun.sun
      name: Sun
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.sun_next_rising
      name: Sunrise
      icon: mdi:weather-sunset-up
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.sun_next_setting
      name: Sunset
      icon: mdi:weather-sunset-down
      grid_options: {columns: 4, rows: 1}
    - type: tile
      entity: sensor.bills_outstanding_total
      name: Outstanding bills
      icon: mdi:cash-multiple
      grid_options: {columns: 4, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
    - type: tile
      entity: sensor.bills_unpaid_count
      name: Unpaid
      icon: mdi:file-alert-outline
      grid_options: {columns: 4, rows: 1}
      tap_action: {action: navigate, navigation_path: /casaray-v2/bills}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Language
      icon: mdi:translate
      entity: input_boolean.chinese_dashboard
      show_state: true
      tap_action: {action: toggle}

# ===========================================================================
# ROOMS -- index. The parent that every room's Back button returns to.
# Lovelace has no native browser-back action, so Back is the logical parent.
# ===========================================================================
- type: sections
  title: Rooms
  path: rooms
  icon: mdi:floor-plan
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '房间' if is_state('input_boolean.chinese_dashboard','on') else
        'Rooms' }}

        {{ '选择一个房间' if is_state('input_boolean.chinese_dashboard','on')
        else 'Choose a room' }}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Living Room
      icon: mdi:sofa
      entity: light.living_room
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/living-room}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Kitchen
      icon: mdi:silverware-fork-knife
      entity: binary_sensor.k_motion_sensor_motion
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/kitchen}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Dining
      icon: mdi:table-chair
      entity: light.dining
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/dining}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Parents Room
      icon: mdi:bed-king
      entity: climate.bedroom_parents_room_ac
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/parents-room}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Ray Bedroom
      icon: mdi:bed
      entity: light.bedroom_bedroom
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/ray-bedroom}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Garage
      icon: mdi:garage
      entity: switch.g_monitor_freezer_p110m
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/garage}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Guest Room
      icon: mdi:bed-empty
      entity: switch.g_printer_p100
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/guest-room}
    - type: button
      grid_options: {columns: 6, rows: 2}
      name: Backyard
      icon: mdi:tree
      entity: binary_sensor.b_contact_sensor_door
      show_state: true
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}

# ===========================================================================
# LIVING ROOM. Media, lighting and the front door live here.
# The four Hue ambiance spots are retained and will read unavailable while
# the bridge is down -- the cards are correct, the bridge is not answering.
# ===========================================================================
- type: sections
  title: Living Room
  path: living-room
  icon: mdi:sofa
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Back
      icon: mdi:arrow-left
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '客厅' if is_state('input_boolean.chinese_dashboard','on') else
        'Living Room' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set t =
        states('sensor.living_room_living_hue_hue_sensor_temperature') %}{% set m =
        states('binary_sensor.living_room_living_hue_hue_sensor_motion') %}{% if t not
        in ['unavailable','unknown','none',''] %}{{ t }} °C{% else %}{{ '温度无数据' if
        cn else 'Temperature not reporting' }}{% endif %}{% if m == 'on' %}{{ ' · 有人'
        if cn else ' · occupied' }}{% elif m == 'off' %}{{ ' · 无人' if cn else ' · no
        motion' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}


  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Quick actions
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 快捷场景
      heading_style: title
      icon: mdi:palette-outline
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Relax
      icon: mdi:sofa-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_relax}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Bright
      icon: mdi:brightness-7
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_bright}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Read
      icon: mdi:book-open-page-variant
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_read}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Nightlight
      icon: mdi:weather-night
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_nightlight}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Energize
      icon: mdi:lightning-bolt
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_energize}
    - type: button
      grid_options: {columns: 4, rows: 1}
      name: Concentrate
      icon: mdi:head-lightbulb-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target: {entity_id: scene.living_room_living_room_concentrate}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Lights
      heading_style: title
      icon: mdi:lightbulb
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 灯光
      heading_style: title
      icon: mdi:lightbulb
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: light.living_room
      name: Living Room
      features:
      - type: light-brightness
    - type: tile
      entity: light.living_room_hue_ambiance_spot_1
      name: Hue spot 1
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_2
      name: Hue spot 2
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_3
      name: Hue spot 3
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: light.living_room_hue_ambiance_spot_4
      name: Hue spot 4
      grid_options: {columns: 6, rows: 1}
    - type: markdown
      content: >-
        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set spots =
        ['light.living_room_hue_ambiance_spot_1',
        'light.living_room_hue_ambiance_spot_2',
        'light.living_room_hue_ambiance_spot_3',
        'light.living_room_hue_ambiance_spot_4'] %} {% set ns =
        namespace(down=0) %} {% for s in spots %}{% if states(s) in
        ['unavailable','unknown'] %}{% set ns.down = ns.down + 1 %}{% endif %}{%
        endfor %} {% if ns.down == 4 %}{{ '四盏 Hue 射灯全部离线。Hue
        桥接器无响应，这是桥接器故障，不是面板问题。' if cn else 'All four Hue spots are
        unavailable. The Hue bridge is not answering — this is a bridge fault, not a
        dashboard one.' }}{% elif ns.down %}{% if cn %}{{ ns.down }} 盏 Hue 射灯离线（共
        4 盏）。{% else %}{{ ns.down }} of 4 Hue spots unavailable.{% endif %}{% endif %}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Power board
      heading_style: title
      icon: mdi:power-socket-au
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 排插
      heading_style: title
      icon: mdi:power-socket-au
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: switch.genio_power_board_with_usb_livingroom_socket_1
      name: Socket 1
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: switch.genio_power_board_with_usb_livingroom_socket_2
      name: Socket 2
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: switch.genio_power_board_with_usb_livingroom_socket_3
      name: Socket 3
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: switch.genio_power_board_with_usb_livingroom_socket_4
      name: Socket 4
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: switch.genio_power_board_with_usb_livingroom_socket_5
      name: Socket 5
      grid_options: {columns: 6, rows: 1}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Entertainment
      heading_style: title
      icon: mdi:television
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 娱乐
      heading_style: title
      icon: mdi:television
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: media-control
      entity: media_player.living_room_tv_samsung_q9_series_65


  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Air quality
      heading_style: title
      icon: mdi:air-purifier
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 空气质量
      heading_style: title
      icon: mdi:air-purifier
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: fan.living_room_air_purifier
      name: Air purifier
      features:
      - type: fan-speed
    - type: tile
      entity: sensor.living_room_air_purifier_air_quality
      name: Air quality
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_air_purifier_pm2_5
      name: PM2.5
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_air_purifier_pm10
      name: PM10
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_air_purifier_odor_sensor
      name: Odor
      grid_options: {columns: 6, rows: 1}

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Sensors
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 传感器
      heading_style: title
      icon: mdi:motion-sensor
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: tile
      entity: binary_sensor.living_room_living_hue_hue_sensor_motion
      name: Motion
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_living_hue_hue_sensor_temperature
      name: Temperature
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_living_hue_hue_sensor_illuminance
      name: Light level
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: binary_sensor.f_contact_sensor_door
      name: Front door
      grid_options: {columns: 6, rows: 1}
    - type: history-graph
      hours_to_show: 12
      entities:
      - entity: sensor.living_room_living_hue_hue_sensor_temperature
        name: Temperature
      - entity: sensor.living_room_living_hue_hue_sensor_illuminance
        name: Light

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Front door camera
      heading_style: title
      icon: mdi:doorbell-video
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 前门摄像头
      heading_style: title
      icon: mdi:doorbell-video
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
    - type: picture-entity
      entity: camera.front_door_live_view
      name: Front Door
      camera_view: auto
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/camera-front-door}
    - type: tile
      entity: sensor.front_door_battery
      name: Doorbell battery
      grid_options: {columns: 6, rows: 1}
    - type: tile
      entity: sensor.living_room_ringring_battery
      name: RingRing battery
      grid_options: {columns: 6, rows: 1}

# ===========================================================================
# KITCHEN. Appliances and cooking-oriented controls (briefing section 5).
# ===========================================================================
- type: sections
  title: Kitchen
  path: kitchen
  icon: mdi:silverware-fork-knife
  max_columns: 2
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Back
      icon: mdi:arrow-left
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: markdown
      grid_options: {columns: 6, rows: 2}
      content: >-
        # {{ '厨房' if is_state('input_boolean.chinese_dashboard','on') else
        'Kitchen' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set m =
        states('binary_sensor.k_motion_sensor_motion') %}{% if m == 'on' %}{{ '厨房有人'
        if cn else 'Someone is in the kitchen' }}{% elif m == 'off' %}{{ '无人活动' if
        cn else 'No motion' }}{% else %}{{ '动作传感器离线' if cn else 'Motion sensor
        not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 4, rows: 2}
      content: >-
        ## {{ now().strftime('%I:%M %p').lstrip('0') }}

        {{ now().strftime('%d/%m/%y') }}

  - type: grid
    column_span: 1
    cards:
    - type: heading
