    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: remote.living_room_tv_samsung_q9_series_65
      name: Power
      icon: mdi:remote-tv
    - type: tile
      grid_options: {columns: 6, rows: 1}
      entity: sensor.living_room_samsung_q9_series_65_tv_channel_name
      name: Channel

  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Parents Room TV
      heading_style: title
      icon: mdi:television
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state_not: 'on'
    - type: heading
      heading: 父母房电视
      heading_style: title
      icon: mdi:television
      visibility:
      - condition: state
        entity: input_boolean.chinese_dashboard
        state: 'on'
