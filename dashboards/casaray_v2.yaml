# ===========================================================================
# KITCHEN. Appliances and cooking-oriented controls (briefing section 5).
# ===========================================================================
- type: sections
  title: Kitchen
  path: kitchen
  icon: mdi:silverware-fork-knife
  max_columns: 2
  # No `badges:` here. Home Assistant renders badges ABOVE the sections, so a
  # badge row lands on top of the CasaRay wordmark rather than under the page
  # title where the 14/09 room render puts its pill row (DR-011). The chip
  # strip in section 2 is that pill row, and unlike a badge it can carry a
  # computed value -- the render's own "Quiet, 22 min" is elapsed time since
  # last_changed, which no badge can show.
  sections:

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: >-
        ## {{ '厨房' if is_state('input_boolean.chinese_dashboard','on') else
        'Kitchen' }}

        {% set cn = is_state('input_boolean.chinese_dashboard','on') %}{% set m =
        states('binary_sensor.k_motion_sensor_motion') %}{% if m == 'on' %}{{ '厨房有人'
        if cn else 'Someone is in the kitchen' }}{% elif m == 'off' %}{{ '无人活动' if
        cn else 'No motion' }}{% else %}{{ '动作传感器离线' if cn else 'Motion sensor
        not reporting' }}{% endif %}
    # Time over date, right-aligned, DD/MM/YY -- never %Y. `nowrap` is a
    # guarantee where a `columns` value is only a bet (DR-012).
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        ## {{ now().strftime('%I:%M %p').lstrip('0').lower() }}
        {{ now().strftime('%d/%m/%y') }}
      card_mod:
        style: |
          ha-card { text-align: right; white-space: nowrap; }
    # The shared nav rail. Identical on every board and room page so the
    # dashboard reads as one application; the current page's icon is tinted
    # amber, which is the render's selected state.
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Home
      icon: mdi:home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/home}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Rooms
      icon: mdi:floor-plan
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/rooms}
      card_mod:
        style: |
          ha-card {
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
          }
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}


  # The chip strip, per the 14/09 room render: a pill row under the page
  # title, dim label then bright value.
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 12, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set nd = '无数据' if cn else 'No data' -%}
        {%- set o = states.binary_sensor['k_motion_sensor_motion'] -%}
        {%- set s = states('binary_sensor.k_motion_sensor_motion') -%}
        {%- if s == 'on' %}{% set V = '有动作' if cn else 'Active' %}
        {%- elif s != 'off' %}{% set V = nd %}
        {%- else %}{% set mins = ((as_timestamp(now()) - as_timestamp(o.last_changed)) / 60) | round(0) | int %}
        {%- if mins < 1 %}{% set ago = '刚刚' if cn else 'just now' %}
        {%- elif mins < 60 %}{% set ago = ('%d 分钟' % mins) if cn else ('%d min' % mins) %}
        {%- elif mins < 1440 %}{% set ago = ('%d 小时' % ((mins / 60) | round(0) | int)) if cn else ('%d h' % ((mins / 60) | round(0) | int)) %}
        {%- else %}{% set ago = ('%d 天' % ((mins / 1440) | round(0) | int)) if cn else ('%d d' % ((mins / 1440) | round(0) | int)) %}{% endif %}
        {%- set V = ('安静，' ~ ago) if cn else ('Quiet, ' ~ ago) %}{% endif -%}
        {%- set v0 = V -%}
        {%- set v = states('sensor.kitchen_electrolux_fridge_temperature') | float(none) -%}
        {%- set V = ((v | round(1)) ~ '°') if v is not none else nd -%}
        {%- set v1 = V -%}
        {%- set s = states('binary_sensor.lg_fridge_door') -%}
        {%- set V = ('打开' if cn else 'Open') if s == 'on' else (('关闭' if cn else 'Closed') if s == 'off' else nd) -%}
        {%- set v2 = V -%}
        {{ '动作' if cn else 'Movement' }} **{{ v0 }}** · {{ '冰箱' if cn else 'Fridge' }} **{{ v1 }}** · {{ '冰箱门' if cn else 'Fridge door' }} **{{ v2 }}**
      card_mod:
        style: |
          ha-card {
            border-radius: 999px;
            background: var(--casaray-surface-3);
            border-color: var(--casaray-border-strong);
          }

  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('binary_sensor.k_motion_sensor_occupancy') -%}
        {% if s == 'on' %}**{{ '有人' if cn else 'Occupied' }}** · {{ '厨房' if cn else 'kitchen' }}{% elif s == 'off' %}**{{ '无人' if cn else 'Empty' }}** · {{ '厨房' if cn else 'kitchen' }}{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '厨房无数据' if cn else 'kitchen not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set t = states('sensor.kitchen_electrolux_fridge_temperature') | float(none) -%}
        {% if t is not none %}**{{ t | round(1) }} °C** · {{ '冰箱' if cn else 'fridge' }}{% else %}**—** · {{ '冰箱无数据' if cn else 'fridge not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set s = states('binary_sensor.lg_fridge_door') -%}
        {% if s == 'on' %}**{{ '冰箱门开启' if cn else 'Fridge door open' }}**{% elif s == 'off' %}**{{ '冰箱已关闭' if cn else 'Fridge closed' }}**{% else %}**{{ '无数据' if cn else 'No reading' }}** · {{ '冰箱门无数据' if cn else 'fridge door not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: 1}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set es = ['switch.k_coffee_p100','switch.k_top_p100','switch.k_bot_p100'] -%}
        {%- set ns = namespace(on=0, unk=0) -%}
        {%- for e in es %}{% set s = states(e) %}{% if s == 'on' %}{% set ns.on = ns.on + 1 %}{% elif s != 'off' %}{% set ns.unk = ns.unk + 1 %}{% endif %}{% endfor -%}
        **{{ ns.on }}/{{ es | count }}** · {{ '插座已开启' if cn else 'plugs on' }}{% if ns.unk %} · {{ ns.unk }} {{ '无数据' if cn else 'not reporting' }}{% endif %}

