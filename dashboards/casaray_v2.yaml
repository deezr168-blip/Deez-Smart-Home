    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Security
      icon: mdi:shield-home
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/security}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Energy
      icon: mdi:lightning-bolt
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/energy}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Climate
      icon: mdi:thermometer
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/climate}
    - type: button
      grid_options: {columns: 2, rows: 1}
      name: Cameras
      icon: mdi:cctv
      show_name: false
      show_state: false
      tap_action: {action: navigate, navigation_path: /casaray-v2/cameras}
      card_mod:
        style: |
          ha-card {
            background: var(--casaray-amber-bg);
            border-color: var(--casaray-amber-border);
          }


  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set cams = [('camera.front_door_live_view','Front Door','前门'),
                        ('camera.tapo_c425_north_wall_hd_stream_direct','North Wall','北墙'),
                        ('camera.tapo_c420_east_wall_hd_stream_direct','East Wall','东墙'),
                        ('camera.tapo_c420_south_wall_hd_stream_direct','South Wall','南墙'),
                        ('camera.tapo_c200_stockroom_hd_stream_direct','Stockroom','储藏室'),
                        ('camera.smart_pet_feeder','Pet Feeder','宠物喂食器')] -%}
        {%- set ns = namespace(up=0, down=[]) -%}
        {%- for c, en, zh in cams %}{% if states(c) not in ['unavailable','unknown'] %}{% set ns.up = ns.up + 1 %}{% else %}{% set ns.down = ns.down + [zh if cn else en] %}{% endif %}{% endfor -%}
        **{{ '在线摄像头' if cn else 'Cameras online' }}**
        ## {{ ns.up }}/{{ cams | count }}
        {% if ns.down %}{{ ('离线：' ~ ns.down | join('、')) if cn else ('Offline: ' ~ ns.down | join(', ')) }}{% else %}{{ '全部在线' if cn else 'All streaming' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set bats = [('sensor.front_door_battery','Front Door','前门'),
                        ('sensor.living_room_ringring_battery','RingRing','RingRing'),
                        ('sensor.tapo_c425_north_wall_battery','North Wall','北墙'),
                        ('sensor.tapo_camera_bcca_battery','East Wall','东墙'),
                        ('sensor.tapo_c420_south_wall_battery','South Wall','南墙')] -%}
        {%- set ns = namespace(low=none, who='', n=0, dead=0) -%}
        {%- for b, en, zh in bats %}{% set v = states(b) | float(none) %}{% if v is not none %}{% set ns.n = ns.n + 1 %}{% if ns.low is none or v < ns.low %}{% set ns.low = v %}{% set ns.who = zh if cn else en %}{% endif %}{% else %}{% set ns.dead = ns.dead + 1 %}{% endif %}{% endfor -%}
        **{{ '摄像头电量' if cn else 'Camera battery' }}**
        {% if ns.low is not none %}## {{ ns.low | round(0) | int }}%
        {{ (ns.who ~ ' 电量最低') if cn else ('Lowest is ' ~ ns.who) }}{% else %}## —
        {{ '没有摄像头报告电量' if cn else 'No camera is reporting a battery level' }}{% endif %}{% if ns.dead %}

        {{ ns.dead }}{{ '/' }}{{ bats | count }} {{ '个电池无数据' if cn else 'batteries not reporting' }}{% endif %}
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {%- set la = states('sensor.front_door_last_activity') -%}
        {%- set lat = as_timestamp(la, default=none) -%}
        {%- set fb = states('sensor.front_door_battery') | float(none) -%}
        {%- set md = states('switch.front_door_motion_detection') -%}
        **{{ '门铃' if cn else 'Doorbell' }}**
        {# A future timestamp is possible (clock skew on the doorbell, or a
            sensor that reports ahead) and must not render as "-128 mins ago".
            Anything under a minute, in either direction, is "just now". -#}
        {% if lat is not none %}{% set mins = ((as_timestamp(now()) - lat) / 60) | round(0) | int %}{% if mins < 1 %}## {{ '刚刚' if cn else 'Just now' }}
        {% elif mins < 60 %}## {{ mins }} {{ '分钟前' if cn else ('min ago' if mins == 1 else 'mins ago') }}
        {% elif mins < 1440 %}## {{ (mins / 60) | round(0) | int }} {{ '小时前' if cn else 'hours ago' }}
        {% else %}## {{ (mins / 1440) | round(0) | int }} {{ '天前' if cn else 'days ago' }}
        {% endif %}{{ '前门' if cn else 'Front door' }}{% else %}## —
        {{ '尚未报告活动时间' if cn else 'No activity time reported' }}{% endif %}

        {{ '电量' if cn else 'Battery' }} **{{ (fb | round(0) | int ~ '%') if fb is not none else '—' }}** · {{ '动作侦测' if cn else 'Motion detection' }} **{{ ('开启' if cn else 'On') if md == 'on' else (('关闭' if cn else 'Off') if md == 'off' else ('无数据' if cn else 'Unknown')) }}**
    - type: markdown
      grid_options: {columns: 6, rows: auto}
      content: |
        {%- set cn = is_state('input_boolean.chinese_dashboard','on') -%}
        {#- Privacy mode blinds a camera while leaving it "online", so it is
            the one camera setting worth carrying in the strip. All five
            privacy switches are listed -- the Front Door camera has none --
            and the ones that are silent are named from live state rather
            than hardcoded. The first version of this card named South and
            East Wall in fixed text; when the Pet Feeder went offline too,
            the caption was quietly wrong and the count could not show it. -#}
        {%- set privs = [('switch.tapo_c425_north_wall_privacy','North Wall','北墙'),
                         ('switch.tapo_c200_stockroom_privacy','Stockroom','储藏室'),
                         ('switch.smart_pet_feeder_privacy_mode','Pet Feeder','宠物喂食器'),
                         ('switch.tapo_c420_south_wall_privacy','South Wall','南墙'),
                         ('switch.tapo_c420_east_wall_privacy','East Wall','东墙')] -%}
        {%- set ns = namespace(on=[], off=0, unk=[]) -%}
        {%- for p, en, zh in privs %}{% set s = states(p) %}{% if s == 'on' %}{% set ns.on = ns.on + [zh if cn else en] %}{% elif s == 'off' %}{% set ns.off = ns.off + 1 %}{% else %}{% set ns.unk = ns.unk + [zh if cn else en] %}{% endif %}{% endfor -%}
        **{{ '隐私模式' if cn else 'Privacy mode' }}**
        {% if ns.on %}## {{ '已开启' if cn else 'On' }}
        {{ ('以下摄像头已被遮蔽：' ~ ns.on | join('、')) if cn else ('Blinded: ' ~ ns.on | join(', ')) }}{% elif (ns.unk | count) == (privs | count) %}## —
        {{ '没有摄像头报告隐私模式状态' if cn else 'No camera is reporting its privacy setting' }}{% else %}## {{ '关闭' if cn else 'Off' }}
        {{ ('%d/%d 个摄像头有数据' % (ns.off, privs | count)) if cn else ('%d of %d reporting' % (ns.off, privs | count)) }}{% endif %}{% if ns.unk %}

        {{ ('无数据：' ~ ns.unk | join('、')) if cn else ('No reading: ' ~ ns.unk | join(', ')) }}{% endif %}

