# CasaRay V3 — build manifest.  DEVELOPMENT ONLY — NOT DEPLOYED.
#
# scripts/v3/build_dashboard.py reads this file and nothing else decides what
# the generated dashboards contain. Edit sources here, never the generated
# dashboards/casaray_v3.yaml or dashboards/casaray_v3/dist/*.yaml.

# The V2 recovery baseline. The build refuses to run if this file's SHA-256
# differs, so V3 can never silently drift away from the pinned baseline.
baseline:
  file: dashboards/casaray_v2.yaml
  sha256: 77a4991626d6f8afcd9b78f235c34417d84d9f36c129549a386d8a66c324226c
  url_base: casaray-v2
  ref: ha-deploy@18a4e5d

# Entity authority (exists / what it is called). Availability in it is a
# 05/09/26 snapshot and is reported, never trusted as today's state.
entity_authority: docs/live/states_export_2026-09-05.txt

# Build-time localisation: one generated dashboard per locale, each with its
# own url_path, so no new runtime helper is needed (helpers are out of scope).
# A missing string falls back along `fallback`, then to English; every
# fallback is listed in the build report.
locales:
  - code: en
    name: English
    url_base: casaray-v3
    output: dashboards/casaray_v3.yaml
    fallback: []
  - code: yue
    name: 廣東話 (Cantonese, Traditional script)
    url_base: casaray-v3-yue
    output: dashboards/casaray_v3/dist/casaray_v3_yue.yaml
    fallback: [en]
  - code: km
    name: ភាសាខ្មែរ (Khmer)
    url_base: casaray-v3-km
    output: dashboards/casaray_v3/dist/casaray_v3_km.yaml
    fallback: [en]
  - code: zh-Hans
    name: 简体中文 (V2 vocabulary, kept for parity)
    url_base: casaray-v3-zh
    output: dashboards/casaray_v3/dist/casaray_v3_zh-hans.yaml
    fallback: [en]

theme: CasaRay V3          # src/casaray_v3/themes/casaray_v3.yaml
classic_theme: CasaRay     # themes/deez_your_name.yaml, what V2 views need

# V3-native views, rebuilt from sources in src/casaray_v3/views/.
# Each replaces the V2 view with the same path (so every carried link still
# lands) and the original V2 view is kept as a `v2-<path>` classic subview.
native:
  - home
  - lighting
  - climate
  - cameras
  - energy
  - security
  - network
  - ray-bedroom
  - guest-room

# Switches a V3-native view may control. V3-native views are read-only for
# switches by default; each switch below is a device control that V2 already
# offers on the named view (a tile whose icon toggles it), carried over with
# V2's exact tile behaviour. The gate refuses a switch control that is not
# listed here, a listed one with no such V2 tile, and any switch in a
# protected class (camera privacy / detection / alerts / chime / alarm, sirens,
# bulb-power wall switches), whatever this list says.
controls:
  switch.r_energy_monitor_p110m: {v2_view: ray-bedroom, note: desk plug}
  switch.r_energy_monitor_p110m_led: {v2_view: ray-bedroom, note: desk plug's LED}
  switch.r_energy_monitor_p110m_auto_off_enabled: {v2_view: ray-bedroom, note: desk plug's auto-off}
  switch.lph_se_dcd9_power: {v2_view: ray-bedroom, note: grow unit power}
  switch.lph_se_dcd9_pump_cycling: {v2_view: ray-bedroom, note: grow unit pump cycling}
  switch.g_printer_p100: {v2_view: guest-room, note: printer smart plug}
  switch.g_printer_p100_led: {v2_view: guest-room, note: printer plug's LED}
  switch.g_printer_p100_auto_off_enabled: {v2_view: guest-room, note: printer plug's auto-off}
  switch.g_printer_p100_auto_update_enabled: {v2_view: guest-room, note: printer plug's firmware auto-update}

# Every other V2 view is carried verbatim (links rewritten to the locale's
# url_base) until it is rebuilt. Order follows V2.

# Where each V2 entity of a rebuilt view lives now, when it is not on that
# view's native rebuild. The build verifies every row against the generated
# dashboard and refuses to run when one is false, so this list cannot drift
# into a claim:
#   native   on the named V3-native view
#   carried  on the named carried V2 board (still V2 rendering until rebuilt)
#   retained deliberately only on the classic v2-<path> subview  (needs reason)
#   blocked  cannot be placed yet                                 (needs reason)
# An entity left out while missing from its native rebuild fails the build.
migration:
  home:
    binary_sensor.bedroom_parents_room_ac_room_occupied:
      {to: climate, status: native, note: Parents' room occupancy beside the air-con it serves}
    binary_sensor.g_printer_p100_cloud_connection:
      {to: network, status: native, note: "printer plug's cloud link, in device connectivity"}
    binary_sensor.k_motion_sensor_motion:
      {to: security, status: native, note: kitchen motion}
    binary_sensor.living_room_living_hue_hue_sensor_motion:
      {to: security, status: native, note: living-room motion}
    binary_sensor.sensor_group_motion:
      {to: security, status: native, note: dining motion (sensor group)}
    cover.aqara_roller_shade_driver_e1:
      {to: ray-bedroom, status: native, note: "roller shade, V2's open/close and position features"}
    sensor.bills_unpaid_count:
      {to: home, status: native, note: "Needs attention; a zero counts only while the six paid flags answer"}
    sensor.casa_monitored_power:
      {to: energy, status: native, note: monitored-circuit total beside its two circuits (V3-007)}
    sensor.casa_solar_expected_today:
      {to: energy, status: native, note: solar forecast group}
    sensor.g_monitor_freezer_p110m_current_consumption:
      {to: energy, status: native, note: monitored circuits (no Appliances board exists)}
    sensor.living_room_living_room_temperature:
      {to: climate, status: native, note: "dining temperature (export: Dining Room Motion Sensor Temperature)"}
    sensor.living_room_ringring_battery:
      {to: cameras, status: native, note: doorbell battery; also on House health}
    sensor.r_energy_monitor_p110m_current_consumption:
      {to: energy, status: native, note: monitored circuits}
    sensor.tapo_camera_bcca_battery:
      {to: cameras, status: native, note: east-wall camera battery; also on House health}
    switch.g_printer_p100:
      {to: guest-room, status: native, note: "printer plug, V2 tile behaviour (manifest controls)"}
    switch.mainroomlight_switch_1:
      {to: lighting, status: native, note: "bulb-power switch, read-only (owner rule on bulb power)"}
  cameras:
    light.tapo_c200_stockroom_floodlight_timed:
      {to: lighting, status: native, note: camera floodlight}
    light.tapo_c425_north_wall_floodlight_timed:
      {to: lighting, status: native, note: camera floodlight}
