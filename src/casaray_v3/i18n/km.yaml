# CasaRay V3 strings — Khmer (ភាសាខ្មែរ).
# STATUS: draft by Claude, NOT native-reviewed. Khmer machine drafting is
# unreliable for nuance; every string needs review by a Khmer reader before
# any deployment. Missing keys fall back to English (build report lists them).
# Khmer has no spaces between words and needs extra line height — the V3
# theme sets that; no V3 card fixes a text width.
