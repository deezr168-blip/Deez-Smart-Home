hh.updates_note: "Home Assistant's own updates are read-only here: an install restarts the house system, so it is done from the classic view (tap one to go there). The count covers the four update entities listed."
hh.wiring_notes: "- **Brightness average**: only the three Hue groups dim. The wall switches are on/off only and are left out of any average.\n- **Living-room spots**: the four spots are separate entities from the living-room group. The group being on does not mean the spots are online.\n- **Floodlights**: each floodlight belongs to a camera. When a camera goes offline its floodlight stops reporting with it.\n- **Room sensors**: Ray's room, the garage and the guest room have no temperature or movement sensor on these boards, which is why Room conditions shows no reading for them."
