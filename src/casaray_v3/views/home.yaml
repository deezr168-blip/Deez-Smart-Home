# V3 Home — glance + immediate action (V3-005: D base, C hierarchy; V3-007:
# shorter Home, air-con is navigation). Two columns, horizontal bands.
# Band order follows the V2 mobile-render reorder (CVA-004): the controls you
# touch sit directly under Needs attention.
#
# V3-013 (14/11/26): composed against the 14/09 wall render
# (docs/mockups/2026-09-14_wall_home.png = "CasaRay Wall Panel.pdf", page 1),
# its three columns folded into two (DR-013). band_grid: 24 — Home Assistant
# lays a two-column band out on 24 units on the wall iPad and 12 on a phone
# (scripts/v3/ha_layout.py), so in every `span: 2` band below, `full` is the
# whole band, 6 is a quarter, 12 is half. The gate checks each band packs
# into whole rows on both.
path: home
title: nav.home
icon: mdi:home-variant-outline
band_grid: 24
sections:
  # BAND 1 — header (title, time above DD/MM/YY) and the six named rail buttons
  # (shared chrome, components.topbar; V3-023)
  - topbar: true

  # BAND 2 — the render's four pills: Outside, Inside, Home, Monitored.
  # What answered, never the list length; the two-plug total only while both
  # plugs it adds up answer.
  - span: 2
    cards:
      - c: chips
        columns: full
        parts:
          - {c: chip_temp, label_key: chip.outside, entity: weather.forecast_home, attr: temperature, digits: 0}
          - {c: chip_temp, label_key: chip.inside, entity: sensor.living_room_living_hue_hue_sensor_temperature, digits: 1}
          - c: chip_count
            label_key: chip.people
            entities: [person.raymond_du, person.vinh_du, person.ai_q_huang]
            on_states: [home]
          - c: chip_plugs
            label_key: chip.monitored_plugs
            total: sensor.casa_monitored_power
            plugs: [sensor.g_monitor_freezer_p110m_current_consumption, sensor.r_energy_monitor_p110m_current_consumption]

  # BAND 3 — needs attention (one honest list, not twelve conditionals)
  - span: 2
    heading: h.attention
    cards:
      - c: attention
        columns: full
        checks:
          - {entity: binary_sensor.eero_wan_status, when: ["off"], key: att.wan_down}
          - {entity: binary_sensor.g_monitor_freezer_p110m_overloaded, when: ["on"], key: att.freezer_overload}
          - {entity: binary_sensor.lg_fridge_door, when: ["on"], key: att.fridge_open}
          - {entity: binary_sensor.bedroom_parents_room_ac_filter_clean_required, when: ["on"], key: att.filter}
          - {entity: binary_sensor.f_contact_sensor_door, when: ["on"], key: att.door_open, name_key: room.front_door}
          - {entity: binary_sensor.m_contact_sensor_door, when: ["on"], key: att.door_open, name_key: room.parents}
          - {entity: binary_sensor.b_contact_sensor_door, when: ["on"], key: att.door_open, name_key: room.backyard}
          - {entity: camera.front_door_live_view, when: offline, key: att.camera_offline, name_key: room.front_door}
          - {entity: camera.tapo_c425_north_wall_hd_stream_direct, when: offline, key: att.camera_offline, name_key: room.north_wall}
          - {entity: camera.tapo_c420_east_wall_hd_stream_direct, when: offline, key: att.camera_offline, name_key: room.east_wall}
          - {entity: camera.tapo_c420_south_wall_hd_stream_direct, when: offline, key: att.camera_offline, name_key: room.south_wall}
          - {entity: camera.tapo_c200_stockroom_hd_stream_direct, when: offline, key: att.camera_offline, name_key: room.stockroom}
          - {entity: sensor.front_door_battery, when: "battery<20", key: att.battery_low, name_key: room.front_door}
          - {entity: sensor.tapo_c425_north_wall_battery, when: "battery<20", key: att.battery_low, name_key: room.north_wall}
          - {entity: sensor.tapo_c420_south_wall_battery, when: "battery<20", key: att.battery_low, name_key: room.south_wall}
          # The shade is in Ray's room (export area "Ray Bedroom"), not the living room.
          - {entity: sensor.aqara_roller_shade_driver_e1_battery, when: "battery<20", key: att.battery_low, name_key: room.ray}
          # Unpaid bills, as V2 Home raised them (CR-243). The summary sensor's
          # definition lives on the instance, not in git, so a zero only counts
          # as an answer while the six paid flags it summarises answer too.
          - entity: sensor.bills_unpaid_count
            when: count>0
            key: att.bills_unpaid
            requires: [input_boolean.elec_bill_paid, input_boolean.gas_bill_paid, input_boolean.water_bill_paid,
                       input_boolean.council_rate_paid, input_boolean.rego_paid, input_boolean.car_insurance_paid]

  # BAND 4 — one tap: three whole-house lighting actions + air-con NAVIGATION.
  # Four across on the wall (4 x 6 = 24), two by two on a phone.
  - span: 2
    heading: h.one_tap
    cards:
      - c: action_button
        label_key: act.evening
        icon: mdi:weather-sunset
        action: light.turn_on
        target: light.living_room
        data: {brightness_pct: 55}
        columns: 6
      - c: action_button
        label_key: act.night
        icon: mdi:weather-night
        action: light.turn_on
        target: [light.living_room, light.bedroom_bedroom, light.dining]
        data: {brightness_pct: 10}
        columns: 6
      - c: action_button
        label_key: act.all_off
        icon: mdi:lightbulb-group-off-outline
        action: light.turn_off
        target: [light.living_room, light.dining, light.bedroom_bedroom]
        columns: 6
      # V3-023: names WHICH air-con (it read only "Current: Cool") and fits a
      # button's slot in every locale: the name, then mode and room temperature.
      - {c: ac_summary, entity: climate.bedroom_parents_room_ac, nav: climate, columns: 6, rows: 2,
         name_key: ac.parents_name, compact: true}

  # BAND 5 — rooms | shopping list. Each room says what its sensors say, as
  # the render's room rows and V2 Home's room cards do; a tap opens the room.
  - span: 1
    heading: h.rooms
    cards:
      - c: room_tile
        name_key: room.living
        target: living-room
        parts:
          - {entity: light.living_room, words: {"on": rs.lights_on, "off": rs.lights_off}}
          - {entity: sensor.living_room_living_hue_hue_sensor_temperature, deg: 1}
          - {entity: binary_sensor.living_room_living_hue_hue_sensor_motion, words: {"on": rc.movement_word, "off": rc.quiet_word}}
      - c: room_tile
        name_key: room.dining
        target: dining
        parts:
          - {entity: light.dining, words: {"on": rs.lights_on, "off": rs.lights_off}}
          # export: "Dining Room Motion Sensor Temperature", area Dining
          - {entity: sensor.living_room_living_room_temperature, deg: 1}
          - {entity: binary_sensor.sensor_group_motion, words: {"on": rc.movement_word, "off": rc.quiet_word}}
      - c: room_tile
        name_key: room.kitchen
        target: kitchen
        parts:
          - {entity: binary_sensor.k_motion_sensor_motion, words: {"on": rc.movement_word, "off": rc.quiet_word}}
          - {entity: binary_sensor.lg_fridge_door, words: {"on": rs.fridge_open, "off": rs.fridge_closed}}
      - c: room_tile
        name_key: room.parents
        target: parents-room
        parts:
          - {entity: binary_sensor.bedroom_parents_room_ac_room_occupied, words: {"on": rc.occupied, "off": rc.not_occupied}}
          - {entity: sensor.bedroom_motion_sensor_temperature, deg: 1}
          - {entity: climate.bedroom_parents_room_ac, ac: true}
      - c: room_tile
        name_key: room.ray
        target: ray-bedroom
        parts:
          - {entity: light.bedroom_bedroom, words: {"on": rs.lights_on, "off": rs.lights_off}}
          - entity: cover.aqara_roller_shade_driver_e1
            words: {open: rs.blind_open, closed: rs.blind_closed, opening: rs.blind_opening, closing: rs.blind_closing}
      - c: room_tile
        name_key: room.garage
        target: garage
        parts:
          - {entity: sensor.g_monitor_freezer_p110m_current_consumption, value: 0, key: rs.freezer}
          - {entity: binary_sensor.g_monitor_freezer_p110m_overloaded, words: {"on": s.overloaded, "off": s.normal}}
      - c: room_tile
        name_key: room.guest
        target: guest-room
        parts:
          - {entity: switch.g_printer_p100, words: {"on": rs.printer_on, "off": rs.printer_off}}
      - {c: room_tile, name_key: nav.all_rooms, target: rooms, parts: []}
  - span: 1
    heading: h.shopping
    cards:
      # V3-023: five rows sits level with the Rooms column in Cantonese, the
      # priority locale (a six-row list left a 43 px gap under Rooms there).
      - {c: todo, entity: todo.shopping_list, rows: 5}

  # BAND 6 — right now | who's home. The render's left column: the weather,
  # then the two monitored plugs and the solar forecast with the footnote
  # that says what "monitored" means. Its middle column: the people, then the
  # Parents' room occupancy card.
  - span: 1
    heading: h.right_now
    cards:
      - {c: weather, entity: weather.forecast_home}
      - {c: sensor_tile, entity: sensor.sun_next_rising, name: {t: weather.sunrise}}
      - {c: sensor_tile, entity: sensor.sun_next_setting, name: {t: weather.sunset}}
      - c: plugs_card
        label_key: chip.monitored_plugs
        total: sensor.casa_monitored_power
        plugs: [sensor.g_monitor_freezer_p110m_current_consumption, sensor.r_energy_monitor_p110m_current_consumption]
        detail_key: energy.plugs_which
        note_key: energy.monitored_note   # V3-023: the footnote, inside the card it qualifies
        nav: energy
  - span: 1
    heading: h.whos_home
    cards:
      # V3-023: two rows, a vertical tile's own minimum and the render's size;
      # three rows left each card about half empty.
      - {c: person_tile, entity: person.raymond_du, rows: 2}
      - {c: person_tile, entity: person.vinh_du, rows: 2}
      - {c: person_tile, entity: person.ai_q_huang, rows: 2}
      - c: sensor_tile
        entity: binary_sensor.bedroom_parents_room_ac_room_occupied
        name: {t: room.parents}
        columns: 12
        rows: 2      # V2's size; pairs Who's home with Right now's height
        state_content: [state, last_changed]

  # BAND 7 — security, full width: what each camera says beside the front
  # door's picture, then the three doors and every camera, a quarter each.
  - span: 2
    heading: h.security
    cards:
      - c: camera_summary
        columns: 12
        rows: 4      # as tall as the picture beside it, so the band has no hole
        cams:
          - {entity: camera.front_door_live_view, name_key: room.front_door}
          - {entity: camera.tapo_c425_north_wall_hd_stream_direct, name_key: room.north_wall}
          - {entity: camera.tapo_c420_east_wall_hd_stream_direct, name_key: room.east_wall}
          - {entity: camera.tapo_c420_south_wall_hd_stream_direct, name_key: room.south_wall}
          - {entity: camera.tapo_c200_stockroom_hd_stream_direct, name_key: room.stockroom}
          - {entity: camera.smart_pet_feeder, name_key: room.pet_feeder}
      - {c: camera_card, entity: camera.front_door_live_view, name_key: room.front_door, subview: camera-front-door, columns: 12}
      - {c: sensor_tile, entity: binary_sensor.f_contact_sensor_door, name: {t: room.front_door}, columns: 6, nav: security, vertical: true}
      - {c: sensor_tile, entity: binary_sensor.m_contact_sensor_door, name: {t: room.parents}, columns: 6, nav: security, vertical: true}
      - {c: sensor_tile, entity: binary_sensor.b_contact_sensor_door, name: {t: room.backyard}, columns: 6, nav: security, vertical: true}
      - {c: nav_button, label_key: act.all_cameras, icon: mdi:cctv, target: cameras, columns: 6, rows: 2}

  # BAND 8 — energy now | climate now
  - span: 1
    heading: h.energy_now
    cards:
      - {c: sensor_tile, entity: sensor.powerpal_gateway_powerpal_power, name: {t: energy.house_now}, nav: energy}
      - {c: sensor_tile, entity: sensor.powerpal_gateway_powerpal_daily_energy, name: {t: energy.used_today}, nav: energy}
      - {c: sensor_tile, entity: sensor.primo_5_0_1_1_ac_power, name: {t: energy.solar_now}, nav: energy}
      - {c: sensor_tile, entity: sensor.primo_5_0_1_1_energy_day, name: {t: energy.solar_today}, nav: energy}
      # V3-023: beside Solar now and Solar today, where it reads as the day's
      # forecast; in Right now it made that column ~100 px taller than Who's home.
      - {c: sensor_tile, entity: sensor.casa_solar_expected_today, name: {t: energy.solar_expected}, columns: 12, nav: energy}
      - {c: note, key: energy.two_circuits}
  - span: 1
    heading: h.climate_now
    cards:
      # CR-V3-20 (Home visual review): Climate now packed visibly shorter
      # than Energy now beside it (1 markdown + 2 tiles vs 4 tiles + a note)
      # — a real, measured gap in the offline preview, not a style nit;
      # CLAUDE.md's "a lone short section leaves a hole beside it" rule
      # applies between two paired sections here, not only within one. A
      # first attempt sized the tiles to columns: 4 to fit three per row —
      # validate_dashboard.py correctly failed that: the native tile card's
      # own minimum is columns: 6 (ha_layout.py element_grid), so it always
      # draws 6 wide regardless of what is asked, leaving the same hole with
      # an extra "draws larger than grid_options" failure on top. A tile
      # card only packs cleanly at 6-wide multiples of 2 or 4 within a
      # 12-unit half-band, so the fix is a 4th REAL reading, not a narrower
      # one: every room temperature sensor the house actually has, the same
      # four already used across the Rooms band above — Living, Parents',
      # Dining (sensor.living_room_living_room_temperature — exported as
      # "Dining Room Motion Sensor Temperature", area Dining) and Ray's
      # (sensor.presence_multi_sensor_fp300_temperature — exported as
      # "unavailable", Ray Bedroom device is down per docs/entity_inventory.md;
      # drawn honestly as "no data" rather than hidden, same as any other
      # offline reading). Four tiles at columns: 6 fill two full rows (two
      # 6+6 rows, no orphan), matching Energy now's own 2x2 tile grid.
      - {c: ac_summary, entity: climate.bedroom_parents_room_ac, nav: climate, name_key: ac.parents_name}
      - {c: sensor_tile, entity: sensor.living_room_living_hue_hue_sensor_temperature, name: {t: room.living}, nav: climate}
      - {c: sensor_tile, entity: sensor.bedroom_motion_sensor_temperature, name: {t: room.parents}, nav: climate}
      - {c: sensor_tile, entity: sensor.living_room_living_room_temperature, name: {t: room.dining}, nav: climate}
      - {c: sensor_tile, entity: sensor.presence_multi_sensor_fp300_temperature, name: {t: room.ray}, nav: climate}

  # BAND 9 — every board by name; six across on the wall, three on a phone
  - c: more_boards
    classic_of: home
    band24: true
    # V3-023: 4 units — six across on the wall (two rows, not three) and three
    # on a phone (four rows, not six); at 6 units each icon drew ~100 px.
    columns: 4
    items:
      - [bills, nav.bills, mdi:receipt-text-outline]
      - [people, nav.people, mdi:account-group-outline]
      - [house-health, nav.house_health, mdi:home-heart]
      - [network, nav.network, mdi:router-wireless]
      - [alerts, nav.alerts, mdi:bell-outline]
      - [entertainment, nav.entertainment, mdi:television-classic]
      - [automations, nav.automations, mdi:robot-outline]
      # CR-V3-20: this band must sum to a multiple of four — confirmed a real,
      # measured gate (section_holes against ha_layout.py's own packing
      # arithmetic), not a style note; an unpadded 9+classic=10 failed
      # validation on every locale with a genuine 24-empty-cell hole. Adding
      # only the two new pages (no V2 equivalent) landed on 10, so two more
      # real, already-existing boards are added rather than an invented
      # filler tile: `lighting` has no other Home nav target at all (One tap
      # only fires lighting scenes, never opens the Lighting board itself —
      # a genuine pre-existing gap), and `rooms` duplicates the "All rooms"
      # room_tile the way alerts.yaml's more_boards already duplicates
      # security/energy/network links that Home also reaches elsewhere —
      # an established, not invented, pattern. 11 items + classic_of = 12.
      - [lighting, nav.lighting, mdi:lightbulb-group-outline]
      - [weather, nav.weather, mdi:weather-partly-cloudy]
      - [rubbish-collection, nav.rubbish, mdi:trash-can-outline]
      - [rooms, nav.rooms, mdi:floor-plan]
