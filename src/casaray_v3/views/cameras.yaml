# V3 Cameras — every V2 camera, its state in words (online / offline / state
# unknown — never colour alone), stills via native picture-entity, and a tap
# into the carried V2 camera subview, which keeps the custom:webrtc-camera
# low-latency stream exactly as V2 has it. Privacy and detection switches are
# READ-ONLY here (approval boundary: nothing in V3 may disable a camera).
path: cameras
title: nav.cameras
icon: mdi:cctv
sections:
  - topbar: true

  - span: 2
    cards:
      - c: chips
        parts:
          - c: chip_cameras
            ents: [camera.front_door_live_view, camera.smart_pet_feeder,
                   camera.tapo_c200_stockroom_hd_stream_direct, camera.tapo_c425_north_wall_hd_stream_direct,
                   camera.tapo_c420_east_wall_hd_stream_direct, camera.tapo_c420_south_wall_hd_stream_direct]

  - span: 2
    heading: h.cameras
    cards:
      - c: camera_summary
        cams:
          - {entity: camera.front_door_live_view, name_key: room.front_door}
          - {entity: camera.tapo_c425_north_wall_hd_stream_direct, name_key: room.north_wall}
          - {entity: camera.tapo_c420_east_wall_hd_stream_direct, name_key: room.east_wall}
          - {entity: camera.tapo_c420_south_wall_hd_stream_direct, name_key: room.south_wall}
          - {entity: camera.tapo_c200_stockroom_hd_stream_direct, name_key: room.stockroom}
          - {entity: camera.smart_pet_feeder, name_key: room.pet_feeder}
      - {c: note, key: cam.alert_note}
      - {c: camera_card, entity: camera.front_door_live_view, name_key: room.front_door, subview: camera-front-door}
      - {c: camera_card, entity: camera.tapo_c425_north_wall_hd_stream_direct, name_key: room.north_wall, subview: camera-north-wall}
      - {c: camera_card, entity: camera.tapo_c420_east_wall_hd_stream_direct, name_key: room.east_wall, subview: camera-east-wall}
      - {c: camera_card, entity: camera.tapo_c420_south_wall_hd_stream_direct, name_key: room.south_wall, subview: camera-south-wall}
      - {c: camera_card, entity: camera.tapo_c200_stockroom_hd_stream_direct, name_key: room.stockroom, subview: camera-stockroom}
      - {c: camera_card, entity: camera.smart_pet_feeder, name_key: room.pet_feeder, subview: camera-pet-feeder}

  - span: 1
    heading: h.camera_batteries
    cards:
      - {c: sensor_tile, entity: sensor.front_door_battery, name: {t: room.front_door}}
      - {c: sensor_tile, entity: sensor.living_room_ringring_battery}
      - {c: sensor_tile, entity: sensor.tapo_c425_north_wall_battery, name: {t: room.north_wall}}
      - {c: sensor_tile, entity: sensor.tapo_camera_bcca_battery, name: {t: room.east_wall}}
      - {c: sensor_tile, entity: sensor.tapo_c420_south_wall_battery, name: {t: room.south_wall}}
      - {c: sensor_tile, entity: sensor.front_door_last_activity}
  - span: 1
    heading: h.camera_privacy
    cards:
      - {c: readonly_tile, entity: switch.front_door_motion_detection}
      - {c: readonly_tile, entity: switch.smart_pet_feeder_privacy_mode}
      - {c: readonly_tile, entity: switch.tapo_c200_stockroom_privacy}
      - {c: readonly_tile, entity: switch.tapo_c425_north_wall_privacy}
      - {c: readonly_tile, entity: switch.tapo_c420_east_wall_privacy}
      - {c: readonly_tile, entity: switch.tapo_c420_south_wall_privacy}
      - {c: note, key: cam.privacy_note}

  - c: more_boards
    classic_of: cameras
    items:
      - [security, nav.security, mdi:shield-home-outline]
      - [camera-front-door, room.front_door, mdi:doorbell-video]
      - [camera-north-wall, room.north_wall, mdi:cctv]
      - [camera-east-wall, room.east_wall, mdi:cctv]
      - [camera-south-wall, room.south_wall, mdi:cctv]
      - [camera-stockroom, room.stockroom, mdi:cctv]
      - [camera-pet-feeder, room.pet_feeder, mdi:paw]
