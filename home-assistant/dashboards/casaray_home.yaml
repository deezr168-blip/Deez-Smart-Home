# CasaRay-native Home Assistant dashboard
#
# Layout mirrors how CasaRay presents a home:
#   summary first -> control groups -> active rooms -> individual devices,
# with cameras and energy as first-class sections.
#
# SAFETY
#   * This defines a NEW dashboard. It never edits or replaces an existing one.
#     Install it alongside whatever you have today (see ../README.md), compare,
#     and delete it again if you do not like it. Nothing else is touched.
#   * No entity IDs are hardcoded in this file. Every card is driven by area
#     IDs, domains, or the helper sensors defined in
#     ../packages/casaray_summary.yaml. So no card here can point at an entity
#     that does not exist, and the dashboard keeps working as devices are
#     added, renamed, or removed.
#   * The two !include files under generated/ hold the only entity-specific
#     config (cameras, people, weather). They ship as safe stubs and are filled
#     in from your live registry by:  python3 scripts/ha_verify.py --write
#   * The only IDs this file itself depends on are AREA IDs. Verify them with
#     scripts/ha_verify.py before first use.
#
# Requires Home Assistant 2025.2+ (sections views, heading card, redesigned
# area card with area-controls, and the `area` view strategy).

title: Home
views:
- title: Home
  path: home
  icon: mdi:home-variant
  type: sections
  max_columns: 3
  dense_section_placement: true
  badges: !include generated/home_badges.yaml
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Everything
      heading_style: title
      icon: mdi:tune-variant
    - type: horizontal-stack
      cards:
      - type: button
        name: Lights off
        icon: mdi:lightbulb-off-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: all
      - type: button
        name: Media off
        icon: mdi:television-off
        show_state: false
        tap_action:
          action: perform-action
          perform_action: media_player.turn_off
          target:
            entity_id: all
      - type: button
        name: Fans off
        icon: mdi:fan-off
        show_state: false
        tap_action:
          action: perform-action
          perform_action: fan.turn_off
          target:
            entity_id: all
      - type: button
        name: Close covers
        icon: mdi:blinds-horizontal-closed
        show_state: false
        tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: all
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Rooms
      heading_style: title
      icon: mdi:floor-plan
      tap_action:
        action: navigate
        navigation_path: /casaray/rooms
    - type: area
      area: living_room
      display_type: compact
      alert_classes:
      - motion
      - occupancy
      - door
      - window
      - problem
      - smoke
      - gas
      - moisture
      sensor_classes:
      - temperature
      - humidity
      - illuminance
      navigation_path: /casaray/living_room
      features:
      - type: area-controls
        controls:
        - light
        - switch
        - fan
        - cover
    - type: area
