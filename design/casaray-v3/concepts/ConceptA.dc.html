<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaRay Home — concept A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600&amp;family=Noto+Sans+SC:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--page:#0e0f10;--rail:#111213;--ink:#ecebe6;--ink2:#b9b8b2;--muted:#8d8c87;--line:rgba(236,235,230,0.09);--line2:rgba(236,235,230,0.16);--accent:#c9a86a;--ok:#86b89c;--active:#d9a441;--alert:#e2745f;--off:#6f7174}
body{margin:0;background:#0e0f10;font-family:Archivo,"Noto Sans SC",system-ui,sans-serif;color:#ecebe6}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#c9a86a}a:hover{color:#e0c48d}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; display: grid; grid-template-columns: 216px minmax(0, 1fr); background: var(--page); color: var(--ink); font-variant-numeric: tabular-nums; overflow: hidden">

<nav aria-label="{{t.navLabel}}" style="display: flex; flex-direction: column; gap: 4px; padding: 36px 20px 28px 28px; background: var(--rail); border-right: 1px solid var(--line)">
<div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 28px">
<div style="font-size: 21px; font-weight: 600; letter-spacing: 0.01em">CasaRay</div>
<div style="font-size: 13px; color: var(--muted)">{{t.conceptA}}</div>
</div>
<sc-for list="{{nav}}" as="item" hint-placeholder-count="10">
<button type="button" aria-current="{{item.aria}}" style="{{item.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span>{{item.label}}</span>
</button>
</sc-for>
<div style="flex-grow: 1"></div>
<button type="button" onClick="{{toggleLang}}" aria-label="{{t.langAria}}" style="height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
<span style="{{enStyle}}">EN</span><span style="color: var(--muted)">/</span><span style="{{zhStyle}}">中文</span>
</button>
<div style="font-size: 13px; color: var(--muted); padding-top: 10px">{{t.mock}}</div>
</nav>

<main style="display: flex; flex-direction: column; gap: 28px; padding: 36px 48px 36px 48px; min-width: 0">

<header style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 116px; font-weight: 200; line-height: 0.86; letter-spacing: -0.045em">16:20</div>
<div style="font-size: 17px; color: var(--ink2)">{{t.day}} 25/09/26</div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-bottom: 2px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2M4.9 4.9l1.4 1.4M2 12h2M19.1 4.9l-1.4 1.4M15.9 10.3A4 4 0 0 0 8.1 11M17.5 20H8a5 5 0 1 1 4.3-7.5h.2a3.8 3.8 0 0 1 5 7.5z"></path></svg>
<span style="font-size: 44px; font-weight: 200; letter-spacing: -0.03em">17°</span>
</div>
<div style="font-size: 15px; color: var(--ink2)">{{t.weather}}</div>
<div style="font-size: 13px; color: var(--muted)">{{t.hilo}}</div>
</div>
</header>

<section aria-label="{{t.energyNow}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line)">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 20px 0">
<div style="font-size: 13px; color: var(--muted)">{{t.solar}}</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 38px; font-weight: 300; letter-spacing: -0.02em">1.62</span><span style="font-size: 15px; color: var(--muted)">kW</span></div>
<div style="font-size: 13px; color: var(--ink2)">{{t.today}} 14.2 kWh</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 20px 24px; border-left: 1px solid var(--line)">
<div style="font-size: 13px; color: var(--muted)">{{t.gridImport}}</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 38px; font-weight: 300; letter-spacing: -0.02em">0.38</span><span style="font-size: 15px; color: var(--muted)">kW</span></div>
<div style="font-size: 13px; color: var(--ink2)">{{t.today}} 6.1 kWh</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 20px 24px; border-left: 1px solid var(--line)">
<div style="font-size: 13px; color: var(--muted)">{{t.export}}</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 38px; font-weight: 200; color: var(--off)">—</span></div>
<div style="font-size: 13px; color: var(--off)">{{t.noSource}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px 0 20px 24px; border-left: 1px solid var(--line)">
<div style="font-size: 13px; color: var(--muted)">{{t.inside}}</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 38px; font-weight: 300; letter-spacing: -0.02em">21.4</span><span style="font-size: 15px; color: var(--muted)">°C</span></div>
<div style="font-size: 13px; color: var(--ink2)">{{t.livingRoom}}</div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px">
<section aria-label="{{t.attention}}" style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: var(--muted)">{{t.attention}}</h2>
<span style="font-size: 13px; color: var(--ink2)">3</span>
</div>
<sc-for list="{{attention}}" as="row" hint-placeholder-count="3">
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0; border: none; border-top: 1px solid var(--line); background: transparent; text-align: left">
<span style="{{row.dot}}"></span>
<span style="flex-grow: 1; font-size: 16px">{{row.title}}</span>
<span style="font-size: 13px; color: var(--muted)">{{row.meta}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</section>

<section aria-label="{{t.house}}" style="display: flex; flex-direction: column">
<div style="padding-bottom: 10px"><h2 style="margin: 0; font-size: 13px; font-weight: 500; color: var(--muted)">{{t.house}}</h2></div>
<sc-for list="{{house}}" as="row" hint-placeholder-count="4">
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0; border: none; border-top: 1px solid var(--line); background: transparent; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{row.icon}}"></path></svg>
<span style="width: 92px; font-size: 13px; color: var(--muted)">{{row.label}}</span>
<span style="flex-grow: 1; font-size: 15px">{{row.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</section>
</div>

<section aria-label="{{t.oneTap}}" style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: var(--muted)">{{t.oneTap}}</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{scenes}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.tap}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start"><span style="font-size: 14px; line-height: 1.25">{{s.label}}</span><span style="font-size: 13px; color: var(--muted)">{{s.state}}</span></span>
</button>
</sc-for>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'en', on: { purifier: true } };
  }
  icons() {
    return {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      rooms: 'M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01',
      energy: 'M13 2 4 14h7l-1 8 9-12h-7z',
      security: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
      lighting: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z',
      climate: 'M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z',
      network: 'M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01',
      health: 'M3 12h4l3-8 4 16 3-8h4',
      alerts: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',
      bills: 'M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3zM9 9h6M9 13h6',
      people: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      fan: 'M12 10c0-4 1-7 4-7s3 4-2 7M14 12c4 0 7 1 7 4s-4 3-7-2M12 14c0 4-1 7-4 7s-3-4 2-7M10 12c-4 0-7-1-7-4s4-3 7 2',
      moon: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'
    };
  }
  strings() {
    return {
      en: { navLabel: 'Main navigation', conceptA: 'Concept A · minimal', langAria: 'Switch language', mock: 'Mock data · real entity IDs',
        home: 'Home', rooms: 'Rooms', energy: 'Energy', security: 'Cameras & security', lighting: 'Lighting studio', climate: 'Climate', network: 'Network', health: 'House health', alerts: 'Alerts', bills: 'Bills',
        day: 'Thu', weather: 'Partly cloudy', hilo: 'H 19° · L 9°', energyNow: 'Energy now',
        solar: 'Solar', gridImport: 'Grid import', export: 'Export', noSource: 'No source entity', inside: 'Inside', livingRoom: 'Living room', today: 'Today',
        attention: 'Needs attention', house: 'The house', oneTap: 'One tap',
        a1: 'Front door battery 12%', a1m: 'Living room', a2: 'Electricity bill unpaid', a2m: 'Bills', a3: '2 cameras offline', a3m: 'East wall, Stockroom',
        hSec: 'Security', hSecV: '3 online · 2 offline · 1 unknown', hLight: 'Lighting', hLightV: '3 on · 9 not reporting', hClim: 'Climate', hClimV: "Parents' air-con off · 23.2°", hPeople: 'People', hPeopleV: 'Ray, Ai home · Vinh away',
        s1: 'Living room bright', s2: 'Dining relax', s3: "Ray's nightlight", s4: 'Air purifier', s5: "Parents' air-con", scene: 'Scene', on: 'On', off: 'Off' },
      zh: { navLabel: '主导航', conceptA: '方案 A · 极简', langAria: '切换语言', mock: '模拟数据 · 真实实体 ID',
        home: '首页', rooms: '房间', energy: '能源', security: '摄像头与安防', lighting: '灯光工作室', climate: '气候', network: '网络', health: '房屋健康', alerts: '警报', bills: '账单',
        day: '周四', weather: '多云', hilo: '最高 19° · 最低 9°', energyNow: '实时能源',
        solar: '太阳能', gridImport: '电网用电', export: '送电上网', noSource: '无数据源', inside: '室内', livingRoom: '客厅', today: '今日',
        attention: '需要注意', house: '房屋状态', oneTap: '一键操作',
        a1: '前门电池 12%', a1m: '客厅', a2: '电费未付', a2m: '账单', a3: '2 个摄像头离线', a3m: '东墙、储藏室',
        hSec: '安防', hSecV: '3 个在线 · 2 个离线 · 1 个未知', hLight: '灯光', hLightV: '3 盏已开 · 9 盏无数据', hClim: '气候', hClimV: '父母房空调已关 · 23.2°', hPeople: '家人', hPeopleV: 'Ray、Ai 在家 · Vinh 外出',
        s1: '客厅明亮', s2: '餐厅放松', s3: 'Ray 卧室夜灯', s4: '空气净化器', s5: '父母房空调', scene: '场景', on: '开', off: '关' }
    };
  }
  renderVals() {
    const lang = this.state.lang;
    const t = this.strings()[lang];
    const I = this.icons();
    const keys = ['home', 'rooms', 'energy', 'security', 'lighting', 'climate', 'network', 'health', 'alerts', 'bills'];
    const nav = keys.map((k) => {
      const cur = k === 'home';
      return {
        label: t[k], icon: I[k], aria: cur ? 'page' : 'false',
        style: 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border: none; border-radius: 8px; text-align: left; font-size: 14px; background: ' + (cur ? 'rgba(201,168,106,0.10)' : 'transparent') + '; color: ' + (cur ? '#e3c894' : '#b9b8b2') + '; font-weight: ' + (cur ? '600' : '400')
      };
    });
    const dot = (c) => 'width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: ' + c;
    const attention = [
      { title: t.a1, meta: t.a1m, dot: dot('var(--alert)') },
      { title: t.a2, meta: t.a2m, dot: dot('var(--active)') },
      { title: t.a3, meta: t.a3m, dot: dot('var(--off)') }
    ];
    const house = [
      { icon: I.security, label: t.hSec, value: t.hSecV },
      { icon: I.lighting, label: t.hLight, value: t.hLightV },
      { icon: I.climate, label: t.hClim, value: t.hClimV },
      { icon: I.people, label: t.hPeople, value: t.hPeopleV }
    ];
    const on = this.state.on;
    const mk = (id, label, icon, toggle, isOn) => ({
      label, icon,
      state: toggle ? (isOn ? t.on : t.off) : t.scene,
      pressed: toggle ? (isOn ? 'true' : 'false') : 'false',
      tap: () => { if (toggle) this.setState({ on: Object.assign({}, on, { [id]: !isOn }) }); },
      style: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 10px; text-align: left; background: transparent; border: 1px solid ' + (isOn ? 'rgba(217,164,65,0.55)' : 'var(--line2)') + '; color: ' + (isOn ? '#e9bd62' : 'var(--ink)')
    });
    const scenes = [
      mk('bright', t.s1, I.sun, false, false),
      mk('relax', t.s2, I.lighting, false, false),
      mk('night', t.s3, I.moon, false, false),
      mk('purifier', t.s4, I.fan, true, !!on.purifier),
      mk('ac', t.s5, I.climate, true, !!on.ac)
    ];
    return {
      t, nav, attention, house, scenes,
      toggleLang: () => this.setState({ lang: lang === 'en' ? 'zh' : 'en' }),
      enStyle: lang === 'en' ? 'color: #ecebe6; font-weight: 600' : 'color: #8d8c87',
      zhStyle: lang === 'zh' ? 'color: #ecebe6; font-weight: 600' : 'color: #8d8c87'
    };
  }
}
</script>
</body>
</html>
