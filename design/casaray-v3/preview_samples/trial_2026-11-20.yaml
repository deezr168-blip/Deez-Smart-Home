# SAMPLE DATA — shaped on the 20/11/26 live trial of casaray-v3-mockup, for the
# OFFLINE preview renders only (scripts/v3/preview_view.py --sample). Never read
# by the dashboard build and never a live reading. Every render made with this
# file is captioned as simulated.
#
# Purpose: the cases the trial raised, all at once — entity IDs the instance does
# not have, a reading that answers "unknown", and each camera state side by side.
# Shaped on the owner's wall-iPad photos of 20/11/26 07:29-07:30 (7370ad7 imported)
# and read-only connector reads: where a value matches one it says "photo" or
# "connector"; the rest are chosen to exercise a branch, not observed.
label: 試行模擬 Trial-shaped sample — SIMULATED, not Home Assistant
now: "2026-11-20T07:30:00"   # photo
# entities the instance is taken NOT to have: Home Assistant reads them as
# 'unknown', and a tile or picture card for one draws its warning card
missing:
  - weather.forecast_home                         # photo: 無資料 (missing or dark; a template cannot tell)
  - light.living_room                             # photo: Rooms says 無資料 while the connector's
  - light.dining                                  #   "Living room" / "Dining" lights read off — other IDs
  - camera.tapo_c425_north_wall_hd_stream_direct  # photo: the slot vanished (Core hid both cards)
  - camera.tapo_c420_east_wall_hd_stream_direct   # photo: vanished; connector: "East Wall HD Stream" idle
  - camera.tapo_c420_south_wall_hd_stream_direct  # photo: vanished; connector: "South Wall HD Stream" idle
  - camera.smart_pet_feeder                       # photo: vanished; connector: "Smart Pet Feeder" idle
states:
  binary_sensor.f_contact_sensor_door: "off"                  # connector, 19/11
  light.bedroom_bedroom: "off"                                # photo
  light.bedroom_nightlight: "off"                             # photo
  sensor.bedroom_motion_sensor_temperature: "23.6"            # photo
  sensor.bedroom_motion_sensor_humidity: "70"                 # photo
  binary_sensor.k_motion_sensor_motion: "off"                 # photo
  sensor.g_monitor_freezer_p110m_current_consumption: "2"     # photo
  switch.g_printer_p100: "on"                                 # photo
  climate.bedroom_parents_room_ac: "off"                      # photo
  binary_sensor.bedroom_parents_room_ac_filter_clean_required: "off"   # connector, 19/11
  switch.bedroom_parents_room_ac_timer: "off"                 # connector, 19/11
  sensor.bedroom_parents_room_ac_timer_end_time: unknown
  sensor.living_room_living_hue_hue_sensor_temperature: unknown   # connector, 20/11 ("Living Room Motion Sensor Temperature")
  camera.front_door_live_view: idle                           # connector, 19/11 — state only; the stream is unverified
  camera.tapo_c200_stockroom_hd_stream_direct: idle          # photo (picture shown)
  sensor.front_door_battery: "65"                             # connector, 20/11
  sensor.tapo_camera_bcca_battery: "80"
  sensor.tapo_c420_south_wall_battery: unavailable
attrs:
  climate.bedroom_parents_room_ac: {current_temperature: 23.8}   # photo: 24°C, target 無資料
  sensor.bedroom_motion_sensor_temperature: {unit_of_measurement: "°C"}
  sensor.bedroom_motion_sensor_humidity: {unit_of_measurement: "%"}
  sensor.g_monitor_freezer_p110m_current_consumption: {unit_of_measurement: W}
pictures:
  badge: 示例圖片 Sample image (mockup)
  source: docs/mockups/2026-11-19_bilingual_2_cameras.png
  crops:   # [left, top, right, bottom] in the sheet's pixels; the illustration only
    camera.front_door_live_view: [156, 80, 350, 154]
    camera.tapo_c200_stockroom_hd_stream_direct: [156, 325, 350, 399]
