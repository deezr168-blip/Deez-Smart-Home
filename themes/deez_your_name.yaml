  primary-color: "#f0a860"
  accent-color: "#ffc98a"
  ha-card-border-color: "rgba(240, 168, 96, 0.20)"

"Deez Lighting":
  <<: *deez_base
  primary-color: "#ffc98a"
  accent-color: "#f0a860"
  ha-card-border-color: "rgba(255, 201, 138, 0.20)"

"Deez Security":
  <<: *deez_base
  primary-color: "#b078d8"
  accent-color: "#7fd4f0"
  ha-card-border-color: "rgba(176, 120, 216, 0.20)"
