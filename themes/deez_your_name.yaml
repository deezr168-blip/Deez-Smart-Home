  primary-color: "#6fb4e8"
  accent-color: "#7fd4f0"
  ha-card-border-color: "rgba(127, 212, 240, 0.20)"

"Deez Climate":
  <<: *deez_base
  primary-color: "#5ec8e8"
  accent-color: "#7fd4f0"
  ha-card-border-color: "rgba(94, 200, 232, 0.20)"

"Deez Energy":
